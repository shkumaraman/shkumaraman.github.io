<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nandita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --text-main: #111113;
    --text-muted: #66666e;
    --accent: #111113;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background: var(--bg);
    color: var(--text-main);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
  }

  header {
    width: 100%;
    max-width: 1100px;
    padding: 22px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
  }

  .logo {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .nav-btn {
    text-decoration: none;
    color: #ffffff;
    background: var(--accent);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .nav-btn:hover {
    transform: translateY(-1px);
    opacity: 0.9;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    padding: 10px 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .character-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 800;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--text-main);
    line-height: 1.1;
    margin-bottom: 8px;
    z-index: 20;
  }

  .stage-wrapper {
    position: relative;
    width: min(84vw, 410px);
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 14px;
  }

  #loader {
    position: absolute;
    font-size: 13px;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    font-weight: 600;
  }

  /* 6x5 Sprite Sheet Container */
  .character-box {
    position: relative;
    width: 100%;
    height: 100%;
    background-size: 600% 500%;
    background-position: 80% 50%;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.4s ease;
    mix-blend-mode: multiply;
  }

  .character-box.loaded {
    opacity: 1;
  }

  /* Interactive Hitboxes */
  .hitbox {
    position: absolute;
    cursor: pointer;
    z-index: 15;
    border-radius: 50%;
  }

  .debug .hitbox {
    border: 1.5px dashed #ff3b30;
    background: rgba(255, 59, 48, 0.15);
  }

  #left-eye-zone {
    top: 40%;
    left: 34%;
    width: 13%;
    height: 10%;
  }

  #right-eye-zone {
    top: 40%;
    left: 53%;
    width: 13%;
    height: 10%;
  }

  #lip-zone {
    top: 60%;
    left: 41%;
    width: 18%;
    height: 9%;
    border-radius: 40px;
  }

  .hero-text {
    max-width: 520px;
    z-index: 20;
  }

  .hero-text p {
    font-size: clamp(14px, 2vw, 16px);
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 22px;
  }

  .cta-group {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary, .btn-secondary {
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #ffffff;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  }

  .btn-secondary {
    background: #f4f4f6;
    color: var(--text-main);
  }

  .btn-secondary:hover {
    background: #e8e8ed;
  }

  footer {
    padding: 16px;
    font-size: 12px;
    color: #9999a1;
    text-align: center;
  }
</style>
</head>
<body>

  <header>
    <div class="logo">Nandita</div>
    <a href="#contact" class="nav-btn">Say Hello</a>
  </header>

  <main>
    <h1 class="character-title">NANDITA</h1>

    <div class="stage-wrapper" id="stage">
      <div id="loader">LOADING...</div>
      <div class="character-box" id="character">
        <div class="hitbox" id="left-eye-zone" title="Left Eye"></div>
        <div class="hitbox" id="right-eye-zone" title="Right Eye"></div>
        <div class="hitbox" id="lip-zone" title="Smile"></div>
      </div>
    </div>

    <div class="hero-text">
      <p>Move your cursor around, hover on the eyes to wink, or hover on the lips to smile.</p>
      <div class="cta-group">
        <a href="#work" class="btn-primary">Explore Work</a>
        <a href="#about" class="btn-secondary">About Nandita</a>
      </div>
    </div>
  </main>

  <footer>Move cursor or drag finger to interact</footer>

<script>
  /* Configuration */
  const SPRITE_FILE = 'character.png';
  const DEBUG_ZONES = false; // Set to true to visualize hitbox alignment

  /* Grid & Frame Mapping (6 Columns x 5 Rows) */
  const COLS = 6;
  const ROWS = 5;
  const FPS = 18;
  const FRAME_DELAY = 1000 / FPS;

  const CENTER_FRAME = 14;
  const SMILE_FRAMES = [5, 11, 17];
  const LEFT_EYE_WINK = 23;
  const RIGHT_EYE_WINK = 29;

  const stage = document.getElementById('stage');
  const charBox = document.getElementById('character');
  const loader = document.getElementById('loader');
  const leftEyeZone = document.getElementById('left-eye-zone');
  const rightEyeZone = document.getElementById('right-eye-zone');
  const lipZone = document.getElementById('lip-zone');

  if (DEBUG_ZONES) stage.classList.add('debug');

  let activeReaction = null;
  let reactionInterval = null;
  let currentFrame = CENTER_FRAME;

  /* Preload Sprite Sheet */
  charBox.style.backgroundImage = `url('${SPRITE_FILE}')`;
  const img = new Image();
  img.src = SPRITE_FILE;
  img.onload = () => {
    loader.style.display = 'none';
    charBox.classList.add('loaded');
    setFrame(CENTER_FRAME);
  };
  img.onerror = () => {
    loader.textContent = `FILE NOT FOUND: ${SPRITE_FILE}`;
  };

  function setFrame(index) {
    currentFrame = index;
    const col = index % COLS;
    const row = Math.floor(index / COLS);
    const posX = (col / (COLS - 1)) * 100;
    const posY = (row / (ROWS - 1)) * 100;
    charBox.style.backgroundPosition = `${posX}% ${posY}%`;
  }

  function playSequence(frames, onComplete) {
    clearInterval(reactionInterval);
    let step = 0;
    setFrame(frames[step]);

    reactionInterval = setInterval(() => {
      step++;
      if (step < frames.length) {
        setFrame(frames[step]);
      } else {
        clearInterval(reactionInterval);
        if (onComplete) onComplete();
      }
    }, FRAME_DELAY);
  }

  /* Gaze Tracking (Mouse & Touch) */
  function updateGaze(clientX, clientY) {
    if (activeReaction) return;

    const rect = charBox.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const maxDist = Math.min(window.innerWidth, window.innerHeight) / 2.2;
    let normX = (clientX - centerX) / maxDist;
    let normY = (clientY - centerY) / maxDist;

    normX = Math.max(-1, Math.min(1, normX));
    normY = Math.max(-1, Math.min(1, normY));

    const gridX = Math.round((normX + 1) * 2);
    const gridY = Math.round((normY + 1) * 2);

    const frameIndex = gridY * COLS + gridX;
    if (frameIndex !== currentFrame) {
      setFrame(frameIndex);
    }
  }

  window.addEventListener('mousemove', (e) => updateGaze(e.clientX, e.clientY));

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      updateGaze(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: true });

  /* Lip Smile Handlers */
  function triggerSmile() {
    if (activeReaction === 'smile') return;
    activeReaction = 'smile';
    playSequence(SMILE_FRAMES);
  }

  function resetSmile() {
    if (activeReaction !== 'smile') return;
    playSequence([...SMILE_FRAMES].reverse().concat(CENTER_FRAME), () => {
      activeReaction = null;
    });
  }

  lipZone.addEventListener('mouseenter', triggerSmile);
  lipZone.addEventListener('mouseleave', resetSmile);
  lipZone.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    triggerSmile();
    setTimeout(resetSmile, 1200);
  });

  /* Left Eye Wink Handlers */
  function triggerLeftWink() {
    clearInterval(reactionInterval);
    activeReaction = 'left-wink';
    setFrame(LEFT_EYE_WINK);
  }

  function resetLeftWink() {
    if (activeReaction !== 'left-wink') return;
    setFrame(CENTER_FRAME);
    activeReaction = null;
  }

  leftEyeZone.addEventListener('mouseenter', triggerLeftWink);
  leftEyeZone.addEventListener('mouseleave', resetLeftWink);
  leftEyeZone.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    triggerLeftWink();
    setTimeout(resetLeftWink, 800);
  });

  /* Right Eye Wink Handlers */
  function triggerRightWink() {
    clearInterval(reactionInterval);
    activeReaction = 'right-wink';
    setFrame(RIGHT_EYE_WINK);
  }

  function resetRightWink() {
    if (activeReaction !== 'right-wink') return;
    setFrame(CENTER_FRAME);
    activeReaction = null;
  }

  rightEyeZone.addEventListener('mouseenter', triggerRightWink);
  rightEyeZone.addEventListener('mouseleave', resetRightWink);
  rightEyeZone.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    triggerRightWink();
    setTimeout(resetRightWink, 800);
  });
</script>

</body>
</html>
