<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<title>TalkRush Arena</title>
<style>
:root{
  --accent:#ff6b4a;--accent-hover:#ff5535;--accent-dim:rgba(255,107,74,.15);
  --accent-border:rgba(255,107,74,.25);--success:#22c55e;--error:#ff6b6b;
  --bg:#111114;--card:#1a1a1e;--border:rgba(255,255,255,.08);--text:#fff;--muted:rgba(255,255,255,.4);
  --input:rgba(255,255,255,.05);--input-focus:rgba(255,255,255,.08);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#08080a;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
svg{pointer-events:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chip{background:rgba(26,26,30,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:.5px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
#status{font-size:11px;color:var(--muted)}
#status.ok{color:var(--success)}
#mini{width:90px;height:90px;border-radius:12px;border:.5px solid var(--border);background:rgba(17,17,20,.7)}
#lb{background:rgba(26,26,30,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:.5px solid var(--border);border-radius:12px;padding:8px 10px;min-width:118px;font-size:11px}
#lb h4{margin:0 0 5px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lbrow{display:flex;gap:6px;align-items:center;padding:1.5px 0;white-space:nowrap}
.lbrow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.lbrow .nm{flex:1;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.lbrow.me{color:var(--accent);font-weight:700}
.lbrow .sc{color:var(--muted);font-variant-numeric:tabular-nums}
#nitroWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 30px);width:26%;max-width:140px;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;z-index:5;pointer-events:none}
#nitroBar{height:100%;width:100%;background:linear-gradient(90deg,#ff6b4a,#ffd54a);border-radius:8px}
#hint{position:fixed;bottom:calc(var(--sab) + 8px);width:100%;text-align:center;font-size:11px;color:var(--muted);pointer-events:none;z-index:4}
@media (pointer:coarse){#hint{display:none}}
#joy{position:fixed;left:18px;bottom:calc(var(--sab) + 26px);width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.14);z-index:6;touch-action:none}
#stick{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:var(--accent);opacity:.85;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
.pad{position:fixed;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:6;touch-action:none;border:.5px solid rgba(255,255,255,.18);color:#fff}
#btnNitro{right:20px;bottom:calc(var(--sab) + 44px);width:84px;height:84px;background:var(--accent);box-shadow:0 6px 20px rgba(255,107,74,.35)}
#btnBrake{right:114px;bottom:calc(var(--sab) + 28px);width:62px;height:62px;background:rgba(255,255,255,.1)}
.pad.down{transform:scale(.92);filter:brightness(1.25)}
#btnChat{position:fixed;right:20px;bottom:calc(var(--sab) + 146px);z-index:6;width:46px;height:46px;border-radius:50%;background:rgba(26,26,30,.85);border:.5px solid var(--border);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;padding:0}
#badge{position:absolute;top:-4px;right:-4px;background:var(--error);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px}
#chatLog{position:fixed;left:14px;bottom:calc(var(--sab) + 180px);max-width:66%;display:flex;flex-direction:column;gap:4px;z-index:5;pointer-events:none}
.cmsg{background:rgba(17,17,20,.72);border-radius:12px;padding:5px 10px;font-size:12.5px;line-height:1.3;word-break:break-word;animation:fadein .2s}
.cmsg b{font-weight:700;margin-right:5px}
.cmsg.sys{color:var(--muted);font-style:italic;background:transparent;padding:2px 4px}
.cmsg.fade{opacity:0;transition:opacity .8s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100000;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .3s ease;touch-action:auto}
.sheet.show{opacity:1}
.sheet-content{background:var(--bg);border-radius:20px 20px 0 0;border-top:.5px solid var(--border);width:100%;max-width:480px;max-height:82vh;overflow-y:auto;box-shadow:0 -8px 32px rgba(0,0,0,.6);transform:translateY(100%);transition:transform .3s cubic-bezier(.1,.9,.2,1);user-select:text;-webkit-user-select:text}
.sheet.show .sheet-content{transform:none}
.handle{width:100%;padding:12px 0 8px;display:flex;justify-content:center}
.handle i{width:40px;height:4px;background:var(--muted);border-radius:4px;opacity:.5}
.sheet-head{display:flex;justify-content:center;padding:0 20px 14px}
.sheet-head h2{margin:0;font-size:18px;font-weight:700}
.chat-input{width:100%;padding:12px 14px;border-radius:10px;border:.5px solid var(--border);background:var(--input);color:var(--text);font-size:14px;outline:none;transition:all .2s;font-family:inherit}
.chat-input:focus{border-color:var(--accent);background:var(--input-focus)}
.btn{background:var(--accent);color:#fff;border:none;padding:12px 0;border-radius:11px;cursor:pointer;font-weight:700;font-size:14px;width:100%;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--accent-hover)}
#chatHist{height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:0 20px 8px;font-size:13.5px}
#chatHist .m{background:var(--card);border-radius:12px;padding:7px 11px;word-break:break-word;line-height:1.35}
#chatHist .m b{margin-right:6px}
#chatHist .m.sys{background:transparent;color:var(--muted);font-style:italic;text-align:center;font-size:12px}
.quick{display:flex;gap:6px;overflow-x:auto;padding:0 20px 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.q{flex-shrink:0;background:var(--accent-dim);color:var(--accent);border:.5px solid var(--accent-border);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
.chat-row{display:flex;gap:8px;padding:0 20px calc(16px + var(--sab))}
.chat-row .btn{width:80px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="col">
    <div class="chip">
      <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd54a"/><circle cx="12" cy="12" r="5" fill="#c99a10"/></svg>
      <b id="score">0</b>
    </div>
    <canvas id="mini" width="180" height="180"></canvas>
  </div>
  <div style="flex:1;text-align:center"><span id="status">Finding match…</span></div>
  <div id="lb"><h4>Top Racers</h4><div id="lbRows"></div></div>
</div>

<div id="chatLog"></div>
<div id="nitroWrap"><div id="nitroBar"></div></div>
<div id="hint">WASD / Arrows drive · Space nitro · Shift drift · Enter chat</div>

<div id="joy"><div id="stick"></div></div>

<div class="pad" id="btnBrake" aria-label="Drift">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 21c0-6 4-8 6-11s2-5 2-7"/>
    <path d="M13 21c0-5 3-7 5-10s1.5-5 1.5-8"/>
  </svg>
</div>

<div class="pad" id="btnNitro" aria-label="Nitro">
  <svg width="42" height="42" viewBox="0 0 24 24" fill="currentColor">
    <path d="M13.5 2 5 13.5h5.2L9 22l9-12h-5.4z"/>
  </svg>
</div>

<button id="btnChat" aria-label="Chat">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
    <path d="M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9.5L5 21.5V17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
  </svg>
  <span id="badge">0</span>
</button>

<div class="sheet" id="chatSheet">
  <div class="sheet-content">
    <div class="handle"><i></i></div>
    <div class="sheet-head"><h2 id="chatTitle">Arena Chat</h2></div>
    <div id="chatHist"></div>
    <div class="quick" id="quick"></div>
    <div class="chat-row">
      <input class="chat-input" id="chatInput" maxlength="140" placeholder="Say something…" aria-label="Chat message" autocomplete="off">
      <button class="btn" id="chatSend">Send</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, get, remove, onValue, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

(() => {
'use strict';

const APP_NAME = 'TalkRushGameApp';
const firebaseConfig = {
  databaseURL: 'https://talkrush3-default-rtdb.asia-southeast1.firebasedatabase.app'
};

const $ = id => document.getElementById(id);
const W = 3000, H = 3000, R = 20;
const GAME_NAME = 'racing';
const ROOMS_PATH = 'games/' + GAME_NAME + '/rooms';
const PEERS_PATH = 'games/' + GAME_NAME + '/peers';
const MAX_HUMANS = 10, MIN_CARS = 5;
const NICK_KEY = 'talkrush_nickname';
const COLORS = ['#ff6b4a', '#ffd54a', '#4ade80', '#38bdf8', '#a78bfa', '#f472b6', '#fb923c', '#e5e7eb'];
const BOT_NAMES = ['Turbo', 'Drifty', 'Nitro', 'Zoomer', 'Rocket', 'Skid', 'Blaze', 'Dash'];

const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const stripTR = s => String(s || '').replace(/^(\s*TR\|)+/i, '');
function angDiff(a, b){
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}
const safeColor = c => /^#[0-9a-f]{6}$/i.test(c || '') ? c : COLORS[0];
const cleanNick = s => String(s || '').replace(/[ ​-‍﻿]/g, '').replace(/\s+/g, ' ').trim().slice(0, 20) || 'Racer';
function colorFor(name){
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return COLORS[Math.abs(h) % COLORS.length];
}

const me = { nick: cleanNick(stripTR(store.get(NICK_KEY))) };
if (!stripTR(store.get(NICK_KEY)).trim()) me.nick = 'Guest' + Math.floor(100 + Math.random() * 900);
me.color = colorFor(me.nick);

let banned = [];
fetch('/chat/filter.txt').then(r => r.text()).then(t => {
  banned = t.split('\n').map(w => w.trim().toLowerCase()).filter(w => w.length > 1);
}).catch(() => {});
function maskBanned(s){
  banned.forEach(w => {
    s = s.replace(new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi'), m => '*'.repeat(m.length));
  });
  return s;
}

let actx = null;
const muted = () => store.get('soundMuted') === 'true';
function beep(f1, f2, dur, type, vol){
  if (muted()) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(vol || .08, t);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t);
    o.stop(t + dur);
  } catch {}
}
const sfx = {
  bump: s => beep(140, 50, .14, 'square', .05 + s * .1),
  coin: () => beep(880, 1320, .12, 'triangle', .07),
  chat: () => beep(660, 780, .07, 'sine', .05),
  join: () => beep(440, 660, .12, 'sine', .05)
};

const players = new Map();
let coins = [];
let myPid = null;
let isHost = false;
let nextPid = 1;
const evq = [];

function mkPlayer(pid, n, c, bot){
  return {
    pid, n, c, bot: !!bot,
    x: rand(300, W - 300), y: rand(300, H - 300), a: rand(0, 6.28), vx: 0, vy: 0,
    peerId: '', score: 0, nitro: 100, boost: 0, in: { ax: 0, ay: 0, s: 0, t: 0, n: 0, b: 0 },
    rx: null, ry: 0, ra: 0, st: 0, lastChat: 0, tgt: null, tt: 0
  };
}
const humans = () => [...players.values()].filter(p => !p.bot);

function stepCar(p, dt){
  const i = p.in;
  let s = i.s, t = i.t;
  const m = Math.hypot(i.ax, i.ay);
  let fx = Math.cos(p.a), fy = Math.sin(p.a);
  let fs = p.vx * fx + p.vy * fy, ls = -p.vx * fy + p.vy * fx;
  if (m > .15){
    const d = angDiff(Math.atan2(i.ay, i.ax), p.a);
    s = clamp(d * 2.2, -1, 1);
    t = Math.min(1, m * 1.25);
    if (Math.abs(d) > 1.6) t *= .35;
  }
  let acc = 0, boost = false;
  if (t > 0) acc = 560 * t;
  else if (t < 0) acc = fs > 10 ? 900 * t : 360 * t;
  if (i.n && p.nitro > 1 && t > 0){ boost = true; p.nitro -= 40 * dt; acc += 620; }
  else p.nitro = Math.min(100, p.nitro + 9 * dt);
  fs += acc * dt;
  fs -= fs * .9 * dt;
  if (i.b) fs -= fs * 2.2 * dt;
  const cap = boost ? 620 : 360;
  if (fs > cap) fs -= (fs - cap) * Math.min(1, 6 * dt);
  fs = Math.max(fs, -140);
  ls *= Math.exp(-(i.b ? 1.2 : 5.5) * dt);
  const dir = fs < -5 ? -1 : 1;
  p.a += s * 3.4 * (.25 + .75 * clamp(Math.abs(fs) / 160, 0, 1)) * dir * dt;
  if (i.b) p.a += s * 1.2 * dir * dt;
  fx = Math.cos(p.a);
  fy = Math.sin(p.a);
  p.vx = fx * fs - fy * ls;
  p.vy = fy * fs + fx * ls;
  p.x += p.vx * dt;
  p.y += p.vy * dt;
  if (p.x < R){ p.x = R; p.vx = Math.abs(p.vx) * .5; }
  else if (p.x > W - R){ p.x = W - R; p.vx = -Math.abs(p.vx) * .5; }
  if (p.y < R){ p.y = R; p.vy = Math.abs(p.vy) * .5; }
  else if (p.y > H - R){ p.y = H - R; p.vy = -Math.abs(p.vy) * .5; }
  p.boost = boost ? 1 : 0;
}
function collide(list){
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++){
    const a = list[i], b = list[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= 2 * R || d < .001) continue;
    const nx = dx / d, ny = dy / d, ov = 2 * R - d;
    a.x -= nx * ov / 2; a.y -= ny * ov / 2;
    b.x += nx * ov / 2; b.y += ny * ov / 2;
    const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rv < 0){
      const k = -1.9 * rv / 2;
      a.vx -= k * nx; a.vy -= k * ny;
      b.vx += k * nx; b.vy += k * ny;
      if (-rv > 70) evq.push(['b', Math.round((a.x + b.x) / 2), Math.round((a.y + b.y) / 2), +Math.min(1, -rv / 500).toFixed(2)]);
    }
  }
}
function botAI(p, dt){
  p.tt -= dt;
  if (p.tt <= 0 || !p.tgt){
    p.tt = rand(.6, 1.5);
    let best = null, bd = 1e9;
    for (const c of coins){
      const d = Math.hypot(c.x - p.x, c.y - p.y);
      if (d < bd){ bd = d; best = c; }
    }
    p.tgt = best;
  }
  if (!p.tgt) return;
  const dx = p.tgt.x - p.x, dy = p.tgt.y - p.y, d = Math.hypot(dx, dy) || 1;
  p.in = { ax: dx / d * .9, ay: dy / d * .9, s: 0, t: 0, n: (d > 600 && p.nitro > 40) ? 1 : 0, b: 0 };
}
function simStep(dt){
  const list = [...players.values()];
  for (const p of list){ if (p.bot) botAI(p, dt); stepCar(p, dt); }
  collide(list);
  for (const p of list) for (const c of coins){
    if (Math.hypot(c.x - p.x, c.y - p.y) < R + 14){
      p.score++;
      p.nitro = Math.min(100, p.nitro + 18);
      evq.push(['c', Math.round(c.x), Math.round(c.y), p.pid]);
      c.x = rand(150, W - 150);
      c.y = rand(150, H - 150);
    }
  }
  const now = performance.now();
  for (const p of list) p.st = now;
}
function initCoins(){ coins = Array.from({ length: 28 }, () => ({ x: rand(150, W - 150), y: rand(150, H - 150) })); }

const NET = { peer: null, conns: new Map(), hostConn: null, retry: null, inputTimer: null, simTimer: null, hb: null, roomRef: null, peerRef: null, beat: null };
let roomLabel = '';
function setStatus(t, ok){
  const el = $('status');
  el.textContent = t;
  el.classList.toggle('ok', !!ok);
}
function updateOnline(){ if (roomLabel) setStatus('● ' + roomLabel + ' · ' + humans().length + ' online', true); }

let db = null, clockOffset = 0;
try {
  const app = getApps().find(x => x.name === APP_NAME) || initializeApp(firebaseConfig, APP_NAME);
  db = getDatabase(app);
  onValue(ref(db, '.info/serverTimeOffset'), snap => { clockOffset = snap.val() || 0; });
} catch { db = null; }

function findRooms(){
  return get(ref(db, ROOMS_PATH)).then(snap => {
    const now = Date.now() + clockOffset, out = [];
    snap.forEach(ch => {
      const r = ch.val();
      if (r && r.host && now - r.ts < 20000 && r.n < MAX_HUMANS) out.push({ host: r.host, n: r.n });
    });
    return out.sort((a, b) => b.n - a.n);
  });
}
function registerPeer(peerId, roomId){
  const r = ref(db, PEERS_PATH + '/' + peerId);
  NET.peerRef = r;
  onDisconnect(r).remove();
  set(r, { n: me.nick, room: roomId, ts: serverTimestamp() });
}
function roomPlayers(){
  const o = {};
  for (const p of humans()) if (p.peerId) o[p.peerId] = p.n;
  return o;
}
function registerRoom(peerId){
  const r = push(ref(db, ROOMS_PATH));
  NET.roomRef = r;
  NET.beat = () => set(r, { host: peerId, hostNick: me.nick, n: humans().length, players: roomPlayers(), ts: serverTimestamp() });
  onDisconnect(r).remove();
  NET.beat();
  NET.hb = setInterval(NET.beat, 5000);
}

function rosterList(){ return [...players.values()].map(p => ({ pid: p.pid, n: p.n, c: p.c, bot: p.bot ? 1 : 0 })); }
function broadcast(obj){ for (const c of NET.conns.values()) if (c.open) { try { c.send(obj); } catch {} } }
function broadcastRoster(){ broadcast({ t: 'roster', list: rosterList() }); updateOnline(); if (NET.beat) NET.beat(); }
function addPlayer(n, c, bot){
  const pid = nextPid++;
  const p = mkPlayer(pid, n, c, bot);
  p.rx = p.x; p.ry = p.y; p.ra = p.a; p.st = performance.now();
  players.set(pid, p);
  return pid;
}
function fillBots(){
  const want = Math.max(0, MIN_CARS - humans().length);
  const bots = [...players.values()].filter(p => p.bot);
  while (bots.length > want) players.delete(bots.pop().pid);
  while (bots.length < want){
    const name = BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)];
    const pid = addPlayer('🤖 ' + name, COLORS[Math.floor(Math.random() * COLORS.length)], true);
    bots.push(players.get(pid));
  }
}
function sys(m){
  const msg = { t: 'chat', sys: 1, m };
  broadcast(msg);
  showChat(msg);
}
function hostChat(pid, text){
  const p = players.get(pid);
  if (!p) return;
  const now = Date.now();
  if (now - p.lastChat < 600) return;
  p.lastChat = now;
  text = maskBanned(String(text || '').replace(/\s+/g, ' ').trim().slice(0, 140));
  if (!text) return;
  const msg = { t: 'chat', pid, n: p.n, c: p.c, m: text };
  broadcast(msg);
  showChat(msg);
}
function setInput(p, d){
  if (!p) return;
  const f = v => clamp(+v || 0, -1, 1);
  p.in = { ax: f(d.ax), ay: f(d.ay), s: f(d.s), t: f(d.t), n: d.n ? 1 : 0, b: d.b ? 1 : 0 };
}
function snapshot(){
  return {
    t: 's',
    p: [...players.values()].map(p => [p.pid, Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10, Math.round(p.a * 100) / 100, Math.round(p.vx), Math.round(p.vy), p.score, Math.round(p.nitro), p.boost]),
    c: coins.map(c => [Math.round(c.x), Math.round(c.y)]),

function startHost(peer, label){
  isHost = true;
  NET.peer = peer;
  players.clear();
  nextPid = 1;
  myPid = addPlayer(me.nick, me.color, false);
  players.get(myPid).peerId = peer.id;
  initCoins();
  fillBots();
  roomLabel = label;
  updateOnline();
  rebuildLB();
  registerRoom(peer.id);
  registerPeer(peer.id, peer.id);

  peer.on('connection', conn => {
    let pid = null;
    const drop = () => {
      if (pid == null) return;
      const p = players.get(pid);
      if (!p) return;
      players.delete(pid);
      NET.conns.delete(pid);
      fillBots();
      broadcastRoster();
      sys(p.n + ' left');
      pid = null;
    };
    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'hello'){
        if (pid != null) return;
        if (humans().length >= MAX_HUMANS){
          try { conn.send({ t: 'full' }); } catch {}
          setTimeout(() => conn.close(), 400);
          return;
        }
        pid = addPlayer(cleanNick(d.n), safeColor(d.c), false);
        players.get(pid).peerId = conn.peer;
        conn.pid = pid;
        NET.conns.set(pid, conn);
        fillBots();
        conn.send({ t: 'welcome', pid, roster: rosterList() });
        broadcastRoster();
        sys(players.get(pid).n + ' joined');
      } else if (pid == null) return;
      else if (d.t === 'in') setInput(players.get(pid), d);
      else if (d.t === 'chat') hostChat(pid, d.m);
    });
    conn.on('close', drop);
    conn.on('error', drop);
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch {} });
  peer.on('error', e => console.warn('host peer error', e.type));

  let last = performance.now(), acc = 0, snapAcc = 0;
  clearInterval(NET.simTimer);
  NET.simTimer = setInterval(() => {
    const now = performance.now();
    acc += Math.min(.25, (now - last) / 1000);
    snapAcc += (now - last) / 1000;
    last = now;
    setInput(players.get(myPid), readInput());
    while (acc >= 1 / 60){ simStep(1 / 60); acc -= 1 / 60; }
    if (snapAcc >= 1 / 20){
      snapAcc = 0;
      const s = snapshot();
      broadcast(s);
      applyEvents(s.ev);
    }
  }, 16);
}

function applySnapshot(d){
  const now = performance.now();
  for (const a of d.p){
    const p = players.get(a[0]);
    if (!p) continue;
    p.x = a[1]; p.y = a[2]; p.a = a[3]; p.vx = a[4]; p.vy = a[5]; p.score = a[6]; p.nitro = a[7]; p.boost = a[8]; p.st = now;
  }
  coins = d.c.map(c => ({ x: c[0], y: c[1] }));
  applyEvents(d.ev);
}
function setRoster(list){
  const ids = new Set();
  for (const r of list){
    ids.add(r.pid);
    let p = players.get(r.pid);
    if (!p){
      p = mkPlayer(r.pid, r.n, r.c, r.bot);
      p.x = p.y = -9999;
      players.set(r.pid, p);
    }
    p.n = r.n; p.c = r.c; p.bot = !!r.bot;
  }
  for (const pid of [...players.keys()]) if (!ids.has(pid)) players.delete(pid);
  updateOnline();
  rebuildLB();
}
function cleanupNet(){
  clearInterval(NET.inputTimer);
  clearInterval(NET.simTimer);
  clearInterval(NET.hb);
  clearTimeout(NET.retry);
  try { NET.roomRef && remove(NET.roomRef); NET.peerRef && remove(NET.peerRef); } catch {}
  try { NET.peer && NET.peer.destroy(); } catch {}
  NET.peer = null; NET.hostConn = null; NET.roomRef = null; NET.peerRef = null; NET.beat = null; NET.conns.clear();
  isHost = false;
}
function resetWorld(){ players.clear(); coins = []; myPid = null; roomLabel = ''; }
function retryLater(){
  clearTimeout(NET.retry);
  NET.retry = setTimeout(connectFlow, 700 + Math.random() * 1600);
}

function whenPeer(cb){
  if (window.Peer){ cb(); return; }
  const t = setInterval(() => { if (window.Peer){ clearInterval(t); cb(); } }, 100);
}
function connectFlow(){
  cleanupNet();
  resetWorld();
  setStatus('Finding match…');
  if (!db){ retryLater(); return; }
  whenPeer(() => {
    findRooms().then(list => {
      const tryNext = i => {
        if (i >= list.length){ createRoom(); return; }
        joinClient(list[i].host, 'Arena', () => tryNext(i + 1), () => tryNext(i + 1));
      };
      tryNext(0);
    }).catch(createRoom);
  });
}
function createRoom(){
  const p = new Peer();
  NET.peer = p;
  let ok = false;
  p.on('open', () => { ok = true; startHost(p, 'Arena'); });
  p.on('error', () => {
    if (ok) return;
    try { p.destroy(); } catch {}
    retryLater();
  });
}
function joinClient(hostId, label, onFull, onFail){
  const p = new Peer();
  NET.peer = p;
  isHost = false;
  let done = false, joined = false;
  const fail = () => {
    if (done) return;
    done = true;
    try { p.destroy(); } catch {}
    onFail();
  };
  p.on('error', fail);
  p.on('open', () => {
    const conn = p.connect(hostId, { reliable: true, serialization: 'json' });
    NET.hostConn = conn;
    const to = setTimeout(fail, 7000);
    conn.on('open', () => conn.send({ t: 'hello', n: me.nick, c: me.color }));
    conn.on('error', fail);
    conn.on('close', () => { if (joined) onHostLost(); else fail(); });
    conn.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.t === 'welcome'){
        clearTimeout(to);
        joined = true;
        done = true;
        myPid = d.pid;
        registerPeer(p.id, hostId);
        setRoster(d.roster);
        roomLabel = label;
        updateOnline();
        clearInterval(NET.inputTimer);
        NET.inputTimer = setInterval(() => { if (conn.open) conn.send(Object.assign({ t: 'in' }, readInput())); }, 33);
      } else if (d.t === 'full'){
        clearTimeout(to);
        done = true;
        try { p.destroy(); } catch {}
        onFull();
      } else if (d.t === 'roster') setRoster(d.list);
      else if (d.t === 's') applySnapshot(d);
      else if (d.t === 'chat') showChat(d);
    });
  });
}
function onHostLost(){
  setStatus('Host left — reconnecting…');
  clearInterval(NET.inputTimer);
  try { NET.peer && NET.peer.destroy(); } catch {}
  resetWorld();
  retryLater();
}

const joy = { id: null, ax: 0, ay: 0 }, btn = { n: 0, b: 0 }, keys = new Set();
let chatOpen = false;
function readInput(){
  if (chatOpen) return { ax: 0, ay: 0, s: 0, t: 0, n: 0, b: 0 };
  let s = 0, t = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) s -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) s += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) t += 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) t -= 1;
  const useJoy = Math.hypot(joy.ax, joy.ay) > .15;
  const r2 = v => Math.round(v * 100) / 100;
  return {
    ax: useJoy ? r2(joy.ax) : 0, ay: useJoy ? r2(joy.ay) : 0, s, t,
    n: (btn.n || keys.has('Space')) ? 1 : 0,
    b: (btn.b || keys.has('ShiftLeft') || keys.has('ShiftRight')) ? 1 : 0
  };
}
(function bindControls(){
  const joyEl = $('joy'), stick = $('stick');
  const move = e => {
    const r = joyEl.getBoundingClientRect(), rad = r.width / 2;
    let dx = e.clientX - (r.left + rad), dy = e.clientY - (r.top + rad);
    const m = Math.hypot(dx, dy), k = m > rad ? rad / m : 1;
    dx *= k; dy *= k;
    joy.ax = dx / rad; joy.ay = dy / rad;
    stick.style.transform = `translate(${dx * .85}px,${dy * .85}px)`;
  };
  const reset = () => { joy.id = null; joy.ax = joy.ay = 0; stick.style.transform = ''; };
  joyEl.addEventListener('pointerdown', e => { e.preventDefault(); joy.id = e.pointerId; joyEl.setPointerCapture(e.pointerId); move(e); });
  joyEl.addEventListener('pointermove', e => { if (e.pointerId === joy.id) move(e); });
  joyEl.addEventListener('pointerup', e => { if (e.pointerId === joy.id) reset(); });
  joyEl.addEventListener('pointercancel', reset);
  const hold = (el, k) => {
    const on = e => { e.preventDefault(); btn[k] = 1; el.classList.add('down'); try { el.setPointerCapture(e.pointerId); } catch {} };
    const off = () => { btn[k] = 0; el.classList.remove('down'); };
    el.addEventListener('pointerdown', on);
    el.addEventListener('pointerup', off);
    el.addEventListener('pointercancel', off);
    el.addEventListener('lostpointercapture', off);
  };
  hold($('btnNitro'), 'n');
  hold($('btnBrake'), 'b');
  const typing = () => document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  addEventListener('keydown', e => {
    if (typing()) return;
    if (e.code === 'Enter'){ e.preventDefault(); openChat(); return; }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
  });
  addEventListener('keyup', e => keys.delete(e.code));
  addEventListener('blur', () => keys.clear());
})();

const cv = $('game'), ctx = cv.getContext('2d');
const mini = $('mini'), mctx = mini.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
function resize(){

const cam = { x: W / 2, y: H / 2, z: 1 };
const parts = [];
let shake = 0;
function spawn(x, y, vx, vy, life, size, color, kind){
  if (parts.length < 400) parts.push({ x, y, vx, vy, life, max: life, size, color, kind });
}
function applyEvents(evs){
  const mp = players.get(myPid);
  for (const e of evs || []){
    if (e[0] === 'b'){
      for (let i = 0; i < 8; i++){
        const a = rand(0, 6.28), s = rand(60, 260) * (.4 + e[3]);
        spawn(e[1], e[2], Math.cos(a) * s, Math.sin(a) * s, rand(.2, .45), rand(2, 4), '#ffd54a', 'dot');
      }
      if (mp && mp.rx !== null){
        const d = Math.hypot(e[1] - mp.rx, e[2] - mp.ry);
        if (d < 500){ sfx.bump(e[3]); if (d < 120) shake = Math.max(shake, 6 * e[3] + 2); }
      }
    } else if (e[0] === 'c'){
      for (let i = 0; i < 10; i++){
        const a = rand(0, 6.28), s = rand(40, 140);
        spawn(e[1], e[2], Math.cos(a) * s, Math.sin(a) * s, rand(.3, .6), rand(2, 3.5), '#ffd54a', 'dot');
      }
      if (e[3] === myPid) sfx.coin();
    }
  }
}
function smooth(p, dt, now){
  const e = Math.min(.12, (now - p.st) / 1000);
  const tx = p.x + p.vx * e, ty = p.y + p.vy * e;
  if (p.rx === null || Math.abs(tx - p.rx) > 400 || Math.abs(ty - p.ry) > 400){
    p.rx = tx; p.ry = ty; p.ra = p.a;
    return;
  }
  const k = 1 - Math.exp(-dt * 16);
  p.rx += (tx - p.rx) * k;
  p.ry += (ty - p.ry) * k;
  p.ra += angDiff(p.a, p.ra) * k;
}
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawCar(p, isMe){
  ctx.save();
  ctx.translate(p.rx, p.ry);
  ctx.rotate(p.ra);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-21, -9, 44, 24, 7); ctx.fill();
  ctx.fillStyle = p.c; rr(-22, -12, 44, 24, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(-20, -2, 40, 4);
  ctx.fillStyle = 'rgba(10,10,14,.8)'; rr(-6, -8, 17, 16, 4); ctx.fill();
  ctx.fillStyle = '#fff6c2'; ctx.fillRect(19, -10, 3, 5); ctx.fillRect(19, 5, 3, 5);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(-22, -10, 2, 5); ctx.fillRect(-22, 5, 2, 5);
  if (isMe){ ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; rr(-22, -12, 44, 24, 7); ctx.stroke(); }
  ctx.restore();
}
function drawName(p, isMe){
  const size = Math.round(13 / clamp(cam.z, .7, 1.1));
  ctx.font = '600 ' + size + 'px system-ui,sans-serif';
  const w = ctx.measureText(p.n).width + 12, h = size + 6;
  const x = p.rx - w / 2, y = p.ry - 28 - h;
  ctx.fillStyle = 'rgba(8,8,10,.62)';
  rr(x, y, w, h, h / 2);
  ctx.fill();
  ctx.fillStyle = isMe ? '#ff6b4a' : '#fff';
  ctx.textAlign = 'center';

  ctx.fillText(p.n, p.rx, y + h / 2 + .5);
}
function drawWorld(dt, now){
  const mp = players.get(myPid);
  for (const p of players.values()) smooth(p, dt, now);
  if (mp && mp.rx !== null){
    const sp = Math.hypot(mp.vx, mp.vy);
    cam.x += (mp.rx + mp.vx * .25 - cam.x) * (1 - Math.exp(-dt * 6));
    cam.y += (mp.ry + mp.vy * .25 - cam.y) * (1 - Math.exp(-dt * 6));
    const zt = clamp(Math.min(cw, ch) / 620, .45, 1.1) * (1 - Math.min(sp, 620) / 2200);
    cam.z += (zt - cam.z) * (1 - Math.exp(-dt * 3));
  }
  shake *= Math.exp(-dt * 9);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#08080a';
  ctx.fillRect(0, 0, cw, ch);
  ctx.save();
  ctx.translate(cw / 2 + rand(-shake, shake), ch / 2 + rand(-shake, shake));
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);
  const vx0 = cam.x - cw / 2 / cam.z - 60, vx1 = cam.x + cw / 2 / cam.z + 60;
  const vy0 = cam.y - ch / 2 / cam.z - 60, vy1 = cam.y + ch / 2 / cam.z + 60;
  ctx.fillStyle = '#111114';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.045)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = Math.max(0, Math.floor(vx0 / 100) * 100); x <= Math.min(W, vx1); x += 100){ ctx.moveTo(x, Math.max(0, vy0)); ctx.lineTo(x, Math.min(H, vy1)); }
  for (let y = Math.max(0, Math.floor(vy0 / 100) * 100); y <= Math.min(H, vy1); y += 100){ ctx.moveTo(Math.max(0, vx0), y); ctx.lineTo(Math.min(W, vx1), y); }
  ctx.stroke();
  ctx.strokeStyle = '#ff6b4a';
  ctx.lineWidth = 8;
  ctx.shadowColor = '#ff6b4a';
  ctx.shadowBlur = 24;
  ctx.strokeRect(0, 0, W, H);
  ctx.shadowBlur = 0;
  const pulse = 1 + Math.sin(now / 180) * .12;
  for (const c of coins){
    if (c.x < vx0 || c.x > vx1 || c.y < vy0 || c.y > vy1) continue;
    ctx.fillStyle = 'rgba(255,213,74,.18)'; ctx.beginPath(); ctx.arc(c.x, c.y, 20 * pulse, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(c.x, c.y, 10 * pulse, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#c99a10'; ctx.beginPath(); ctx.arc(c.x, c.y, 5, 0, 6.283); ctx.fill();
  }
  for (const p of players.values()){
    if (p.rx === null) continue;
    const fx = Math.cos(p.ra), fy = Math.sin(p.ra);
    const fs = p.vx * fx + p.vy * fy, ls = -p.vx * fy + p.vy * fx;
    const bx = p.rx - fx * 18, by = p.ry - fy * 18;
    if (Math.abs(ls) > 100 && Math.abs(fs) > 40){
      spawn(bx - fy * 9, by + fx * 9, 0, 0, 4, 3, 'rgba(0,0,0,.5)', 'skid');
      spawn(bx + fy * 9, by - fx * 9, 0, 0, 4, 3, 'rgba(0,0,0,.5)', 'skid');
    }
    if (p.boost) spawn(bx, by, -fx * 160 + rand(-30, 30), -fy * 160 + rand(-30, 30), rand(.15, .3), rand(3, 6), Math.random() < .5 ? '#ff6b4a' : '#ffd54a', 'dot');
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0){ parts.splice(i, 1); continue; }
    q.x += q.vx * dt; q.y += q.vy * dt;
    ctx.globalAlpha = q.kind === 'skid' ? clamp(q.life / q.max, 0, 1) * .5 : clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.size, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const list = [...players.values()].filter(p => p.rx !== null && p.rx > -5000).sort((a, b) => (a.pid === myPid) - (b.pid === myPid));
  for (const p of list) drawCar(p, p.pid === myPid);
  for (const p of list) drawName(p, p.pid === myPid);
  ctx.restore();
}
function drawMini(){
  const s = mini.width / W;
  mctx.clearRect(0, 0, mini.width, mini.height);

  for (const c of coins) mctx.fillRect(c.x * s - 1, c.y * s - 1, 3, 3);

    if (p.rx === null || p.rx < -5000) continue;

  }
  const z = cam.z;

  mctx.lineWidth = 1;
  mctx.strokeRect((cam.x - cw / 2 / z) * s, (cam.y - ch / 2 / z) * s, cw / z * s, ch / z * s);
}
let lbTimer = 0;
function rebuildLB(){
  const rows = [...players.values()].sort((a, b) => b.score - a.score).slice(0, 5);
  const box = $('lbRows');
  box.innerHTML = '';
  rows.forEach((p, i) => {
    const r = document.createElement('div');
    r.className = 'lbrow' + (p.pid === myPid ? ' me' : '');
    const d = document.createElement('span'); d.className = 'dot'; d.style.background = p.c;
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = (i + 1) + '. ' + p.n;
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = p.score;
    r.append(d, n, sc);
    box.appendChild(r);
  });
}
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  drawWorld(dt, now);
  drawMini();
  const mp = players.get(myPid);
  if (mp){
    $('score').textContent = mp.score;
    $('nitroBar').style.width = clamp(mp.nitro, 0, 100) + '%';
  }
  lbTimer += dt;
  if (lbTimer > .5){ lbTimer = 0; rebuildLB(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

connectFlow();
addEventListener('beforeunload', cleanupNet);
})();
</script>
</body>
</html>
