<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Interactive Character</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

// ================= SETTINGS =================
const MODEL_URL = './model3d.glb';   // apna path yahan
const BG = null;                     // null = transparent (landing page ka bg dikhega), ya '#0b0d13'
const EYE_SPEED = 24;                // aankh follow speed (zyada = tez)
const HEAD_SPEED = 8;                // gardan follow speed
// ============================================

// ---- Face landmarks (model ke object-space me, measured from your mesh) ----
const EYE_L = { c: [-0.121, 0.352], r: [0.062, 0.028] };
const EYE_R = { c: [ 0.155, 0.352], r: [0.056, 0.028] };
const MOUTH = { c: [0.009, 0.100], cl: [-0.108, 0.103], cr: [0.122, 0.103] };
const FACE_Z = 0.46;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
if (BG) scene.background = new THREE.Color(BG);
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);

scene.add(new THREE.HemisphereLight(0xffffff, 0x888899, 1.6));
const key = new THREE.DirectionalLight(0xfff1e0, 1.4); key.position.set(1.5, 2.5, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0xbfd4ff, 0.8); rim.position.set(-2, 1.5, -2); scene.add(rim);

function frameCamera() {
  const a = innerWidth / innerHeight, t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const d = Math.max((1.45 / 2) / t, (1.25 / 2) / (t * a));
  camera.aspect = a; camera.updateProjectionMatrix();
  camera.position.set(0, 0.36, d); camera.lookAt(0, 0.36, 0);
}
frameCamera();

// ---- shared uniforms driven by the "face rig" ----
const U = {
  uSmile: { value: 0 }, uBlinkL: { value: 0 }, uBlinkR: { value: 0 }, uGaze: { value: new THREE.Vector2() }
};

function patchMaterial(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, U);
    const f2 = (a) => `vec2(${a[0]},${a[1]})`;
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uSmile; varying vec3 vBind;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        vBind = position;
        if (position.z > 0.25 && uSmile > 0.001) {
          vec2 p = position.xy;
          vec2 cl = ${f2(MOUTH.cl)}, cr = ${f2(MOUTH.cr)};
          float wl = exp(-dot(p-cl,p-cl)/0.005), wr = exp(-dot(p-cr,p-cr)/0.005);
          transformed.y += uSmile * 0.020 * (wl + wr);
          transformed.x += uSmile * 0.014 * (wr - wl);
          transformed.z += uSmile * 0.006 * (wl + wr);
          vec2 a = vec2(-0.10,0.19), b = vec2(0.13,0.19);
          float cw = exp(-dot(p-a,p-a)/0.0098) + exp(-dot(p-b,p-b)/0.0098);
          transformed.y += uSmile * 0.008 * cw;
        }`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uBlinkL, uBlinkR; uniform vec2 uGaze; varying vec3 vBind;
        vec4 eyeFx(vec2 uv, vec2 c, vec2 r, float blink, vec3 gU, vec3 gV, sampler2D m) {
          vec2 q = (vBind.xy - c) / r;
          float rr = length(q);
          float inside = 1.0 - smoothstep(0.6, 1.0, rr);
          // eyeball: iris/sclera ko gaze direction me shift karo
          vec3 d = vec3(uGaze.x * r.x * 0.38, uGaze.y * r.y * 0.30, 0.0);
          vec2 uvI = uv - vec2(dot(gU, d), dot(gV, d));
          vec4 col = texture2D(m, mix(uv, uvI, inside));
          // eyelid: upar se neeche band hota hai
          float lid = 1.0 - blink * 1.75;
          float cover = smoothstep(lid - 0.06, lid + 0.02, q.y) * (1.0 - smoothstep(1.05, 1.3, rr));
          vec3 dd = vec3(0.0, -1.7 * r.y, 0.0);
          vec4 skin = texture2D(m, uv - vec2(dot(gU, dd), dot(gV, dd)));
          skin.rgb *= 0.92;
          float lash = (1.0 - smoothstep(0.0, 0.14, abs(q.y - lid))) * step(0.02, blink) * (1.0 - smoothstep(0.85, 1.15, rr));
          col = mix(col, skin, cover * step(0.02, blink));
          col.rgb = mix(col.rgb, vec3(0.05, 0.03, 0.03), lash * 0.7);
          return col;
        }`)
      .replace('#include <map_fragment>', `
        #ifdef USE_MAP
        vec3 dp1 = dFdx(vBind), dp2 = dFdy(vBind);
        vec2 du1 = dFdx(vMapUv), du2 = dFdy(vMapUv);
        vec3 N = normalize(cross(dp1, dp2));
        vec3 d2p = cross(dp2, N), d1p = cross(N, dp1);
        float det = dot(dp1, d2p);
        det = abs(det) < 1e-12 ? 1e-12 : det;
        vec3 gU = (d2p * du1.x + d1p * du2.x) / det;
        vec3 gV = (d2p * du1.y + d1p * du2.y) / det;
        vec4 sampledDiffuseColor = texture2D(map, vMapUv);
        if (vBind.z > 0.25) {
          if (vBind.x < 0.017) sampledDiffuseColor = eyeFx(vMapUv, ${f2(EYE_L.c)}, ${f2(EYE_L.r)}, uBlinkL, gU, gV, map);
          else sampledDiffuseColor = eyeFx(vMapUv, ${f2(EYE_R.c)}, ${f2(EYE_R.r)}, uBlinkR, gU, gV, map);
        }
        diffuseColor *= sampledDiffuseColor;
        #endif`);
  };
}

// ---- model load + REAL skeleton (chest -> neck -> head) ----
let head, neck, chest, skel, headInv, mesh;
const draco = new DRACOLoader(); draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);

loader.load(MODEL_URL, (gltf) => {
  let src; gltf.scene.traverse((o) => { if (o.isMesh && !src) src = o; });
  const geo = src.geometry, pos = geo.attributes.position, n = pos.count;
  const si = new Uint16Array(n * 4), sw = new Float32Array(n * 4);
  const ss = (a, b, x) => { x = Math.min(1, Math.max(0, (x - a) / (b - a))); return x * x * (3 - 2 * x); };
  for (let i = 0; i < n; i++) {
    const y = pos.getY(i);
    const h = ss(-0.20, 0.02, y);                 // head weight
    const nk = ss(-0.50, -0.28, y) * (1 - h);     // neck weight
    sw[i * 4] = h; sw[i * 4 + 1] = nk; sw[i * 4 + 2] = 1 - h - nk;
    si[i * 4] = 2; si[i * 4 + 1] = 1; si[i * 4 + 2] = 0;
  }
  geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(si, 4));
  geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(sw, 4));

  chest = new THREE.Bone(); chest.name = 'chest'; chest.position.set(0, -0.38, 0);
  neck = new THREE.Bone();  neck.name = 'neck';  neck.position.set(0, 0.26, 0);
  head = new THREE.Bone();  head.name = 'head';  head.position.set(0, 0.08, 0);
  chest.add(neck); neck.add(head);
  skel = new THREE.Skeleton([chest, neck, head]);

  src.material.roughness = 0.65; src.material.metalness = 0;
  patchMaterial(src.material);
  mesh = new THREE.SkinnedMesh(geo, src.material);
  mesh.frustumCulled = false;
  mesh.add(chest); mesh.bind(skel);
  scene.add(mesh);
  scene.updateMatrixWorld(true);
  headInv = skel.boneInverses[2].clone();
});

// ---- behaviour state ----
const S = {
  cx: innerWidth / 2, cy: innerHeight / 2, lastMove: -10, prevX: 0, prevY: 0,
  gaze: new THREE.Vector2(), tgt: new THREE.Vector2(), sac: new THREE.Vector2(), sacT: new THREE.Vector2(), sacNext: 1,
  yaw: 0, pitch: 0, roll: 0, smile: 0, smileTgt: 0,
  blink: 0, blinkP: 1, nextBlink: 2, eyeHover: 0, wink: 0, winkP: 1, 
  dart: 0, dartNext: 4, curious: 0
};
let T = 0;
const clock = new THREE.Clock();
const lerp = THREE.MathUtils.lerp, clamp = THREE.MathUtils.clamp;

function startBlink() { if (S.blinkP >= 1) S.blinkP = 0; }

function onMove(x, y) {
  const sp = Math.hypot(x - S.prevX, y - S.prevY) / innerHeight;
  S.prevX = x; S.prevY = y; S.cx = x; S.cy = y; S.lastMove = T;
  if (sp > 0.25 && Math.random() < 0.5) startBlink();   // tez cursor jump pe blink
}
addEventListener('pointermove', (e) => onMove(e.clientX, e.clientY), { passive: true });
addEventListener('pointerdown', (e) => { onMove(e.clientX, e.clientY); S.winkP = 0; S.smile = Math.max(S.smile, 1); S.roll = 0.12; }, { passive: true });
document.addEventListener('pointerleave', () => { S.lastMove = -10; });

const _v = new THREE.Vector3();
function toScreen(x, y) {
  _v.set(x, y, FACE_Z).applyMatrix4(head.matrixWorld).applyMatrix4(headInv).project(camera);
  return [(_v.x * 0.5 + 0.5) * innerWidth, (-_v.y * 0.5 + 0.5) * innerHeight];
}

function update(dt) {
  const idle = T - S.lastMove > 3.5;
  const eL = toScreen(...EYE_L.c), eR = toScreen(...EYE_R.c), m = toScreen(...MOUTH.c);
  const eyeMid = [(eL[0] + eR[0]) / 2, (eL[1] + eR[1]) / 2];
  const eyeDist = Math.abs(eR[0] - eL[0]) || 100;

  // --- target gaze: cursor kidhar hai ---
  let tx, ty;
  if (idle) { tx = Math.sin(T * 0.7) * 0.7 + Math.sin(T * 1.9) * 0.15; ty = Math.sin(T * 0.5 + 1) * 0.25; }
  else { tx = (S.cx - eyeMid[0]) / (innerHeight * 0.4); ty = -(S.cy - eyeMid[1]) / (innerHeight * 0.4); }
  const L = Math.hypot(tx, ty); if (L > 1) { tx /= L; ty /= L; }

  // natkhat: cursor ruka hua ho to nazar chura ke wapas dekhe
  const still = !idle && T - S.lastMove > 1.6;
  S.dartNext -= dt;
  if (still && S.dartNext <= 0) { S.dart = 0.55; S.dartNext = 3 + Math.random() * 3; S.smileTgt = 0.5; }
  if (S.dart > 0) { S.dart -= dt; tx = -Math.sign(tx || 1) * 0.8; ty = 0.3; if (S.dart <= 0) startBlink(); }

  S.tgt.set(tx, ty);
  // chhote random eye saccades (jeevant aankhein)
  S.sacNext -= dt;
  if (S.sacNext <= 0) { S.sacNext = 0.4 + Math.random() * 1.6; S.sacT.set((Math.random() - .5) * 0.18, (Math.random() - .5) * 0.12); }
  S.sac.lerp(S.sacT, 1 - Math.exp(-30 * dt));

  const prev = S.gaze.clone();
  S.gaze.lerp(S.tgt, 1 - Math.exp(-EYE_SPEED * dt));          // aankh: bahut tez
  if (S.gaze.distanceTo(prev) / dt > 6 && Math.random() < 0.15) startBlink();
  const kh = 1 - Math.exp(-HEAD_SPEED * dt);                   // gardan: thodi der baad follow
  S.yaw = lerp(S.yaw, S.tgt.x * 0.42, kh);
  S.pitch = lerp(S.pitch, -S.tgt.y * 0.24, kh);
  S.roll = lerp(S.roll, -S.tgt.x * 0.05 + S.curious * 0.14, 1 - Math.exp(-5 * dt));

  U.uGaze.value.set(clamp(S.gaze.x + S.sac.x, -1, 1), clamp(S.gaze.y + S.sac.y, -1, 1));

  // --- cursor aankh pe -> blink ---
  const dEye = Math.min(Math.hypot(S.cx - eL[0], S.cy - eL[1]), Math.hypot(S.cx - eR[0], S.cy - eR[1]));
  const onEye = !idle && dEye < eyeDist * 0.28;
  S.eyeHover -= dt;
  if (onEye && S.eyeHover <= 0) { startBlink(); S.eyeHover = 0.85; }

  // --- cursor hoth pe -> smile ---
  const dMouth = Math.hypot(S.cx - m[0], S.cy - m[1]);
  const onMouth = !idle && dMouth < eyeDist * 0.4;
  S.curious = lerp(S.curious, onMouth ? 1 : 0, 1 - Math.exp(-6 * dt));
  if (S.smileTgt > 0 && !onMouth) S.smileTgt = Math.max(0, S.smileTgt - dt * 0.8);
  const target = onMouth ? 1 : Math.max(S.smileTgt, 0.14);
  S.smile = lerp(S.smile, target, 1 - Math.exp(-(target > S.smile ? 10 : 3) * dt));
  U.uSmile.value = S.smile;

  // --- blink: human timing (close ~70ms, open ~110ms) ---
  S.nextBlink -= dt;
  if (S.nextBlink <= 0) { startBlink(); S.nextBlink = Math.random() < 0.2 ? 0.25 : 2 + Math.random() * 3.5; }
  let b = 0;
  if (S.blinkP < 1) {
    S.blinkP += dt / 0.19;
    const p = Math.min(S.blinkP, 1);
    b = p < 0.38 ? p / 0.38 : 1 - (p - 0.38) / 0.62;
    b = b * b * (3 - 2 * b);
  }
  let w = 0;
  if (S.winkP < 1) { S.winkP += dt / 0.7; const p = Math.min(S.winkP, 1); w = p < 0.2 ? p / 0.2 : p < 0.65 ? 1 : 1 - (p - 0.65) / 0.35; }
  U.uBlinkL.value = b;
  U.uBlinkR.value = Math.max(b, w);       // click = ek aankh se wink

  // --- bones ---
  const breath = Math.sin(T * 1.5), sway = Math.sin(T * 0.6) * 0.02;
  chest.rotation.set(breath * 0.006, S.yaw * 0.15, 0);
  neck.rotation.set(S.pitch * 0.35, S.yaw * 0.35, S.roll * 0.4);
  head.rotation.set(S.pitch * 0.65, S.yaw * 0.65 + sway, S.roll * 0.6);
}

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05); T += dt;
  if (mesh) update(dt);
  renderer.render(scene, camera);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); frameCamera(); });
tick();
</script>
</body>
</html>
