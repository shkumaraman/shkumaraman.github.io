  .copy-email-btn {

  .light-mode .copy-email-btn {
    background: rgba(0, 0, 0, 0.06);

  .copy-email-btn:hover {

  .ban-btn, .warning-btn {
    width: 100%;

  }
  .ban-btn {
    background: #ef4444;

  }
  .ban-btn:hover {

  }
  .warning-btn {

  .chat-disabled-banner {

    border-top: 1px solid rgba(239, 68, 68, 0.3);

</style>

<div id="talkrushWarningModal" class="warning-overlay">
  <div class="warning-card">

        <line x1="12" y1="9" x2="12" y2="13"></line>

    <h3 class="warning-title" id="warningTitleText">Warning</h3>

</div>

<div id="talkrushBanModal" class="ban-overlay">
  <div class="ban-card">
    <div class="ban-icon-wrap">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>

    <div class="appeal-section">
      <span class="appeal-label">Support / Unban Appeal</span>
      <div class="email-copy-box">
        <span class="email-address">kumarsharma2580@gmail.com</span>
        <button type="button" class="copy-email-btn" id="copyEmailBtn" onclick="copySupportMail(this)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>

<script>
(() => {
  const BAN_KEY = 'tr_sec_ban';
  const FP_KEY = 'tr_sec_fp';
  const STRIKE_KEY = 'tr_sec_strikes';
  const BAN_EXPIRY_DAYS = 365;
  const FLOOD_WINDOW_MS = 4000;
  const FLOOD_MAX_COUNT = 5;
  let messageTimestamps = [];
  
  window.copySupportMail = function(btn) {
    const email = 'kumarsharma2580@gmail.com';
    navigator.clipboard.writeText(email).then(() => {
      btn.innerHTML = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg><span style="color:#22c55e;">Copied!</span>`;
      setTimeout(() => {
        btn.innerHTML = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>Copy</span>`;
      }, 2000);
    });
  };

  function generateDeviceFingerprint() {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = 200;
      canvas.height = 50;
      const ctx = canvas.getContext('2d');
      ctx.textBaseline = 'top';
      ctx.font = "14px 'Arial'";
      ctx.fillStyle = '#f60';
      ctx.fillRect(100, 1, 62, 20);
      ctx.fillStyle = '#069';
      ctx.fillText('TalkRush-Security-FP', 2, 15);
      ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
      ctx.fillText('TalkRush-Security-FP', 4, 17);
      let glInfo = '';
      try {
        const gl = document.createElement('canvas').getContext('webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            glInfo = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (_) {}
      const raw = [
        canvas.toDataURL(),
        glInfo,
        navigator.userAgent,
        screen.width + 'x' + screen.height,
        screen.colorDepth,
        navigator.hardwareConcurrency || '',
        Intl.DateTimeFormat().resolvedOptions().timeZone || ''
      ].join('###');
      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }
      return 'FP_' + Math.abs(hash).toString(36);
    } catch (_) {
      return 'FP_FALLBACK';
    }
  }

  const currentDeviceFp = generateDeviceFingerprint();

  function setCookie(name, val, days) {
    const d = new Date();
    d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
    document.cookie = `${name}=${encodeURIComponent(val)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
  }

  function getCookie(name) {
    const v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
    return v ? decodeURIComponent(v[2]) : null;
  }

  function getStoredBan() {
    let raw = localStorage.getItem(BAN_KEY) || sessionStorage.getItem(BAN_KEY) || getCookie(BAN_KEY);
    if (!raw) return null;
    try {
      const data = JSON.parse(raw);
      if (Date.now() > data.expiresAt) {
        localStorage.removeItem(BAN_KEY);
        sessionStorage.removeItem(BAN_KEY);
        setCookie(BAN_KEY, '', -1);
        return null;
      }
      localStorage.setItem(BAN_KEY, raw);
      sessionStorage.setItem(BAN_KEY, raw);
      setCookie(BAN_KEY, raw, BAN_EXPIRY_DAYS);
      return data;
    } catch (_) {
      return null;
    }
  }

  function getStrikes() {
    return parseInt(localStorage.getItem(STRIKE_KEY) || '0', 10);
  }

  function addStrike() {
    const strikes = getStrikes() + 1;
    localStorage.setItem(STRIKE_KEY, strikes);
    return strikes;
  }

  function showWarningUI(strikeCount) {
    const modal = document.getElementById('talkrushWarningModal');
    const title = document.getElementById('warningTitleText');
    const desc = document.getElementById('warningDescText');
    
    if (strikeCount === 1) {
      title.textContent = "Warning (1/2)";
      desc.textContent = "Promoting other platforms or unauthorized links is not allowed.";
    } else if (strikeCount === 2) {
      title.textContent = "Final Warning (2/2)";
      desc.textContent = "This is your final warning. The next violation will result in a permanent device ban.";
    }
    
    if (modal) {
      modal.classList.add('active');
    }
  }

  function applyDeviceBan(reason) {
    const banPayload = {
      banned: true,
      fp: currentDeviceFp,
      reason: reason || 'Unauthorized promotion detected',
      bannedAt: Date.now(),
      expiresAt: Date.now() + (BAN_EXPIRY_DAYS * 24 * 60 * 60 * 1000)
    };
    const str = JSON.stringify(banPayload);
    try {
      localStorage.setItem(BAN_KEY, str);
      sessionStorage.setItem(BAN_KEY, str);
      setCookie(BAN_KEY, str, BAN_EXPIRY_DAYS);
      localStorage.setItem(FP_KEY, currentDeviceFp);
    } catch (_) {}
    enforceBanUI(banPayload);
  }

  function enforceBanUI(banPayload) {
    const warningModal = document.getElementById('talkrushWarningModal');
    if (warningModal) {
      warningModal.classList.remove('active');
    }

    const modal = document.getElementById('talkrushBanModal');
    const reasonEl = document.getElementById('banReasonText');
    if (reasonEl) reasonEl.textContent = banPayload.reason;
    if (modal) modal.classList.add('active');

    const inputElements = [document.getElementById('msgInput'), document.getElementById('postText')];
    inputElements.forEach(inp => {
      if (inp) {
        inp.disabled = true;
        inp.value = '';
        inp.placeholder = 'Action restricted (Device Banned)';
      }
    });

    const buttonElements = [document.getElementById('sendBtn'), document.getElementById('submitBtn')];
    buttonElements.forEach(btn => {
      if (btn) btn.disabled = true;
    });

    const imgBtn = document.getElementById('imgBtn');
    const gifBtn = document.getElementById('gifTriggerBtn');
    const voiceBtn = document.getElementById('voiceRecordBtn');
    const imgInput = document.getElementById('imgInput');

    if (imgBtn) imgBtn.style.display = 'none';
    if (gifBtn) gifBtn.style.display = 'none';
    if (voiceBtn) voiceBtn.style.display = 'none';
    if (imgInput) imgInput.disabled = true;

    const chatControls = document.querySelector('.chat-controls-wrapper') || document.querySelector('.chat-controls');
    if (chatControls && !document.getElementById('banDisabledNotice')) {
      const notice = document.createElement('div');
      notice.id = 'banDisabledNotice';
      notice.className = 'chat-disabled-banner active';
      notice.textContent = 'Device permanently restricted for spamming and promotion.';
      chatControls.parentNode.insertBefore(notice, chatControls);
    }
    
    startAntiTamperObserver();
  }

  function startAntiTamperObserver() {
    const observer = new MutationObserver((mutations) => {
      const banActive = getStoredBan();
      const modal = document.getElementById('talkrushBanModal');
      
      if (banActive && (!modal || !modal.classList.contains('active') || modal.style.display === 'none')) {
        document.body.innerHTML = '<div style="background:#000; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; color:red; font-size:24px; font-family:sans-serif; font-weight:bold;">Security Alert: Tampering Detected. Device permanently blocked.</div>';
      }
    });
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
  }

  function cleanAndNormalize(str) {
    if (!str) return '';
    let s = str.toLowerCase();
    s = s.replace(/[\u200B-\u200D\uFEFF]/g, '');
    s = s.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
    const leetMap = {
      '@': 'a', '4': 'a', '8': 'b', '3': 'e',
      '1': 'i', '!': 'i', '|': 'i', '0': 'o',
      '5': 's', '$': 's', '7': 't', '+': 't', '9': 'g'
    };
    s = s.split('').map(c => leetMap[c] || c).join('');
    return s;
  }

  function detectProhibitedPlatforms(text) {
    if (!text) return false;
    const normalized = cleanAndNormalize(text);
    const stripped = normalized.replace(/[^a-z0-9]/g, '');

    const directWords = [
      'chatib', 'joingy', 'knotchat', 'subichat',
      'talkwithstranger', 'talktostranger', 'talktostrangers',
      'justalk', 'justtalk', 'telegram', 'zangi'
    ];

    for (const word of directWords) {
      if (stripped.includes(word)) {
        return true;
      }
    }

    if (stripped.includes('y99')) return true;
    if (stripped.includes('chitchat') && (stripped.includes('gg') || stripped.includes('com'))) return true;

    const regexPatterns = [
      /(^|\W)t\s*(\.|\/|\(|\))\s*me(\W|$)/i,
      /(^|\W)tg\s*:\s*\/?\/?/i
    ];

    return regexPatterns.some(rgx => rgx.test(normalized));
  }

  function checkSpamFlood() {
    const now = Date.now();
    messageTimestamps = messageTimestamps.filter(ts => now - ts < FLOOD_WINDOW_MS);
    messageTimestamps.push(now);
    return messageTimestamps.length >= FLOOD_MAX_COUNT;
  }

  function resolveTargetInput(sourceEl) {
    if (sourceEl && sourceEl.id === 'submitBtn') return document.getElementById('postText');
    if (sourceEl && sourceEl.id === 'sendBtn') return document.getElementById('msgInput');
    if (sourceEl && (sourceEl.id === 'postText' || sourceEl.id === 'msgInput')) return sourceEl;
    return document.getElementById('postText') || document.getElementById('msgInput');
  }

  function interceptSubmission(e, sourceEl) {
    const activeBan = getStoredBan();
    if (activeBan) {
      e.preventDefault();
      e.stopImmediatePropagation();
      enforceBanUI(activeBan);
      return false;
    }

    const targetInput = resolveTargetInput(sourceEl);
    if (!targetInput) return true;

    const rawContent = targetInput.value.trim();
    if (!rawContent) return true;

    if (detectProhibitedPlatforms(rawContent)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      targetInput.value = '';
      
      const strikes = addStrike();
      if (strikes >= 3) {
        applyDeviceBan('Repeated unauthorized promotion after warnings');
      } else {
        showWarningUI(strikes);
      }
      return false;
    }

    if (checkSpamFlood()) {
      e.preventDefault();
      e.stopImmediatePropagation();
      targetInput.value = '';
      applyDeviceBan('Rapid flooding & bot-like spamming');
      return false;
    }

    return true;
  }

  function initBanEngine() {
    const activeBan = getStoredBan();
    if (activeBan) {
      enforceBanUI(activeBan);
      return;
    }

    window.addEventListener('keydown', (e) => {
      if (e.target && e.target.id === 'msgInput' && e.key === 'Enter' && !e.shiftKey) {
        interceptSubmission(e, e.target);
      }
    }, true);

    window.addEventListener('click', (e) => {
      const sendBtn = e.target.closest('#sendBtn');
      if (sendBtn) {
        interceptSubmission(e, sendBtn);
        return;
      }

      const submitBtn = e.target.closest('#submitBtn');
      if (submitBtn) {
        interceptSubmission(e, submitBtn);
      }
    }, true);

    const imgInput = document.getElementById('imgInput');
    if (imgInput) {
      imgInput.addEventListener('change', (e) => {
        const ban = getStoredBan();
        if (ban) {
          e.preventDefault();
          e.stopImmediatePropagation();
          imgInput.value = '';
          enforceBanUI(ban);
        }
      }, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initBanEngine);
  } else {
    initBanEngine();
  }
})();
</script>
