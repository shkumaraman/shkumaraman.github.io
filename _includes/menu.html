<script>
function toggleMenu() {
  const menu = document.getElementById("menu");
  const overlay = document.querySelector('.menu-overlay');
  const menuBtns = document.querySelectorAll('.menu-btn');
  const isOpen = menu.style.left === "0px";

  menu.style.left = isOpen ? "-270px" : "0px";
  if (overlay) overlay.style.display = isOpen ? "none" : "block";
  menuBtns.forEach(btn => {
    const dot = btn.querySelector('.menu-btn-dot');
    const hasDotActive = dot && dot.classList.contains('active');
    btn.innerHTML = isOpen ? "&#9776;" : "&#10006;";
    if (dot) {
      btn.appendChild(dot);
      if (hasDotActive) dot.classList.add('active');
    }
  });
}

document.addEventListener('DOMContentLoaded', function () {
  if (!document.querySelector('.menu-overlay')) {
    const overlay = document.createElement('div');
    overlay.className = 'menu-overlay';
    overlay.onclick = toggleMenu;
    document.body.appendChild(overlay);
  }

  const currentPath = window.location.pathname;
  document.querySelectorAll('.menu-items a').forEach(link => {
    if (link.getAttribute('href') === currentPath) {
      link.classList.add('active');
    }
  });

  document.querySelectorAll('.menu-btn').forEach(btn => {
    if (!btn.querySelector('.menu-btn-dot')) {
      const dot = document.createElement('span');
      dot.className = 'menu-btn-dot';
      btn.appendChild(dot);
    }
  });

  const shareButton = document.getElementById("shareButton");
  if (shareButton) {
    shareButton.addEventListener("click", () => {
      const shareUrl = "https://shkumaraman.github.io";
      
      if (typeof window.openShareModal === 'function') {
        window.openShareModal(shareUrl);
        toggleMenu();
      } else {
        const fullText = "Connect with strangers, chat and talk freely, and explore fun conversations. Try TalkRush now: " + shareUrl;
        if (navigator.clipboard) {
          navigator.clipboard.writeText(fullText);
        } else {
          const tmp = document.createElement("input");
          tmp.value = fullText;
          document.body.appendChild(tmp);
          tmp.select();
          document.execCommand("copy");
          document.body.removeChild(tmp);
        }
        toggleMenu();
      }
    });
  }
});
</script>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

if (!window.talkrushUnifiedListenerAdded) {
  window.talkrushUnifiedListenerAdded = true;

  const firebaseConfig = {
    databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
  const db = getDatabase(app);

  let totalRoomsUnread = 0;
  let totalInboxUnread = 0;

  function updateAllGlobalBadges() {
    const formatBadge = (count) => count > 9 ? '9+' : count;

    const menuRoomsBadge = document.getElementById('menuBadge');
    if (menuRoomsBadge) {
      menuRoomsBadge.textContent = formatBadge(totalRoomsUnread);
      menuRoomsBadge.style.display = totalRoomsUnread > 0 ? 'inline-block' : 'none';
    }

    const menuInboxBadge = document.getElementById('menuInboxBadge');
    if (menuInboxBadge) {
      menuInboxBadge.textContent = formatBadge(totalInboxUnread);
      menuInboxBadge.style.display = totalInboxUnread > 0 ? 'inline-block' : 'none';
    }

    const navRoomsBadge = document.getElementById('bottomNavBadge');
    if (navRoomsBadge) {
      navRoomsBadge.textContent = formatBadge(totalRoomsUnread);
      navRoomsBadge.style.display = totalRoomsUnread > 0 ? 'flex' : 'none';
    }

    const navInboxBadge = document.getElementById('bottomNavInboxBadge');
    if (navInboxBadge) {
      navInboxBadge.textContent = formatBadge(totalInboxUnread);
      navInboxBadge.style.display = totalInboxUnread > 0 ? 'flex' : 'none';
    }

    const combinedTotal = totalRoomsUnread + totalInboxUnread;
    document.querySelectorAll('.menu-btn-dot').forEach(dot => {
      dot.classList.toggle('active', combinedTotal > 0);
    });
  }

  function listenToAllUnreadData() {
    const myNickname = localStorage.getItem('talkrush_nickname') || 'Guest';
    const params = new URLSearchParams(window.location.search);
    const currentGroup = params.get('group');
    const currentChatId = params.get('chatId');

    onValue(ref(db, 'groups'), (snapshot) => {
      let count = 0;
      if (snapshot.exists()) {
        const data = snapshot.val();
        let lastSeenMap = JSON.parse(localStorage.getItem('groups_last_seen') || '{}');
        if (currentGroup) lastSeenMap[currentGroup] = Date.now();

        Object.entries(data).forEach(([groupName, groupData]) => {
          let groupUnreadCount = 0;
          let groupLastSeen = lastSeenMap[groupName] || 0;

          if (groupData.messages) {
            Object.values(groupData.messages).forEach(m => {
              if (m.replyTo?.nickname === myNickname && m.timestamp > groupLastSeen) {
                groupUnreadCount++;
              }
            });
          }
          if (groupName !== currentGroup) {
            count += groupUnreadCount;
          }
        });
      }
      totalRoomsUnread = count;
      updateAllGlobalBadges();
    });

    onValue(ref(db, 'friends'), (snapshot) => {
      let count = 0;
      if (snapshot.exists()) {
        const data = snapshot.val();
        let lastSeenMap = JSON.parse(localStorage.getItem('inbox_last_seen') || '{}');
        if (currentChatId) lastSeenMap[currentChatId] = Date.now();

        Object.entries(data).forEach(([chatId, friend]) => {
          if (friend.nickname1 !== myNickname && friend.nickname2 !== myNickname) return;

          let chatUnreadCount = 0;
          let chatLastSeen = lastSeenMap[chatId] || 0;

          if (friend.messages) {
            Object.values(friend.messages).forEach(m => {
              if (m.nickname !== myNickname && m.timestamp > chatLastSeen) {
                chatUnreadCount++;
              }
            });
          }
          if (chatId !== currentChatId) {
            count += chatUnreadCount;
          }
        });
      }
      totalInboxUnread = count;
      updateAllGlobalBadges();
    });
  }

  listenToAllUnreadData();
}
</script>
