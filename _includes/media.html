<style>
.voice-record-btn {
  background: none;
  border: none;
  color: var(--dark-icon-color);
  font-size: 14px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.voice-record-btn:hover {
  color: var(--accent);
  background: var(--accent-dim);
}
.light-mode .voice-record-btn {
  color: var(--light-icon-color);
}
.light-mode .voice-record-btn:hover {
  color: var(--accent);
  background: var(--accent-dim);
}

.recording-bar {
  display: none;
  align-items: center;
  gap: 12px;
  flex: 1;
  height: 38px;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--dark-input-bg);
  border: 0.5px solid var(--accent-border);
}
.light-mode .recording-bar {
  background: var(--light-input-bg);
}

.recording-status {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

.recording-dot {
  width: 9px;
  height: 9px;
  background: #ff4757;
  border-radius: 50%;
  animation: recPulseAnim 1s infinite alternate ease-in-out;
}
@keyframes recPulseAnim {
  0% { transform: scale(0.85); opacity: 0.4; }
  100% { transform: scale(1.2); opacity: 1; }
}

.recording-timer {
  font-size: 13px;
  font-family: monospace;
  font-weight: 600;
  color: var(--accent);
}

.recording-wave-visual {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 16px;
  flex: 1;
}
.rec-live-bar {
  width: 3px;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
  animation: liveWave 0.8s infinite ease-in-out alternate;
}
.rec-live-bar:nth-child(2) { animation-delay: 0.15s; }
.rec-live-bar:nth-child(3) { animation-delay: 0.3s; }
.rec-live-bar:nth-child(4) { animation-delay: 0.45s; }
.rec-live-bar:nth-child(5) { animation-delay: 0.2s; }
.rec-live-bar:nth-child(6) { animation-delay: 0.35s; }

@keyframes liveWave {
  0% { height: 4px; }
  100% { height: 16px; }
}

.rec-action-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  font-size: 12px;
  transition: transform 0.1s ease;
}
.rec-action-btn:active {
  transform: scale(0.92);
}
.rec-btn-cancel {
  background: var(--skip-red);
  color: var(--skip-red-text);
  border: 0.5px solid var(--skip-red-border);
}
.rec-btn-send {
  background: var(--accent);
  color: #ffffff;
}

.audio-msg-bubble {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 220px;
  max-width: 280px;
  padding: 4px 0;
  user-select: none;
}

.audio-play-trigger {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #ffffff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.1s ease;
}
.audio-play-trigger:active {
  transform: scale(0.95);
}

.waveform-timeline {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 2.5px;
  height: 28px;
  cursor: pointer;
  padding: 2px 0;
}

.waveform-line {
  flex: 1;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.22);
  transition: background-color 0.15s ease, height 0.2s ease;
  pointer-events: none;
  min-height: 4px;
}
.light-mode .waveform-line {
  background: rgba(0, 0, 0, 0.18);
}
.waveform-line.played {
  background: var(--accent);
}

.audio-duration-txt {
  font-size: 11px;
  color: var(--dark-text-muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.light-mode .audio-duration-txt {
  color: var(--light-text-muted);
}

.gif-modal {
  display: none;
  position: absolute;
  bottom: 60px;
  right: 10px;
  width: min(320px, calc(100% - 20px));
  max-height: 390px;
  background: var(--dark-surface);
  border-radius: 14px;
  border: 0.5px solid var(--dark-border2);
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
  z-index: 1001;
  padding: 12px;
  overflow: hidden;
  flex-direction: column;
  gap: 10px;
}
.light-mode .gif-modal {
  background: var(--light-surface);
  border-color: var(--light-border2);
}

.gif-search {
  width: 100%;
  padding: 8px 12px;
  border-radius: 8px;
  border: 0.5px solid var(--dark-border2);
  background: var(--dark-input-bg);
  color: var(--dark-text);
  font-size: 13px;
  outline: none;
  box-sizing: border-box;
}
.light-mode .gif-search {
  background: var(--light-input-bg);
  border-color: var(--light-border2);
  color: var(--light-text);
}

.gif-results {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 300px;
  padding-right: 2px;
}
.gif-results::-webkit-scrollbar {
  width: 4px;
}
.gif-results::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}
.light-mode .gif-results::-webkit-scrollbar-thumb {
  background: rgba(0, 0, 0, 0.1);
}

.gif-item {
  width: 100%;
  height: 95px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.gif-item:hover {
  transform: scale(1.03);
  opacity: 0.9;
}
</style>

<div class="gif-modal" id="gifModal">
  <input type="text" class="gif-search" id="gifSearch" placeholder="Search GIFs..." />
  <div class="gif-results" id="gifResults"></div>
</div>

<script>
window.MediaHub = (function () {
  let mediaRecorder = null;
  let audioChunks = [];
  let timerInterval = null;
  let currentSeconds = 0;
  let mediaStream = null;
  let voiceSendCallback = null;
  let gifSelectCallback = null;
  let giphyApiKey = '';
  let audioContextInstance = null;

  let inputArea = null;
  let sendBtn = null;
  let micBtn = null;
  let recBar = null;
  let recTimer = null;
  let cancelBtn = null;
  let recSendBtn = null;
  let gifBtn = null;

  const gifModal = document.getElementById("gifModal");
  const gifSearch = document.getElementById("gifSearch");
  const gifResults = document.getElementById("gifResults");

  function mountRecordingBar() {
    inputArea = document.querySelector(".input-area");
    if (!inputArea || document.getElementById("recordingBar")) return;

    const barHtml = `
      <div class="recording-bar" id="recordingBar">
        <button class="rec-action-btn rec-btn-cancel" id="recCancel" title="Cancel"><i class="fas fa-trash"></i></button>
        <div class="recording-status">
          <div class="recording-dot"></div>
          <span class="recording-timer" id="recTimer">0:00</span>
          <div class="recording-wave-visual">
            <span class="rec-live-bar"></span>
            <span class="rec-live-bar"></span>
            <span class="rec-live-bar"></span>
            <span class="rec-live-bar"></span>
            <span class="rec-live-bar"></span>
            <span class="rec-live-bar"></span>
          </div>
        </div>
        <button class="rec-action-btn rec-btn-send" id="recSend" title="Send Voice"><i class="fas fa-paper-plane"></i></button>
      </div>
    `;
    inputArea.insertAdjacentHTML("beforebegin", barHtml);
  }

  function getAudioContext() {
    if (!audioContextInstance) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) audioContextInstance = new AudioCtx();
    }
    return audioContextInstance;
  }

  async function requestAudioStream() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return true;
    } catch {
      alert("Microphone permission required to record audio.");
      return false;
    }
  }

  async function startRecording() {
    const granted = await requestAudioStream();
    if (!granted) return;

    audioChunks = [];
    currentSeconds = 0;

    let mimeType = "audio/webm";
    if (!MediaRecorder.isTypeSupported("audio/webm")) {
      mimeType = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";
    }

    mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.start(200);

    if (recTimer) recTimer.textContent = "0:00";
    timerInterval = setInterval(() => {
      currentSeconds++;
      const mins = Math.floor(currentSeconds / 60);
      const secs = currentSeconds % 60;
      if (recTimer) recTimer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      if (currentSeconds >= 60) finishVoiceRecording();
    }, 1000);

    if (inputArea) inputArea.style.display = "none";
    if (micBtn) micBtn.style.display = "none";
    if (sendBtn) sendBtn.style.display = "none";
    if (recBar) recBar.style.display = "flex";
  }

  function cleanupStream() {
    if (mediaStream) {
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
    }
    clearInterval(timerInterval);
  }

  function resetVoiceUI() {
    if (recBar) recBar.style.display = "none";
    if (inputArea) inputArea.style.display = "flex";
    if (micBtn) micBtn.style.display = "flex";
    if (sendBtn) sendBtn.style.display = "flex";
    cleanupStream();
  }

  function abortVoiceRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
    resetVoiceUI();
  }

  function finishVoiceRecording() {
    if (!mediaRecorder || mediaRecorder.state === "inactive") return;
    const duration = currentSeconds;

    mediaRecorder.onstop = () => {
      cleanupStream();
      const mime = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type: mime });
      const reader = new FileReader();

      reader.onloadend = () => {
        if (typeof voiceSendCallback === "function") {
          voiceSendCallback(reader.result, duration);
        }
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.stop();
    resetVoiceUI();
  }

  function formatTime(totalSeconds) {
    if (!totalSeconds || isNaN(totalSeconds)) return "0:00";
    const mins = Math.floor(totalSeconds / 60);
    const secs = Math.floor(totalSeconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  async function calculateWaveformPeaks(audioSource, barCount = 24) {
    try {
      const response = await fetch(audioSource);
      const arrayBuffer = await response.arrayBuffer();
      const ctx = getAudioContext();
      if (!ctx) throw new Error();
      const audioBuffer = await ctx.decodeAudioData(arrayBuffer);
      const channelData = audioBuffer.getChannelData(0);
      const step = Math.floor(channelData.length / barCount);
      const peaks = [];

      for (let i = 0; i < barCount; i++) {
        let sum = 0;
        const start = i * step;
        for (let j = 0; j < step; j++) {
          sum += Math.abs(channelData[start + j] || 0);
        }
        peaks.push(sum / step);
      }

      const maxPeak = Math.max(...peaks) || 1;
      return peaks.map(p => Math.max(15, Math.min(100, Math.round((p / maxPeak) * 100))));
    } catch {
      const fallback = [];
      for (let i = 0; i < barCount; i++) {
        fallback.push(Math.floor(25 + Math.random() * 65));
      }
      return fallback;
    }
  }

  function createAudioBubble(sourceData, initialDuration = 0) {
    const bubble = document.createElement("div");
    bubble.className = "audio-msg-bubble";

    const playBtn = document.createElement("button");
    playBtn.className = "audio-play-trigger";
    playBtn.innerHTML = '<i class="fas fa-play"></i>';

    const timeline = document.createElement("div");
    timeline.className = "waveform-timeline";

    const bars = [];
    const barCount = 24;
    for (let i = 0; i < barCount; i++) {
      const bar = document.createElement("span");
      bar.className = "waveform-line";
      bar.style.height = "30%";
      timeline.appendChild(bar);
      bars.push(bar);
    }

    const timeLabel = document.createElement("span");
    timeLabel.className = "audio-duration-txt";
    timeLabel.textContent = formatTime(initialDuration);

    bubble.appendChild(playBtn);
    bubble.appendChild(timeline);
    bubble.appendChild(timeLabel);

    calculateWaveformPeaks(sourceData, barCount).then(peaks => {
      peaks.forEach((peak, idx) => {
        if (bars[idx]) bars[idx].style.height = `${peak}%`;
      });
    });

    const audio = new Audio(sourceData);

    audio.onloadedmetadata = () => {
      timeLabel.textContent = formatTime(audio.duration);
    };

    const playIcon = playBtn.querySelector("i");
    playBtn.onclick = () => {
      if (audio.paused) {
        document.querySelectorAll("audio").forEach((item) => {
          if (item !== audio) item.pause();
        });
        audio.play();
        playIcon.className = "fas fa-pause";
      } else {
        audio.pause();
        playIcon.className = "fas fa-play";
      }
    };

    audio.ontimeupdate = () => {
      const progress = audio.currentTime / (audio.duration || 1);
      timeLabel.textContent = formatTime(audio.currentTime);
      const activeIdx = Math.floor(progress * bars.length);
      bars.forEach((bar, index) => {
        bar.classList.toggle("played", index <= activeIdx);
      });
    };

    timeline.onclick = (e) => {
      const rect = timeline.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
      }
    };

    audio.onended = () => {
      playIcon.className = "fas fa-play";
      timeLabel.textContent = formatTime(audio.duration || initialDuration);
      bars.forEach((bar) => bar.classList.remove("played"));
    };

    return bubble;
  }

  function appendVoiceMessage(chatContainer, sender, audioData, duration = 0) {
    if (!chatContainer) return;
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg " + sender;

    const bubble = createAudioBubble(audioData, duration);
    msgDiv.appendChild(bubble);

    const timeDiv = document.createElement("div");
    timeDiv.className = "timestamp";
    timeDiv.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    msgDiv.appendChild(timeDiv);

    chatContainer.appendChild(msgDiv);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  async function fetchTrendingGifs() {
    if (!giphyApiKey) return;
    try {
      const res = await fetch(`https://api.giphy.com/v1/gifs/trending?api_key=${giphyApiKey}&limit=20`);
      renderGifs((await res.json()).data);
    } catch {}
  }

  async function searchGifs(query) {
    if (!giphyApiKey) return;
    if (!query.trim()) {
      fetchTrendingGifs();
      return;
    }
    try {
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${giphyApiKey}&q=${encodeURIComponent(query)}&limit=20`);
      renderGifs((await res.json()).data);
    } catch {}
  }

  function renderGifs(gifs) {
    if (!gifResults) return;
    gifResults.innerHTML = "";
    if (!gifs) return;
    gifs.forEach((gif) => {
      const gifUrl = gif.images.fixed_height.url;
      const img = document.createElement("img");
      img.src = gifUrl;
      img.className = "gif-item";
      img.onclick = () => {
        if (typeof gifSelectCallback === "function") {
          gifSelectCallback(gifUrl);
        }
        gifModal.style.display = "none";
      };
      gifResults.appendChild(img);
    });
  }

  function bindEvents() {
    mountRecordingBar();

    sendBtn = document.getElementById("sendBtn");
    micBtn = document.getElementById("voiceRecordBtn");
    recBar = document.getElementById("recordingBar");
    recTimer = document.getElementById("recTimer");
    cancelBtn = document.getElementById("recCancel");
    recSendBtn = document.getElementById("recSend");

    if (micBtn) micBtn.onclick = startRecording;
    if (cancelBtn) cancelBtn.onclick = abortVoiceRecording;
    if (recSendBtn) recSendBtn.onclick = finishVoiceRecording;

    gifBtn = document.querySelector('[for="gifInput"]') || document.getElementById("gifTriggerBtn");
    if (gifBtn) {
      gifBtn.onclick = (e) => {
        e.preventDefault();
        const isOpen = gifModal.style.display === "flex";
        gifModal.style.display = isOpen ? "none" : "flex";
        if (!isOpen) fetchTrendingGifs();
      };
    }

    if (gifSearch) {
      gifSearch.addEventListener("keypress", (e) => {
        if (e.key === "Enter") searchGifs(gifSearch.value);
      });
    }

    window.addEventListener("click", (e) => {
      if (gifModal && gifModal.style.display === "flex") {
        if (!gifModal.contains(e.target) && gifBtn && !gifBtn.contains(e.target)) {
          gifModal.style.display = "none";
        }
      }
    });
  }

  return {
    init: function (config = {}) {
      voiceSendCallback = config.onSendVoice || null;
      gifSelectCallback = config.onSelectGif || null;
      giphyApiKey = config.giphyApiKey || '';
      bindEvents();
    },
    setApiKey: function (key) {
      giphyApiKey = key;
    },
    createAudioBubble: createAudioBubble,
    appendVoiceMessage: appendVoiceMessage
  };
})();
</script>
