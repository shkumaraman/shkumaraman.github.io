<style>
.voice-record-btn {
  background: none;
  border: none;
  color: var(--dark-icon-color);
  font-size: 14px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 0.2s ease;
  flex-shrink: 0;
}
.voice-record-btn:hover {
  color: var(--accent);
  background: var(--accent-dim);
}
.light-mode .voice-record-btn {
  color: var(--light-icon-color);
}
.light-mode .voice-record-btn:hover {
  color: var(--accent);
  background: var(--accent-dim);
}

.recording-bar {
  display: none;
  align-items: center;
  gap: 12px;
  flex: 1;
  height: 38px;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--dark-input-bg);
  border: 0.5px solid var(--accent-border);
}
.light-mode .recording-bar {
  background: var(--light-input-bg);
}

.recording-status {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

.recording-dot {
  width: 9px;
  height: 9px;
  background: #ff4757;
  border-radius: 50%;
  animation: recPulseAnim 1s infinite alternate ease-in-out;
}
@keyframes recPulseAnim {
  0% { transform: scale(0.85); opacity: 0.4; }
  100% { transform: scale(1.2); opacity: 1; }
}

.recording-timer {
  font-size: 13px;
  font-family: monospace;
  font-weight: 600;
  color: var(--accent);
}

.recording-wave-visual {
  display: flex;
  align-items: center;
  gap: 2px;
  height: 16px;
  flex: 1;
}
.rec-live-bar {
  width: 3px;
  height: 4px;
  background: var(--accent);
  border-radius: 2px;
  animation: liveWave 0.8s infinite ease-in-out alternate;
}
.rec-live-bar:nth-child(2) { animation-delay: 0.15s; }
.rec-live-bar:nth-child(3) { animation-delay: 0.3s; }
.rec-live-bar:nth-child(4) { animation-delay: 0.45s; }
.rec-live-bar:nth-child(5) { animation-delay: 0.2s; }
.rec-live-bar:nth-child(6) { animation-delay: 0.35s; }

@keyframes liveWave {
  0% { height: 4px; }
  100% { height: 16px; }
}

.rec-action-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  border: none;
  font-size: 12px;
  transition: transform 0.1s ease;
}
.rec-action-btn:active {
  transform: scale(0.92);
}
.rec-btn-cancel {
  background: var(--skip-red);
  color: var(--skip-red-text);
  border: 0.5px solid var(--skip-red-border);
}
.rec-btn-send {
  background: var(--accent);
  color: #ffffff;
}

.audio-msg-bubble {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 200px;
  max-width: 260px;
  padding: 4px 0;
  user-select: none;
}

.audio-play-trigger {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #ffffff;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.1s ease, background-color 0.2s ease;
}
.audio-play-trigger:active {
  transform: scale(0.95);
}

.waveform-timeline {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 3px;
  height: 28px;
  cursor: pointer;
  padding: 2px 0;
}

.waveform-line {
  flex: 1;
  border-radius: 3px;
  background: rgba(255, 255, 255, 0.2);
  transition: background-color 0.15s ease, transform 0.1s ease;
  pointer-events: none;
}
.light-mode .waveform-line {
  background: rgba(0, 0, 0, 0.15);
}
.waveform-line.played {
  background: var(--accent);
}

.audio-duration-txt {
  font-size: 11px;
  color: var(--dark-text-muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.light-mode .audio-duration-txt {
  color: var(--light-text-muted);
}

.gif-modal {
  display: none;
  position: absolute;
  bottom: 60px;
  right: 10px;
  width: min(320px, calc(100% - 20px));
  max-height: 390px;
  background: var(--dark-surface);
  border-radius: 14px;
  border: 0.5px solid var(--dark-border2);
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55);
  z-index: 1001;
  padding: 12px;
  overflow: hidden;
  flex-direction: column;
  gap: 10px;
}
.light-mode .gif-modal {
  background: var(--light-surface);
  border-color: var(--light-border2);
}

.gif-search {
  width: 100%;
  padding: 8px 12px;
  border-radius: 8px;
  border: 0.5px solid var(--dark-border2);
  background: var(--dark-input-bg);
  color: var(--dark-text);
  font-size: 13px;
  outline: none;
  box-sizing: border-box;
}
.light-mode .gif-search {
  background: var(--light-input-bg);
  border-color: var(--light-border2);
  color: var(--light-text);
}

.gif-results {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 300px;
  padding-right: 2px;
}
.gif-results::-webkit-scrollbar {
  width: 4px;
}
.gif-results::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.1);
  border-radius: 4px;
}
.light-mode .gif-results::-webkit-scrollbar-thumb {
  background: rgba(0, 0, 0, 0.1);
}

.gif-item {
  width: 100%;
  height: 95px;
  object-fit: cover;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s ease, opacity 0.15s ease;
}
.gif-item:hover {
  transform: scale(1.03);
  opacity: 0.9;
}
</style>

<template id="audio-bubble-template">
  <div class="audio-msg-bubble">
    <button class="audio-play-trigger"><i class="fas fa-play"></i></button>
    <div class="waveform-timeline">
      <span class="waveform-line" style="height: 30%;"></span>
      <span class="waveform-line" style="height: 50%;"></span>
      <span class="waveform-line" style="height: 85%;"></span>
      <span class="waveform-line" style="height: 40%;"></span>
      <span class="waveform-line" style="height: 95%;"></span>
      <span class="waveform-line" style="height: 60%;"></span>
      <span class="waveform-line" style="height: 100%;"></span>
      <span class="waveform-line" style="height: 75%;"></span>
      <span class="waveform-line" style="height: 45%;"></span>
      <span class="waveform-line" style="height: 90%;"></span>
      <span class="waveform-line" style="height: 65%;"></span>
      <span class="waveform-line" style="height: 35%;"></span>
      <span class="waveform-line" style="height: 80%;"></span>
      <span class="waveform-line" style="height: 50%;"></span>
      <span class="waveform-line" style="height: 25%;"></span>
    </div>
    <span class="audio-duration-txt">0:00</span>
  </div>
</template>

<div class="gif-modal" id="gifModal">
  <input type="text" class="gif-search" id="gifSearch" placeholder="Search GIFs..." />
  <div class="gif-results" id="gifResults"></div>
</div>

<script>
window.MediaHub = (function () {
  let mediaRecorder = null;
  let audioChunks = [];
  let timerInterval = null;
  let currentSeconds = 0;
  let mediaStream = null;
  let voiceSendCallback = null;
  let gifSelectCallback = null;
  let giphyApiKey = '';

  const inputArea = document.querySelector(".input-area");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("voiceRecordBtn");
  const recBar = document.getElementById("recordingBar");
  const recTimer = document.getElementById("recTimer");
  const cancelBtn = document.getElementById("recCancel");
  const recSendBtn = document.getElementById("recSend");

  const gifModal = document.getElementById("gifModal");
  const gifSearch = document.getElementById("gifSearch");
  const gifResults = document.getElementById("gifResults");
  let gifBtn = null;

  async function requestAudioStream() {
    try {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      return true;
    } catch {
      alert("Microphone permission required to record audio.");
      return false;
    }
  }

  async function startRecording() {
    const granted = await requestAudioStream();
    if (!granted) return;

    audioChunks = [];
    currentSeconds = 0;

    let mimeType = "audio/webm";
    if (!MediaRecorder.isTypeSupported("audio/webm")) {
      mimeType = MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "";
    }

    mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.start(200);

    if (recTimer) recTimer.textContent = "0:00";
    timerInterval = setInterval(() => {
      currentSeconds++;
      const mins = Math.floor(currentSeconds / 60);
      const secs = currentSeconds % 60;
      if (recTimer) recTimer.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      if (currentSeconds >= 60) finishVoiceRecording();
    }, 1000);

    if (inputArea) inputArea.style.display = "none";
    if (micBtn) micBtn.style.display = "none";
    if (sendBtn) sendBtn.style.display = "none";
    if (recBar) recBar.style.display = "flex";
  }

  function cleanupStream() {
    if (mediaStream) {
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
    }
    clearInterval(timerInterval);
  }

  function resetVoiceUI() {
    if (recBar) recBar.style.display = "none";
    if (inputArea) inputArea.style.display = "flex";
    if (micBtn) micBtn.style.display = "flex";
    if (sendBtn) sendBtn.style.display = "flex";
    cleanupStream();
  }

  function abortVoiceRecording() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
    }
    resetVoiceUI();
  }

  function finishVoiceRecording() {
    if (!mediaRecorder || mediaRecorder.state === "inactive") return;
    const duration = currentSeconds;

    mediaRecorder.onstop = () => {
      cleanupStream();
      const mime = mediaRecorder.mimeType || "audio/webm";
      const blob = new Blob(audioChunks, { type: mime });
      const reader = new FileReader();

      reader.onloadend = () => {
        if (typeof voiceSendCallback === "function") {
          voiceSendCallback(reader.result, duration);
        }
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.stop();
    resetVoiceUI();
  }

  function formatTime(totalSeconds) {
    const mins = Math.floor(totalSeconds / 60);
    const secs = Math.floor(totalSeconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  function createAudioBubble(sourceData, initialDuration = 0) {
    const template = document.getElementById("audio-bubble-template");
    const node = template.content.cloneNode(true);
    const bubble = node.querySelector(".audio-msg-bubble");
    const playBtn = node.querySelector(".audio-play-trigger");
    const playIcon = playBtn.querySelector("i");
    const timeLabel = node.querySelector(".audio-duration-txt");
    const timeline = node.querySelector(".waveform-timeline");
    const bars = node.querySelectorAll(".waveform-line");

    const audio = new Audio(sourceData);

    if (initialDuration > 0) {
      timeLabel.textContent = formatTime(initialDuration);
    }

    audio.onloadedmetadata = () => {
      timeLabel.textContent = formatTime(audio.duration);
    };

    playBtn.onclick = () => {
      if (audio.paused) {
        document.querySelectorAll("audio").forEach((item) => {
          if (item !== audio) item.pause();
        });
        audio.play();
        playIcon.className = "fas fa-pause";
      } else {
        audio.pause();
        playIcon.className = "fas fa-play";
      }
    };

    audio.ontimeupdate = () => {
      const progress = audio.currentTime / (audio.duration || 1);
      timeLabel.textContent = formatTime(audio.currentTime);
      const activeIdx = Math.floor(progress * bars.length);
      bars.forEach((bar, index) => {
        bar.classList.toggle("played", index <= activeIdx);
      });
    };

    timeline.onclick = (e) => {
      const rect = timeline.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
      }
    };

    audio.onended = () => {
      playIcon.className = "fas fa-play";
      timeLabel.textContent = formatTime(audio.duration || initialDuration);
      bars.forEach((bar) => bar.classList.remove("played"));
    };

    return bubble;
  }

  async function fetchTrendingGifs() {
    if (!giphyApiKey) return;
    try {
      const res = await fetch(`https://api.giphy.com/v1/gifs/trending?api_key=${giphyApiKey}&limit=20`);
      renderGifs((await res.json()).data);
    } catch {}
  }

  async function searchGifs(query) {
    if (!giphyApiKey) return;
    if (!query.trim()) {
      fetchTrendingGifs();
      return;
    }
    try {
      const res = await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${giphyApiKey}&q=${encodeURIComponent(query)}&limit=20`);
      renderGifs((await res.json()).data);
    } catch {}
  }

  function renderGifs(gifs) {
    if (!gifResults) return;
    gifResults.innerHTML = "";
    if (!gifs) return;
    gifs.forEach((gif) => {
      const gifUrl = gif.images.fixed_height.url;
      const img = document.createElement("img");
      img.src = gifUrl;
      img.className = "gif-item";
      img.onclick = () => {
        if (typeof gifSelectCallback === "function") {
          gifSelectCallback(gifUrl);
        }
        gifModal.style.display = "none";
      };
      gifResults.appendChild(img);
    });
  }

  function bindEvents() {
    if (micBtn) micBtn.onclick = startRecording;
    if (cancelBtn) cancelBtn.onclick = abortVoiceRecording;
    if (recSendBtn) recSendBtn.onclick = finishVoiceRecording;

    gifBtn = document.querySelector('[for="gifInput"]') || document.getElementById("gifTriggerBtn");
    if (gifBtn) {
      gifBtn.onclick = (e) => {
        e.preventDefault();
        const isOpen = gifModal.style.display === "flex";
        gifModal.style.display = isOpen ? "none" : "flex";
        if (!isOpen) fetchTrendingGifs();
      };
    }

    if (gifSearch) {
      gifSearch.addEventListener("keypress", (e) => {
        if (e.key === "Enter") searchGifs(gifSearch.value);
      });
    }

    window.addEventListener("click", (e) => {
      if (gifModal && gifModal.style.display === "flex") {
        if (!gifModal.contains(e.target) && gifBtn && !gifBtn.contains(e.target)) {
          gifModal.style.display = "none";
        }
      }
    });
  }

  return {
    init: function (config = {}) {
      voiceSendCallback = config.onSendVoice || null;
      gifSelectCallback = config.onSelectGif || null;
      giphyApiKey = config.giphyApiKey || '';
      bindEvents();
    },
    setApiKey: function (key) {
      giphyApiKey = key;
    },
    renderAudioBubble: createAudioBubble
  };
})();
</script>
