<style>
:root {
  --dark-surface: #111114;
  --dark-border: rgba(255,255,255,0.06);
  --dark-text: #fff;
  --dark-icon: #aaa;
  --dark-icon-hover: rgba(255,255,255,0.1);
  --light-surface: #ffffff;
  --light-border: rgba(0,0,0,0.1);
  --light-text: #111;
  --light-icon: #555;
  --light-icon-hover: rgba(0,0,0,0.07);
}

.header {
  position: fixed !important;
  top: 0;
  left: 0;
  width: 100%;
  height: 50px;
  background: var(--dark-surface);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 0.5px solid var(--dark-border);
  z-index: 10000;
}

body.light-mode .header {
  background: var(--light-surface);
  border-bottom: 0.5px solid var(--light-border);
}

.back-btn {
  background: transparent;
  border: none;
  color: var(--dark-icon);
  cursor: pointer;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: all 0.2s;
}

.back-btn svg {
  width: 14px;
  height: 18px;
  fill: currentColor;
}

.back-btn:hover {
  background: var(--dark-icon-hover);
  color: var(--dark-text);
}

body.light-mode .back-btn {
  color: var(--light-icon);
}

body.light-mode .back-btn:hover {
  background: var(--light-icon-hover);
  color: var(--light-text);
}
</style>

<header class="header">
    <button class="back-btn" onclick="goBack()">
        <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 66.91 122.88">
            <path d="M64.96,111.2c2.65,2.73,2.59,7.08-0.13,9.73c-2.73,2.65-7.08,2.59-9.73-0.14L1.97,66.01l4.93-4.8l-4.95,4.8 c-2.65-2.74-2.59-7.1,0.15-9.76c0.08-0.08,0.16-0.15,0.24-0.22L55.1,2.09c2.65-2.73,7-2.79,9.73-0.14 c2.73,2.65,2.78,7.01,0.13,9.73L16.5,61.23L64.96,111.2L64.96,111.2L64.96,111.2z"/>
        </svg>
    </button>
</header>

<script>
function goBack() {
    window.history.back();
}
</script>
