<style>
:root {
  --ak-accent: #ff6b4a;
  --ak-accent-hover: #ff5535;
  --ak-success: #22c55e;
  --ak-error: #ff6b6b;
  --ak-warning: #f5a623;
  --ak-info: #4a9eff;

  --ak-dark-surface: #111114;
  --ak-dark-card: #1a1a1e;
  --ak-dark-border: rgba(255,255,255,0.08);
  --ak-dark-text: #ffffff;
  --ak-dark-text-muted: rgba(255,255,255,0.5);

  --ak-light-surface: #ffffff;
  --ak-light-card: #f8f8f8;
  --ak-light-border: rgba(0,0,0,0.1);
  --ak-light-text: #111111;
  --ak-light-text-muted: rgba(0,0,0,0.45);
}

.ak-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(2px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999999;
  opacity: 0;
  transition: opacity .25s ease;
  padding: 20px;
}
.ak-overlay.ak-show { opacity: 1; }

.ak-card {
  background: var(--ak-dark-surface);
  border: 0.5px solid var(--ak-dark-border);
  border-radius: 22px;
  width: 100%;
  max-width: 320px;
  padding: 28px 24px 20px 24px;
  text-align: center;
  transform: scale(0.82) translateY(10px);
  opacity: 0;
  transition: transform .38s cubic-bezier(0.34, 1.56, 0.64, 1), opacity .25s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  box-sizing: border-box;
}
body.light-mode .ak-card { background: var(--ak-light-surface); border-color: var(--ak-light-border); box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
.ak-overlay.ak-show .ak-card { transform: scale(1) translateY(0); opacity: 1; }

.ak-icon-stage {
  width: 76px;
  height: 76px;
  margin: 0 auto 18px auto;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ak-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--ak-c, var(--ak-accent));
  opacity: 0;
}
.ak-overlay.ak-show .ak-ring {
  animation: ak-ripple 0.9s ease-out .15s;
}
@keyframes ak-ripple {
  0% { transform: scale(0.6); opacity: 0.6; }
  100% { transform: scale(1.45); opacity: 0; }
}
.ak-icon-circle {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--ak-c, var(--ak-accent)) 14%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.ak-icon-circle svg { width: 32px; height: 32px; overflow: visible; }
.ak-icon-circle svg path, .ak-icon-circle svg polyline, .ak-icon-circle svg line {
  stroke: var(--ak-c, var(--ak-accent));
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
}
.ak-overlay.ak-show .ak-icon-circle svg path,
.ak-overlay.ak-show .ak-icon-circle svg polyline,
.ak-overlay.ak-show .ak-icon-circle svg line {
  animation: ak-draw .45s ease-out .25s forwards;
}
@keyframes ak-draw { to { stroke-dashoffset: 0; } }
.ak-icon-circle.ak-shake { animation: ak-shake .45s ease-in-out .2s; }
@keyframes ak-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}

.ak-title { font-size: 17px; font-weight: 700; margin: 0 0 6px 0; color: var(--ak-dark-text); font-family: sans-serif; }
body.light-mode .ak-title { color: var(--ak-light-text); }
.ak-text { font-size: 13.5px; line-height: 1.5; color: var(--ak-dark-text-muted); margin: 0 0 22px 0; font-family: sans-serif; }
body.light-mode .ak-text { color: var(--ak-light-text-muted); }

.ak-actions { display: flex; gap: 10px; }
.ak-btn {
  flex: 1;
  padding: 12px 0;
  border-radius: 12px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: sans-serif;
  transition: transform .1s, background .15s, opacity .15s;
}
.ak-btn:active { transform: scale(0.97); }
.ak-btn-primary { background: var(--ak-c, var(--ak-accent)); color: #fff; }
.ak-btn-primary:hover { filter: brightness(1.08); }
.ak-btn-ghost {
  background: var(--ak-dark-card);
  color: var(--ak-dark-text);
  border: 0.5px solid var(--ak-dark-border);
}
body.light-mode .ak-btn-ghost { background: var(--ak-light-card); color: var(--ak-light-text); border-color: var(--ak-light-border); }

.ak-toast-wrap {
  position: fixed;
  top: 16px;
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  z-index: 999999;
  pointer-events: none;
}
.ak-toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--ak-dark-card);
  border: 0.5px solid var(--ak-dark-border);
  color: var(--ak-dark-text);
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 13px;
  font-family: sans-serif;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  transform: translateY(-30px);
  opacity: 0;
  transition: transform .35s cubic-bezier(0.34,1.56,0.64,1), opacity .3s ease;
  max-width: 340px;
  box-sizing: border-box;
}
body.light-mode .ak-toast { background: var(--ak-light-card); color: var(--ak-light-text); border-color: var(--ak-light-border); }
.ak-toast.ak-toast-show { transform: translateY(0); opacity: 1; }
.ak-toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ak-c, var(--ak-accent)); flex-shrink: 0; }

@media (prefers-reduced-motion: reduce) {
  .ak-card, .ak-ring, .ak-icon-circle svg path, .ak-icon-circle svg polyline,
  .ak-icon-circle svg line, .ak-icon-circle.ak-shake, .ak-toast { animation: none !important; transition: opacity .2s ease !important; }
}
</style>

<script>
const AlertKit = (function () {
  const COLORS = {
    success: 'var(--ak-success)',
    error: 'var(--ak-error)',
    warning: 'var(--ak-warning)',
    info: 'var(--ak-info)',
    default: 'var(--ak-accent)'
  };

  const ICONS = {
    success: `<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>`,
    error: `<svg viewBox="0 0 24 24"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>`,
    warning: `<svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="14"/><line x1="12" y1="19" x2="12" y2="19.2"/></svg>`,
    info: `<svg viewBox="0 0 24 24"><line x1="12" y1="10" x2="12" y2="18"/><line x1="12" y1="5.5" x2="12" y2="5.8"/></svg>`,
    default: `<svg viewBox="0 0 24 24"><line x1="12" y1="10" x2="12" y2="18"/><line x1="12" y1="5.5" x2="12" y2="5.8"/></svg>`
  };

  function fire(opts) {
    return new Promise((resolve) => {
      const {
        type = 'default',
        title = '',
        text = '',
        confirmText = 'OK',
        cancelText = null,
      } = opts;

      const overlay = document.createElement('div');
      overlay.className = 'ak-overlay';

      const color = COLORS[type] || COLORS.default;
      const icon = ICONS[type] || ICONS.default;

      overlay.innerHTML = `
        <div class="ak-card" style="--ak-c:${color}">
          <div class="ak-icon-stage">
            <div class="ak-ring"></div>
            <div class="ak-icon-circle ${type === 'error' ? 'ak-shake' : ''}">${icon}</div>
          </div>
          <h3 class="ak-title"></h3>
          <p class="ak-text"></p>
          <div class="ak-actions">
            ${cancelText ? `<button class="ak-btn ak-btn-ghost" data-act="cancel">${cancelText}</button>` : ''}
            <button class="ak-btn ak-btn-primary" data-act="confirm">${confirmText}</button>
          </div>
        </div>`;

      overlay.querySelector('.ak-title').textContent = title;
      overlay.querySelector('.ak-text').textContent = text;

      document.body.appendChild(overlay);
      overlay.offsetHeight;
      overlay.classList.add('ak-show');

      function close(result) {
        overlay.classList.remove('ak-show');
        setTimeout(() => overlay.remove(), 250);
        document.removeEventListener('keydown', escHandler);
        resolve(result);
      }

      function escHandler(e) {
        if (e.key === 'Escape') close(false);
      }
      document.addEventListener('keydown', escHandler);

      overlay.querySelector('[data-act="confirm"]').addEventListener('click', () => close(true));
      const cancelBtn = overlay.querySelector('[data-act="cancel"]');
      if (cancelBtn) cancelBtn.addEventListener('click', () => close(false));

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay && !cancelBtn) close(true);
      });
    });
  }

  function success(title, text) { return fire({ type: 'success', title, text }); }
  function error(title, text) { return fire({ type: 'error', title, text }); }
  function warning(title, text) { return fire({ type: 'warning', title, text, confirmText: 'Got it' }); }
  function info(title, text) { return fire({ type: 'info', title, text }); }
  function confirm(title, text, confirmText = 'Yes', cancelText = 'Cancel') {
    return fire({ type: 'warning', title, text, confirmText, cancelText });
  }

  function toast(text, type = 'default', duration = 2200) {
    let wrap = document.querySelector('.ak-toast-wrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.className = 'ak-toast-wrap';
      document.body.appendChild(wrap);
    }
    const color = COLORS[type] || COLORS.default;
    const el = document.createElement('div');
    el.className = 'ak-toast';
    el.style.setProperty('--ak-c', color);
    el.innerHTML = `<span class="ak-toast-dot"></span><span>${text}</span>`;
    wrap.appendChild(el);
    el.offsetHeight;
    el.classList.add('ak-toast-show');
    setTimeout(() => {
      el.classList.remove('ak-toast-show');
      setTimeout(() => el.remove(), 300);
    }, duration);
  }

  return { fire, success, error, warning, info, confirm, toast };
})();
</script>
