<style>
.comment-modal-backdrop {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  height: 100%;
  height: 100dvh;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(4px);
  z-index: 10005;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  overscroll-behavior: contain;
}
.comment-modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.comment-modal-container {
  width: 100%;
  max-width: 580px;
  height: 82%;
  max-height: 720px;
  background: var(--dark-card);
  border-radius: 20px 20px 0 0;
  border: 1px solid var(--dark-border2);
  border-bottom: none;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), height 0.2s ease;
  overflow: hidden;
}
.light-mode .comment-modal-container {
  background: var(--light-surface);
  border-color: var(--light-border2);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);
}
.comment-modal-backdrop.open .comment-modal-container {
  transform: translateY(0);
}
.comment-modal-backdrop.keyboard-open .comment-modal-container {
  height: 100%;
  max-height: none;
  border-radius: 16px 16px 0 0;
}

@media (min-width: 640px) {
  .comment-modal-backdrop {
    align-items: center;
  }
  .comment-modal-container {
    height: 75%;
    border-radius: 18px;
    border-bottom: 1px solid var(--dark-border2);
    transform: scale(0.95) translateY(20px);
  }
  .light-mode .comment-modal-container {
    border-bottom: 1px solid var(--light-border2);
  }
  .comment-modal-backdrop.open .comment-modal-container {
    transform: scale(1) translateY(0);
  }
  .comment-modal-backdrop.keyboard-open .comment-modal-container {
    height: 75%;
    max-height: 720px;
    border-radius: 18px;
  }
}

.comment-modal-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--dark-border2);
  flex-shrink: 0;
}
.light-mode .comment-modal-header {
  border-color: var(--light-border2);
}

.comment-modal-handle {
  width: 36px;
  height: 4px;
  background: var(--dark-border2);
  border-radius: 2px;
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
}
.light-mode .comment-modal-handle {
  background: var(--light-border2);
}

.comment-modal-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--dark-text);
  margin: 0;
}
.light-mode .comment-modal-title { color: var(--light-text); }

.comment-modal-close {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--dark-icon-color);
  font-size: 19px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.comment-modal-close:hover { background: var(--dark-icon-hover-bg); }
.light-mode .comment-modal-close { color: var(--light-icon-color); }
.light-mode .comment-modal-close:hover { background: var(--light-icon-hover-bg); }

.comment-modal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  -webkit-overflow-scrolling: touch;
}

.comment-empty-state {
  margin: auto;
  text-align: center;
  color: var(--dark-text-dim);
  font-size: 13px;
  padding: 30px 10px;
}
.light-mode .comment-empty-state { color: var(--light-text-dim); }

.comment-thread {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.comment-item {
  display: flex;
  gap: 10px;
  position: relative;
}

.comment-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent-dim);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  flex-shrink: 0;
  border: 1px solid var(--accent-border);
}
.comment-avatar.small {
  width: 24px;
  height: 24px;
  font-size: 10px;
}

.comment-main {
  flex: 1;
  min-width: 0;
}

.comment-header-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-bottom: 2px;
}

.comment-user-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
}
.comment-user-name:hover { text-decoration: underline; }

.comment-time {
  font-size: 10.5px;
  color: var(--dark-text-dim);
}
.light-mode .comment-time { color: var(--light-text-dim); }

.comment-text {
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--dark-text);
  word-wrap: break-word;
  overflow-wrap: anywhere;
}
.light-mode .comment-text { color: var(--light-text); }
.comment-text a {
  color: var(--accent);
  text-decoration: none;
}

.comment-mention {
  color: var(--accent);
  font-weight: 600;
  margin-right: 4px;
}

.comment-actions-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 4px;
}

.comment-action-link {
  background: none;
  border: none;
  padding: 0;
  font-size: 11px;
  font-weight: 600;
  color: var(--dark-text-muted);
  cursor: pointer;
  transition: color 0.15s;
}
.comment-action-link:hover { color: var(--accent); }
.light-mode .comment-action-link { color: var(--light-text-muted); }
.light-mode .comment-action-link:hover { color: var(--accent); }

.comment-del-btn {
  color: #ff6b6b !important;
  opacity: 0.8;
}
.comment-del-btn:hover { opacity: 1; }

.comment-replies-wrap {
  margin-left: 32px;
  padding-left: 10px;
  border-left: 2px solid var(--dark-border2);
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 4px;
}
.comment-replies-wrap:empty {
  display: none;
}
.light-mode .comment-replies-wrap {
  border-left-color: var(--light-border2);
}

.comment-modal-footer {
  border-top: 1px solid var(--dark-border2);
  background: var(--dark-header-bg);
  padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  flex-shrink: 0;
}
.comment-modal-backdrop.keyboard-open .comment-modal-footer {
  padding-bottom: 10px;
}
.light-mode .comment-modal-footer {
  border-color: var(--light-border2);
  background: var(--light-header-bg);
}

.reply-target-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px 6px;
  font-size: 11.5px;
  color: var(--dark-text-muted);
}
.light-mode .reply-target-bar { color: var(--light-text-muted); }
.reply-target-bar strong { color: var(--accent); font-weight: 600; }

.cancel-reply-btn {
  background: none;
  border: none;
  color: var(--dark-text-dim);
  cursor: pointer;
  font-size: 13px;
  padding: 2px 6px;
  border-radius: 4px;
}
.cancel-reply-btn:hover { color: var(--dark-text); }
.light-mode .cancel-reply-btn:hover { color: var(--light-text); }

.comment-input-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--dark-input-bg);
  border: 1px solid var(--dark-border2);
  border-radius: 24px;
  padding: 4px 6px 4px 14px;
  transition: border-color 0.2s;
}
.light-mode .comment-input-box {
  background: var(--light-input-bg);
  border-color: var(--light-border2);
}
.comment-input-box:focus-within {
  border-color: var(--accent-border);
  box-shadow: 0 0 0 2px var(--accent-dim);
}

.comment-input-field {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: var(--dark-text);
  font-size: 16px;
  padding: 6px 0;
}
.light-mode .comment-input-field { color: var(--light-text); }
.comment-input-field::placeholder { color: var(--dark-text-dim); }
.light-mode .comment-input-field::placeholder { color: var(--light-text-dim); }

.comment-send-submit-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s, opacity 0.15s;
}
.comment-send-submit-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.comment-send-submit-btn:not(:disabled):hover {
  transform: scale(1.06);
}
.comment-send-submit-btn:not(:disabled):active {
  transform: scale(0.92);
}
</style>

<div id="commentModalBackdrop" class="comment-modal-backdrop">
  <div class="comment-modal-container">
    <div class="comment-modal-header">
      <div class="comment-modal-handle"></div>
      <h3 class="comment-modal-title">Comments</h3>
      <button type="button" class="comment-modal-close" id="closeCommentModalBtn" title="Close">✕</button>
    </div>

    <div id="commentModalBody" class="comment-modal-body"></div>

    <div class="comment-modal-footer">
      <div id="replyTargetBar" class="reply-target-bar" style="display: none;">
        <span>Replying to <strong id="replyingToName">@User</strong></span>
        <button type="button" class="cancel-reply-btn" id="cancelReplyBtn" title="Cancel reply">✕</button>
      </div>
      <div class="comment-input-box">
        <input type="text" id="commentTextInput" class="comment-input-field" placeholder="Add a comment..." autocomplete="off" enterkeyhint="send">
        <button type="button" id="sendCommentBtn" class="comment-send-submit-btn" title="Post comment">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { getApp } from "firebase/app";
  import {
    getDatabase,
    ref,
    push,
    set,
    update,
    onChildAdded,
    onChildRemoved
  } from "firebase/database";

  const backdropEl = document.getElementById('commentModalBackdrop');
  const bodyEl = document.getElementById('commentModalBody');
  const inputEl = document.getElementById('commentTextInput');
  const sendBtnEl = document.getElementById('sendCommentBtn');
  const replyBarEl = document.getElementById('replyTargetBar');
  const replyNameEl = document.getElementById('replyingToName');

  let db = null;
  let activePostId = null;
  let activeOwner = null;
  let replyTarget = null;
  let comments = {};
  let unsubAdded = null;
  let unsubRemoved = null;
  let savedScrollY = 0;
  let isModalOpen = false;
  let renderTimer = null;

  function lockBodyScroll() {
    savedScrollY = window.scrollY || window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    document.body.style.position = 'fixed';
    document.body.style.top = `-${savedScrollY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
    document.body.style.overflow = 'hidden';
  }

  function unlockBodyScroll() {
    const htmlEl = document.documentElement;
    const prevScrollBehavior = htmlEl.style.scrollBehavior;
    htmlEl.style.scrollBehavior = 'auto';

    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    document.body.style.overflow = '';

    window.scrollTo(0, savedScrollY);

    requestAnimationFrame(() => {
      window.scrollTo(0, savedScrollY);
      htmlEl.style.scrollBehavior = prevScrollBehavior;
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'auto';
      }
    });
  }

  function deps() {
    return window.TRCommentDeps;
  }

  function emptyStateHtml() {
    return `
      <div class="comment-empty-state">
        <p>No comments yet.</p>
        <p style="font-size: 11.5px; opacity: 0.7;">Be the first to share your thoughts!</p>
      </div>
    `;
  }

  function commentHtml(comment, isReply, rootParentId) {
    const d = deps();
    const currentNick = d.getNickname();
    const isMine = currentNick && comment.nickname === currentNick;
    const initial = d.escapeHtml((comment.nickname || 'G').charAt(0).toUpperCase());
    const parentIdForReply = isReply ? rootParentId : comment.id;

    const safeText = comment.text
      ? (d.containsBannedWords(comment.text)
        ? '<span style="color:var(--dark-text-dim);font-style:italic;">Hidden due to inappropriate content</span>'
        : d.makeTextClickable(comment.text))
      : '';

    const mentionHtml = comment.replyToNickname
      ? `<span class="comment-mention">@${d.escapeHtml(comment.replyToNickname)}</span>`
      : '';

    const authorDisplay = d.escapeHtml(comment.nickname || 'Guest');
    const safeAuthorAttr = d.escapeHtml(comment.nickname || '');
    const safeParentIdAttr = d.escapeHtml(parentIdForReply || '');
    const safeCommentIdAttr = d.escapeHtml(comment.id || '');

    return `
      <div class="comment-item ${isReply ? 'reply-comment' : 'root-comment'}" id="comment-${safeCommentIdAttr}">
        <div class="comment-avatar ${isReply ? 'small' : ''}">${initial}</div>
        <div class="comment-main">
          <div class="comment-header-row">
            <span class="comment-user-name" data-action="view-commenter-profile" data-nickname="${safeAuthorAttr}">${authorDisplay}</span>
            <span class="comment-time">${d.timeSince(comment.timestamp)}</span>
          </div>
          <div class="comment-text">${mentionHtml}${safeText}</div>
          <div class="comment-actions-row">
            <button type="button" class="comment-action-link" data-action="reply-comment" data-parent-id="${safeParentIdAttr}" data-nickname="${authorDisplay}">Reply</button>
            ${isMine ? `<button type="button" class="comment-action-link comment-del-btn" data-action="delete-comment" data-comment-id="${safeCommentIdAttr}" data-nickname="${safeAuthorAttr}">Delete</button>` : ''}
          </div>
        </div>
      </div>
    `;
  }

  function renderAllComments() {
    const allList = Object.values(comments);
    if (allList.length === 0) {
      bodyEl.innerHTML = emptyStateHtml();
      return;
    }

    const roots = allList.filter(c => !c.parentId);
    const replies = allList.filter(c => !!c.parentId);

    roots.sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));

    const replyMap = {};
    replies.forEach(r => {
      if (!replyMap[r.parentId]) replyMap[r.parentId] = [];
      replyMap[r.parentId].push(r);
    });

    Object.keys(replyMap).forEach(pId => {
      replyMap[pId].sort((a, b) => (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0));
    });

    const frag = document.createDocumentFragment();

    roots.forEach(rootComment => {
      const threadDiv = document.createElement('div');
      threadDiv.className = 'comment-thread';
      threadDiv.id = `thread-${rootComment.id}`;
      threadDiv.innerHTML = commentHtml(rootComment, false, null);

      const repliesWrap = document.createElement('div');
      repliesWrap.className = 'comment-replies-wrap';
      repliesWrap.id = `replies-wrap-${rootComment.id}`;

      const threadReplies = replyMap[rootComment.id] || [];
      threadReplies.forEach(reply => {
        repliesWrap.insertAdjacentHTML('beforeend', commentHtml(reply, true, rootComment.id));
      });

      threadDiv.appendChild(repliesWrap);
      frag.appendChild(threadDiv);
    });

    bodyEl.innerHTML = '';
    bodyEl.appendChild(frag);
  }

  function scheduleRender() {
    if (renderTimer) cancelAnimationFrame(renderTimer);
    renderTimer = requestAnimationFrame(() => {
      renderAllComments();
    });
  }

  function detachListeners() {
    if (unsubAdded) unsubAdded();
    if (unsubRemoved) unsubRemoved();
    unsubAdded = null;
    unsubRemoved = null;
    if (renderTimer) cancelAnimationFrame(renderTimer);
    renderTimer = null;
  }

  function attachListeners(postId) {
    detachListeners();
    comments = {};
    bodyEl.innerHTML = emptyStateHtml();

    const postCommentsRef = ref(db, `comments/${postId}`);

    unsubAdded = onChildAdded(postCommentsRef, (snapshot) => {
      if (activePostId !== postId) return;
      const commentId = snapshot.key;
      const val = snapshot.val();
      if (!val) return;
      comments[commentId] = { id: commentId, ...val };
      scheduleRender();
    }, () => {});

    unsubRemoved = onChildRemoved(postCommentsRef, (snapshot) => {
      if (activePostId !== postId) return;
      const commentId = snapshot.key;
      delete comments[commentId];
      scheduleRender();
    }, () => {});
  }

  function cancelReply() {
    replyTarget = null;
    replyBarEl.style.display = 'none';
  }

  function setReply(parentId, targetNickname) {
    replyTarget = { parentId, targetNickname };
    replyNameEl.textContent = `@${targetNickname}`;
    replyBarEl.style.display = 'flex';
    inputEl.focus({ preventScroll: true });
  }

  function syncViewport() {
    const vv = window.visualViewport;
    if (!vv || !backdropEl.classList.contains('open')) return;
    backdropEl.style.top = vv.offsetTop + 'px';
    backdropEl.style.height = vv.height + 'px';
    const keyboardOpen = (window.innerHeight - vv.height) > 120;
    backdropEl.classList.toggle('keyboard-open', keyboardOpen);
  }

  function resetViewport() {
    backdropEl.style.top = '0px';
    backdropEl.style.height = '100%';
    backdropEl.classList.remove('keyboard-open');
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewport);
    window.visualViewport.addEventListener('scroll', syncViewport);
  }

  function cleanupModalUI() {
    if (!isModalOpen) return;
    isModalOpen = false;
    inputEl.blur();
    backdropEl.classList.remove('open');
    unlockBodyScroll();
    detachListeners();
    activePostId = null;
    activeOwner = null;
    comments = {};
    cancelReply();
    resetViewport();
  }

  window.openCommentModal = (postId, ownerNickname) => {
    db = getDatabase(getApp());
    activePostId = postId;
    activeOwner = ownerNickname || null;
    cancelReply();
    inputEl.value = '';
    inputEl.blur();

    isModalOpen = true;
    history.pushState({ commentModalOpen: true }, '');

    lockBodyScroll();
    backdropEl.classList.add('open');
    attachListeners(postId);
    syncViewport();
  };

  window.closeCommentModal = () => {
    if (!isModalOpen) return;
    if (history.state && history.state.commentModalOpen) {
      history.back();
    } else {
      cleanupModalUI();
    }
  };

  window.addEventListener('popstate', () => {
    if (isModalOpen) {
      cleanupModalUI();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isModalOpen) {
      window.closeCommentModal();
    }
  });

  async function submitComment() {
    const d = deps();
    const nick = d.getNickname();
    if (!nick) {
      AlertKit.warning("Nickname needed", "Click on Pencil button to set your Nickname first!");
      return;
    }

    const text = inputEl.value.trim();
    if (!text) return;

    if (d.containsBannedWords(text)) {
      AlertKit.error("Blocked", "Your comment contains inappropriate content and cannot be sent.");
      return;
    }

    if (!activePostId) return;

    const postId = activePostId;
    const currentReply = replyTarget;
    sendBtnEl.disabled = true;

    try {
      const newCommentRef = push(ref(db, `comments/${postId}`));

      const payload = {
        nickname: nick,
        text: text,
        timestamp: Date.now()
      };

      const redirectUrl = (d.postUrl || window.location.pathname) + '?postId=' + postId;

      if (currentReply) {
        payload.parentId = currentReply.parentId;
        payload.replyToNickname = currentReply.targetNickname;
      }

      await set(newCommentRef, payload);

      if (currentReply && currentReply.targetNickname && currentReply.targetNickname !== nick) {
        d.sendNotification(currentReply.targetNickname, {
          type: 'reply',
          postId: postId,
          message: text,
          redirectUrl: redirectUrl
        });
      } else if (!currentReply && activeOwner && activeOwner !== nick) {
        d.sendNotification(activeOwner, {
          type: 'comment',
          postId: postId,
          message: text,
          redirectUrl: redirectUrl
        });
      }

      inputEl.value = '';
      cancelReply();

      if (currentReply) {
        setTimeout(() => {
          const threadEl = document.getElementById(`thread-${currentReply.parentId}`);
          if (threadEl) threadEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 120);
      } else {
        bodyEl.scrollTop = 0;
      }
    } catch (err) {
      AlertKit.error("Failed", "Could not post reply. Please try again.");
    } finally {
      sendBtnEl.disabled = false;
    }
  }

  async function deleteComment(commentId, authorNickname) {
    const currentNick = deps().getNickname();
    if (!currentNick || currentNick !== authorNickname) {
      AlertKit.error("Unauthorized", "You can only delete your own comments!");
      return;
    }

    const isConfirmed = await AlertKit.confirm(
      'Delete Comment?',
      'Do you want to permanently delete this comment?',
      'Yes, Delete',
      'Cancel'
    );

    if (isConfirmed && activePostId) {
      try {
        const updates = {};
        updates[`comments/${activePostId}/${commentId}`] = null;

        Object.keys(comments).forEach((cId) => {
          if (comments[cId].parentId === commentId) {
            updates[`comments/${activePostId}/${cId}`] = null;
          }
        });

        await update(ref(db), updates);
        AlertKit.toast("Comment deleted", "success");
      } catch (e) {
        AlertKit.toast("Failed to delete comment", "error");
      }
    }
  }

  document.getElementById('closeCommentModalBtn').addEventListener('click', window.closeCommentModal);
  document.getElementById('cancelReplyBtn').addEventListener('click', cancelReply);
  sendBtnEl.addEventListener('click', submitComment);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      submitComment();
    }
  });

  backdropEl.addEventListener('click', (e) => {
    if (e.target === backdropEl) window.closeCommentModal();
  });

  bodyEl.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.getAttribute('data-action');

    if (action === 'reply-comment') {
      setReply(actionEl.getAttribute('data-parent-id'), actionEl.getAttribute('data-nickname'));
    } else if (action === 'delete-comment') {
      deleteComment(actionEl.getAttribute('data-comment-id'), actionEl.getAttribute('data-nickname'));
    } else if (action === 'view-commenter-profile') {
      const nickname = actionEl.getAttribute('data-nickname');
      if (nickname) {
        window.location.href = `/profile.html?id=${encodeURIComponent(nickname)}`;
      }
    }
  });
</script>
