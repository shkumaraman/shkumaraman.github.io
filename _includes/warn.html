<style>
  .warning-overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(8px);
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.25s ease, visibility 0.25s ease;
  }
  .warning-overlay.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }
  .warning-card {
    background: var(--dark-surface, #18181b);
    border-radius: 16px;
    padding: 28px 22px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    color: var(--dark-text, #fff);
    border: 1px solid rgba(255, 107, 74, 0.4);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 107, 74, 0.2);
    transform: translateY(20px) scale(0.96);
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .warning-overlay.active .warning-card {
    transform: translateY(0) scale(1);
  }
  .light-mode .warning-card {
    background: var(--light-surface, #ffffff);
    border-color: rgba(255, 107, 74, 0.4);
    color: var(--light-text, #18181b);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 0 25px rgba(255, 107, 74, 0.15);
  }
  .warning-icon-wrap {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    background: rgba(255, 107, 74, 0.15);
    border: 1px solid rgba(255, 107, 74, 0.3);
    color: #ff6b4a;
  }
  .warning-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 8px;
    color: #ff6b4a;
  }
  .warning-desc {
    font-size: 14px;
    line-height: 1.5;
    color: var(--dark-text-muted, #a1a1aa);
    margin: 0 0 22px;
  }
  .light-mode .warning-desc {
    color: var(--light-text-muted, #71717a);
  }
  .warning-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    background: #ff6b4a;
    color: #fff;
    transition: background 0.2s, transform 0.1s;
  }
  .warning-btn:hover { background: #ff5535; }
  .warning-btn:active { transform: scale(0.97); }
  .warning-actions {
    display: flex;
    gap: 10px;
    width: 100%;
  }
  .warning-actions .warning-btn {
    flex: 1;
    text-align: center;
    text-decoration: none;
    box-sizing: border-box;
  }
  .warning-btn.secondary {
    background: transparent;
    color: #ff6b4a;
    border: 1px solid rgba(255, 107, 74, 0.5);
  }
  .warning-btn.secondary:hover {
    background: rgba(255, 107, 74, 0.12);
  }
</style>

<div id="talkrushWarningModal" class="warning-overlay" aria-hidden="true" role="dialog">
  <div class="warning-card">
    <div class="warning-icon-wrap">
      <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
        <line x1="12" y1="9" x2="12" y2="13"></line>
        <line x1="12" y1="17" x2="12.01" y2="17"></line>
      </svg>
    </div>
    <h3 class="warning-title" id="talkrushWarningTitle">Message Blocked</h3>
    <p class="warning-desc" id="talkrushWarningDesc">Your message violates our chat rules. Promotion of other platforms is not allowed.</p>
    <div class="warning-actions">
      <a href="/rules.html" class="warning-btn secondary" target="_blank" rel="noopener">Rules</a>
      <button class="warning-btn" id="talkrushWarningClose" type="button">Got it, Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  let lastTargetInput = null;

  const blockedUrlRegex = /(^|[^a-z0-9.-])(bit\.ly|tinyurl|cutt\.ly|linktr\.ee|rebrand\.ly|shorturl|tiny\.cc|is\.gd|t\.co|v\.gd|bio\.link|beacons\.ai|taplink|heylink|onrender|vercel|github\.io|t\.me|chatix|strangerloopconnect\.web\.app|web\.app)(?![a-z0-9-])/i;
  const y99Regex = /(^|[^a-z0-9])y99([^a-z0-9]|$)/i;

  const blockedApps = [
    'strangerloopconnect', 'strangerloop',
    'chatzyo', 'zangi', 'telegram', 'chatib', 'joingy',
    'knotchat', 'subichat', 'justalk', 'onlyfans', 'chatblink',
    'chitchatgg', 'chitchat', 'talkwithstranger', 'talktostrangers',
    'chatix'
  ];

  const LEET_MAP = {
    '@': 'a', '4': 'a',
    '0': 'o',
    '1': 'i', '!': 'i',
    '$': 's', '5': 's',
    '3': 'e',
    '7': 't'
  };
  const LEET_REGEX = /[@401!$537]/g;

  const BTN_TO_INPUT_MAP = {
    'sendCommentBtn': 'commentTextInput',
    'sendBtn': 'msgInput',
    'submitBtn': 'postText'
  };

  const INPUT_IDS = new Set(['commentTextInput', 'msgInput', 'postText']);

  const modal = document.getElementById('talkrushWarningModal');
  const modalTitle = document.getElementById('talkrushWarningTitle');
  const modalDesc = document.getElementById('talkrushWarningDesc');
  const modalClose = document.getElementById('talkrushWarningClose');

  function showWarning(title, desc) {
    modalTitle.textContent = title;
    modalDesc.textContent = desc;
    modal.classList.add('active');
    modal.setAttribute('aria-hidden', 'false');
  }

  function closeWarning() {
    modal.classList.remove('active');
    modal.setAttribute('aria-hidden', 'true');
    if (lastTargetInput) {
      lastTargetInput.focus();
    }
  }

  function detectProhibitedPlatforms(text) {
    if (!text) return false;
    const lower = text.toLowerCase();

    if (blockedUrlRegex.test(lower) || y99Regex.test(lower)) return true;

    const normalized = lower
      .replace(LEET_REGEX, (ch) => LEET_MAP[ch] || '')
      .replace(/[^a-z]/g, '');

    return blockedApps.some((app) => normalized.includes(app));
  }

  function resolveTargetInput(sourceEl) {
    if (!sourceEl) return null;
    if (INPUT_IDS.has(sourceEl.id)) return sourceEl;
    const inputId = BTN_TO_INPUT_MAP[sourceEl.id];
    return inputId ? document.getElementById(inputId) : null;
  }

  function interceptSubmission(e, sourceEl) {
    const targetInput = resolveTargetInput(sourceEl);
    if (!targetInput) return true;

    const rawContent = targetInput.value.trim();
    if (!rawContent) return true;

    lastTargetInput = targetInput;

    if (detectProhibitedPlatforms(rawContent)) {
      e.preventDefault();
      e.stopImmediatePropagation();
      showWarning('Message Blocked', 'Your message violates our chat rules. Promotion of other platforms is not allowed.');
      return false;
    }

    return true;
  }

  function initFilterEngine() {
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeWarning();
        return;
      }

      if (e.target && INPUT_IDS.has(e.target.id) && e.key === 'Enter' && !e.shiftKey) {
        interceptSubmission(e, e.target);
      }
    }, true);

    window.addEventListener('click', (e) => {
      const btn = e.target.closest('#sendCommentBtn, #sendBtn, #submitBtn');
      if (btn) {
        interceptSubmission(e, btn);
      }
    }, true);

    modalClose.addEventListener('click', closeWarning);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeWarning();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFilterEngine);
  } else {
    initFilterEngine();
  }
})();
</script>
