<style>
    :root {
        --accent: #ff5252;
        --accent-hover: #ff3b3b;
        --dark-bg: #121212;
        --light-bg: #f5f5f5;
        --surface: rgba(255,255,255,0.07);
        --surface-hover: rgba(255,255,255,0.13);
        --text: #f2f2f2;
        --text-dim: #a3a3a3;
        --track: rgba(255,255,255,0.18);
    }

    #miniPlayer {
        position: fixed;
        bottom: calc(60px + env(safe-area-inset-bottom, 0px));
        left: 12px;
        width: 38px;
        height: 38px;
        background: var(--accent);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 4px 14px rgba(255,82,82,0.45);
        transition: transform 0.2s, box-shadow 0.2s;
    }
    #miniPlayer:hover { transform: scale(1.08); box-shadow: 0 6px 18px rgba(255,82,82,0.6); }
    #miniPlayer:active { transform: scale(0.95); }
    #miniPlayer i { color: #fff; font-size: 17px; }

    #fullPlayer {
        position: fixed;
        inset: 0;
        background:
            radial-gradient(ellipse 80% 50% at 50% 0%, rgba(255,82,82,0.22), transparent 70%),
            var(--dark-bg);
        z-index: 8888;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(70px + env(safe-area-inset-bottom, 0px));
        box-sizing: border-box;
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        overflow-y: auto;
    }
    #fullPlayer[style*="flex"] { animation: playerIn 0.25s ease-out; }
    @keyframes playerIn {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: none; }
    }
    .light-mode #fullPlayer { background: var(--light-bg); color: #222; }

    .player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        width: 90%;
        max-width: 420px;
        margin-bottom: 22px;
    }
    #fullPlayer h3 {
        margin: 0;
        color: var(--accent);
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.3px;
    }
    .now-playing {
        font-size: 13px;
        color: var(--text-dim);
        max-width: 230px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: right;
    }

    .square-icon {
        width: min(50vw, 170px);
        aspect-ratio: 1;
        background: var(--accent);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        box-shadow: 0 12px 36px rgba(255,82,82,0.35), 0 4px 14px rgba(0,0,0,0.5);
        overflow: hidden;
        flex-shrink: 0;
    }
    .square-icon img {
        width: 100%;
        height: 100%;
        border-radius: 20px;
        object-fit: cover;
    }

    .search-container {
        width: 90%;
        max-width: 420px;
        position: relative;
        margin-bottom: 18px;
    }
    #searchInput {
        width: 100%;
        padding: 13px 54px 13px 18px;
        border: 1.5px solid transparent;
        border-radius: 999px;
        font-size: 15px;
        color: var(--text);
        background: var(--surface);
        transition: border-color 0.2s, background 0.2s;
        box-sizing: border-box;
    }
    #searchInput::placeholder { color: var(--text-dim); }
    #searchInput:focus { outline: none; border-color: var(--accent); background: var(--surface-hover); }

    #searchBtn {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--accent);
        border: none;
        border-radius: 50%;
        width: 38px;
        height: 38px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
    }
    #searchBtn:hover { background: var(--accent-hover); }
    #searchBtn i { color: #fff; font-size: 14px; }

    #searchResults {
        width: 100%;
        max-height: 260px;
        overflow-y: auto;
        background: #1e1e1e;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0,0,0,0.55);
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        z-index: 1001;
        margin-top: 8px;
    }
    .search-result-item {
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        cursor: pointer;
        display: flex;
        align-items: center;
        transition: background 0.15s;
    }
    .search-result-item:hover { background: var(--surface-hover); }
    .search-result-item:last-child { border-bottom: none; }
    .result-thumbnail {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        margin-right: 12px;
        object-fit: cover;
        flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-title {
        font-size: 14px;
        color: var(--text);
        margin-bottom: 3px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .result-channel { font-size: 12px; color: var(--text-dim); }

    .control-buttons {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 6px 0 14px;
    }
    .control-buttons button {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: none;
        background: var(--surface);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, transform 0.15s;
    }
    .control-buttons button:hover { background: var(--surface-hover); }
    .control-buttons button:active { transform: scale(0.92); }
    .control-buttons button i { font-size: 16px; color: #fff; }
    #playPauseBtn {
        width: 64px;
        height: 64px;
        background: var(--accent);
        box-shadow: 0 8px 22px rgba(255,82,82,0.45);
    }
    #playPauseBtn:hover { background: var(--accent-hover); }
    #playPauseBtn i { font-size: 22px; }
    #muteBtn.muted i { color: var(--accent) !important; }

    button:focus-visible, #searchInput:focus-visible, .slider:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 3px;
    }

    .slider {
        width: 90%;
        max-width: 420px;
        margin: 12px 0 6px;
        height: 6px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--track);
        outline: none;
        border-radius: 3px;
        cursor: pointer;
    }
    .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--accent);
        cursor: pointer;
        transition: transform 0.15s;
    }
    .slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    .slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--accent);
        cursor: pointer;
    }
    .slider::-moz-range-track { background: transparent; height: 6px; }

    .time-display {
        display: flex;
        justify-content: space-between;
        width: 90%;
        max-width: 420px;
        color: var(--text-dim);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
    }

    .error-message {
        color: var(--accent);
        font-size: 14px;
        margin: 0 0 12px;
        text-align: center;
        display: none;
    }
    .loading {
        display: none;
        margin: 0 0 12px;
        color: var(--text-dim);
        font-size: 14px;
    }

    #player { width: 1px; height: 1px; position: absolute; left: -9999px; opacity: 0; }

    @media (prefers-reduced-motion: reduce) {
        #fullPlayer[style*="flex"] { animation: none; }
        * { transition: none !important; }
    }
</style>

<div id="miniPlayer" title="Open/Close Player" role="button" aria-label="Open or close music player"><i class="fas fa-music"></i></div>

<div id="fullPlayer">
    <div class="player-header">
        <h3>MusicPlay</h3>
        <div class="now-playing" id="nowPlaying">Not playing</div>
    </div>

    <div class="square-icon">
        <img id="videoThumbnail" src="/chat/logo.png" alt="Thumbnail" onerror="this.src='/chat/logo.png'">
    </div>

    <div class="search-container">
        <input id="searchInput" placeholder="Search YouTube music..." autocomplete="off" />
        <button id="searchBtn" title="Search" aria-label="Search">
            <i class="fas fa-search"></i>
        </button>
        <div id="searchResults"></div>
    </div>

    <div class="loading" id="loadingIndicator">Searching...</div>
    <div class="error-message" id="errorMessage"></div>

    <div class="control-buttons">
        <button id="loopBtn" title="Loop On/Off" aria-label="Loop">
            <i class="fas fa-repeat" id="loopIcon"></i>
        </button>
        <button id="prevBtn" title="Back 10 seconds" aria-label="Back 10 seconds">
            <i class="fas fa-backward-step"></i>
        </button>
        <button id="playPauseBtn" title="Play/Pause" aria-label="Play or pause">
            <i class="fas fa-play" id="playPauseIcon"></i>
        </button>
        <button id="nextBtn" title="Forward 10 seconds" aria-label="Forward 10 seconds">
            <i class="fas fa-forward-step"></i>
        </button>
        <button id="muteBtn" title="Mute/Unmute" aria-label="Mute or unmute">
            <i class="fas fa-volume-up" id="muteIcon"></i>
        </button>
    </div>

    <input type="range" id="seekBar" class="slider" min="0" max="0" value="0" step="1" aria-label="Seek">
    <div class="time-display">
        <span id="curTime">0:00</span><span id="duration">0:00</span>
    </div>
</div>

<div id="player"></div>

<script type="module">
    import { initializeApp, getApps } from "firebase/app";
    import { getDatabase, ref, set, get, onValue, off, remove, update } from "firebase/database";

    const firebaseConfig = {
        databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const apps = getApps();
    const defaultApp = apps.find(a => a.name === '[DEFAULT]') || initializeApp(firebaseConfig);
    const database = getDatabase(defaultApp);

    function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    const TRACK_COLOR = 'rgba(255,255,255,.18)';

    const urlParams = new URLSearchParams(window.location.search);
    const GROUP_NAME = (urlParams.get('group') || 'default').replace(/[^a-zA-Z0-9_-]/g, '_');
    const FIREBASE_PATH = `music/${GROUP_NAME}`;

    var musicPlayer = {
        player: null,
        ytReady: false,
        isPlaying: false,
        isMuted: false,
        isLooping: false,
        currentSongUrl: "",
        firebaseListener: null,
        currentVideoTitle: "",
        lastAutoUpdate: 0,
        groupName: GROUP_NAME,
        cleanupTimer: null,
        hasUserLeft: false,
        isBackgroundPaused: false,
        isRemoteUpdate: false,
        isSeeking: false,

        init: function() {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', this.setupPlayer.bind(this));
            } else {
                this.setupPlayer();
            }

            this.startCleanupChecker();

            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    this.hasUserLeft = true;
                    this.isBackgroundPaused = true;
                } else {
                    this.hasUserLeft = false;

                    setTimeout(() => {
                        this.isBackgroundPaused = false;

                        if (this.ytReady && this.currentSongUrl && this.player && typeof this.player.seekTo === 'function') {
                            get(this.getFirebaseRef()).then((snapshot) => {
                                const data = snapshot.val();
                                if (data) {
                                    const { status, timestamp } = data;

                                    if (timestamp) {
                                        this.isRemoteUpdate = true;
                                        this.player.seekTo(timestamp, true);
                                        setTimeout(() => { this.isRemoteUpdate = false; }, 1000);
                                    }

                                    if (status === 'playing' && typeof this.player.getPlayerState === 'function' && this.player.getPlayerState() !== YT.PlayerState.PLAYING) {
                                        this.isRemoteUpdate = true;
                                        this.player.playVideo();
                                        setTimeout(() => { this.isRemoteUpdate = false; }, 1000);
                                    } else if (status === 'paused' && typeof this.player.getPlayerState === 'function' && this.player.getPlayerState() !== YT.PlayerState.PAUSED) {
                                        this.isRemoteUpdate = true;
                                        this.player.pauseVideo();
                                        setTimeout(() => { this.isRemoteUpdate = false; }, 1000);
                                    }
                                }
                            }).catch((error) => {
                                console.error("Firebase read error:", error);
                            });
                        }
                    }, 1000);
                }
            });

            window.addEventListener('beforeunload', () => {
                this.hasUserLeft = true;
                this.isBackgroundPaused = true;

                if (this.firebaseListener) {
                    off(this.getFirebaseRef(), 'value', this.firebaseListener);
                }
            });
        },

        startCleanupChecker: function() {
            this.cleanupTimer = setInterval(() => {
                this.cleanupEmptyGroups();
            }, 60000);
        },

        cleanupEmptyGroups: function() {
            if (!this.firebaseInitialized()) return;

            const sixHoursAgo = Date.now() - (6 * 60 * 60 * 1000);
            const dbRef = ref(database, 'music');

            get(dbRef).then((snapshot) => {
                const groups = snapshot.val() || {};

                Object.keys(groups).forEach(groupKey => {
                    const groupData = groups[groupKey];
                    const lastUpdate = groupData?.lastUpdate || 0;

                    if (lastUpdate < sixHoursAgo) {
                        const groupRef = ref(database, `music/${groupKey}`);
                        remove(groupRef).catch((error) => {
                            console.error("Cleanup error:", error);
                        });
                    }
                });
            }).catch((error) => {
                console.error("Cleanup read error:", error);
            });
        },

        getFirebaseRef: function() {
            return ref(database, FIREBASE_PATH);
        },

        setupPlayer: function() {
            if (!database) {
                console.error("Firebase not initialized");
                return;
            }

            this.setupEventListeners();
            this.setupFirebaseListener();

            if (typeof YT !== 'undefined' && YT.loaded) {
                this.onYouTubeIframeAPIReady();
            } else {
                window.onYouTubeIframeAPIReady = this.onYouTubeIframeAPIReady.bind(this);
            }
        },

        setupEventListeners: function() {
            const miniPlayer = document.getElementById('miniPlayer');
            const fullPlayer = document.getElementById('fullPlayer');
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const searchResults = document.getElementById('searchResults');
            const playPauseBtn = document.getElementById('playPauseBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const muteBtn = document.getElementById('muteBtn');
            const seekBar = document.getElementById('seekBar');
            const loopBtn = document.getElementById('loopBtn');

            miniPlayer.addEventListener('click', () => {
                fullPlayer.style.display = fullPlayer.style.display === 'flex' ? 'none' : 'flex';
            });

            searchBtn.addEventListener('click', this.handleSearch.bind(this));
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    this.handleSearch();
                }
            });

            document.addEventListener('click', (e) => {
                if (!searchResults.contains(e.target) && e.target !== searchInput && e.target !== searchBtn) {
                    searchResults.style.display = 'none';
                }
            });

            playPauseBtn.addEventListener('click', this.handlePlayPause.bind(this));
            prevBtn.addEventListener('click', this.handlePrev.bind(this));
            nextBtn.addEventListener('click', this.handleNext.bind(this));
            muteBtn.addEventListener('click', this.handleMute.bind(this));

            seekBar.addEventListener('input', (e) => {
                this.isSeeking = true;
                const sec = parseInt(e.target.value, 10);
                const d = Math.floor(this.player && this.ytReady && typeof this.player.getDuration === 'function' ? this.player.getDuration() || 0 : 0);
                document.getElementById('curTime').textContent = formatTime(sec);
                const progress = d > 0 ? (sec / d) * 100 : 0;
                seekBar.style.background = `linear-gradient(to right, #ff5252 ${progress}%, ${TRACK_COLOR} ${progress}%)`;
            });

            seekBar.addEventListener('change', () => {
                this.isSeeking = false;
                this.handleSeek();
            });

            loopBtn.addEventListener('click', this.handleLoop.bind(this));
        },

        setupFirebaseListener: function() {
            if (!this.firebaseInitialized()) return;
            if (this.firebaseListener) {
                off(this.getFirebaseRef(), 'value', this.firebaseListener);
            }

            const stateRef = this.getFirebaseRef();

            this.firebaseListener = (snapshot) => {
                const data = snapshot.val();
                if (!data || !this.ytReady) return;

                const { currentSong, status, timestamp, lastUpdate, loop } = data;
                if (!currentSong) return;

                this.isLooping = !!loop;
                this.updateLoopIcon();

                const vid = currentSong;

                let actualTime = timestamp || 0;
                if (lastUpdate) {
                    const timeDiff = Math.floor((Date.now() - lastUpdate) / 1000);
                    actualTime = timestamp + timeDiff;
                    if (actualTime < 0) actualTime = 0;
                }

                const currentVid = (this.player && typeof this.player.getVideoData === 'function') ? this.player.getVideoData().video_id : '';

                if (!currentVid || currentVid !== vid) {
                    this.isRemoteUpdate = true;
                    this.processNewSong(currentSong, status, actualTime);
                    setTimeout(() => { this.isRemoteUpdate = false; }, 2000);
                } else {
                    const currentTime = (typeof this.player.getCurrentTime === 'function') ? this.player.getCurrentTime() : 0;
                    if (Math.abs(currentTime - actualTime) > 3) {
                        this.isRemoteUpdate = true;
                        this.player.seekTo(actualTime, true);
                        setTimeout(() => { this.isRemoteUpdate = false; }, 1000);
                    }

                    if (status === 'playing' && typeof this.player.getPlayerState === 'function' && this.player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        this.isRemoteUpdate = true;
                        this.player.playVideo();
                        this.isPlaying = true;
                        this.updatePlayPauseIcon();
                        setTimeout(() => { this.isRemoteUpdate = false; }, 1000);
                    } else if (status === 'paused' && typeof this.player.getPlayerState === 'function' && this.player.getPlayerState() !== YT.PlayerState.PAUSED) {
                        this.isRemoteUpdate = true;
                        this.player.pauseVideo();
                        this.isPlaying = false;
                        this.updatePlayPauseIcon();
                        setTimeout(() => { this.isRemoteUpdate = false; }, 1000);
                    }
                }
            };

            onValue(stateRef, this.firebaseListener);
        },

        onYouTubeIframeAPIReady: function() {
            if (this.player) return;

            this.player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: '',
                playerVars: {
                    controls: 0,
                    modestbranding: 1,
                    rel: 0,
                    playsinline: 1,
                    origin: window.location.origin
                },
                events: {
                    onReady: () => {
                        this.ytReady = true;
                        this.checkSavedState();
                        if (typeof this.player.isMuted === 'function') {
                            this.isMuted = this.player.isMuted();
                            this.updateMuteIcon();
                        }
                    },
                    onError: this.onPlayerError.bind(this),
                    onStateChange: this.onPlayerStateChange.bind(this)
                }
            });
        },

        onPlayerStateChange: function(event) {
            if (this.hasUserLeft || this.isRemoteUpdate) return;

            if (event.data === YT.PlayerState.PLAYING) {
                this.isPlaying = true;
                this.updatePlayPauseIcon();

                if (this.currentSongUrl) {
                    this.updateState('playing');
                }
            } else if (event.data === YT.PlayerState.PAUSED) {
                this.isPlaying = false;
                this.updatePlayPauseIcon();

                if (!this.isBackgroundPaused && this.currentSongUrl) {
                    this.updateState('paused');
                }
            } else if (event.data === YT.PlayerState.ENDED && this.isLooping) {
                this.player.seekTo(0, true);
                this.player.playVideo();
            }
        },

        updatePlayPauseIcon: function() {
            const icon = document.getElementById('playPauseIcon');
            icon.className = this.isPlaying ? 'fas fa-pause' : 'fas fa-play';
        },

        updateMuteIcon: function() {
            const icon = document.getElementById('muteIcon');
            const muteBtn = document.getElementById('muteBtn');
            if (this.isMuted) {
                icon.className = 'fas fa-volume-mute';
                muteBtn.classList.add('muted');
            } else {
                icon.className = 'fas fa-volume-up';
                muteBtn.classList.remove('muted');
            }
        },

        updateLoopIcon: function() {
            const icon = document.getElementById('loopIcon');
            icon.style.color = this.isLooping ? '#ff5252' : '#fff';
        },

        onPlayerError: function(e) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = "Playback error.";
            errorMessage.style.display = 'block';
            document.getElementById('loadingIndicator').style.display = 'none';
        },

        checkSavedState: function() {
            if (!this.firebaseInitialized()) return;
            const stateRef = this.getFirebaseRef();
            get(stateRef).then((snapshot) => {
                const data = snapshot.val();
                if (data && data.currentSong) {
                    const { currentSong, status, timestamp, lastUpdate, loop } = data;

                    this.isLooping = !!loop;
                    this.updateLoopIcon();

                    let effectiveTime = timestamp || 0;
                    if (lastUpdate) {
                        const timeDiff = Math.floor((Date.now() - lastUpdate) / 1000);
                        effectiveTime = timestamp + timeDiff;
                        if (effectiveTime < 0) effectiveTime = 0;
                    }

                    this.isRemoteUpdate = true;
                    this.processNewSong(currentSong, status, effectiveTime);
                    setTimeout(() => { this.isRemoteUpdate = false; }, 2000);
                }
            }).catch((error) => {
                console.error("Check saved state error:", error);
            });
        },

        processNewSong: function(url, status, timestamp) {
            const vid = url;
            if (!vid) return;

            this.currentSongUrl = url;

            this.fetchVideoTitle(vid).then(title => {
                this.currentVideoTitle = title;
                document.getElementById('searchInput').value = title;
                document.getElementById('nowPlaying').textContent = 'Playing: ' + title;
            }).catch(() => {
                this.currentVideoTitle = "Unknown Title";
                document.getElementById('searchInput').value = url;
                document.getElementById('nowPlaying').textContent = 'Playing: Unknown Title';
            });

            document.getElementById('videoThumbnail').src = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;

            this.player.loadVideoById({ videoId: vid, startSeconds: timestamp || 0 });

            if (status === 'playing') {
                this.player.playVideo();
                this.isPlaying = true;
            } else {
                this.player.pauseVideo();
                this.isPlaying = false;
            }
            this.updatePlayPauseIcon();
        },

        fetchVideoTitle: function(videoId) {
            return fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`)
                .then(response => response.json())
                .then(data => data.title)
                .catch(() => "Unknown Title");
        },

        updateState: function(status, force = false) {
            if (this.hasUserLeft || this.isRemoteUpdate) return;
            if (!this.firebaseInitialized() || !this.currentSongUrl) return;

            const now = Date.now();
            if (!force && (now - this.lastAutoUpdate < 2000)) return;
            this.lastAutoUpdate = now;

            const currentTime = (this.player && typeof this.player.getCurrentTime === 'function') ? Math.floor(this.player.getCurrentTime()) : 0;

            const stateObj = {
                currentSong: this.currentSongUrl,
                status: status,
                timestamp: currentTime,
                lastUpdate: now,
                loop: this.isLooping
            };

            const stateRef = this.getFirebaseRef();
            set(stateRef, stateObj).catch((error) => {
                console.error("Update state error:", error);
            });
        },

        handleSearch: function() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';

            fetch(`https://youtube-7imq.onrender.com/search/videos?query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loadingIndicator').style.display = 'none';

                    if (data.ok && data.results && data.results.length > 0) {
                        this.displaySearchResults(data.results);
                    } else {
                        document.getElementById('errorMessage').textContent = "No results found.";
                        document.getElementById('errorMessage').style.display = 'block';
                    }
                })
                .catch(() => {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    document.getElementById('errorMessage').textContent = "Search failed.";
                    document.getElementById('errorMessage').style.display = 'block';
                });
        },

        displaySearchResults: function(results) {
            const searchResults = document.getElementById('searchResults');
            searchResults.innerHTML = '';

            results.forEach(result => {
                const item = document.createElement('div');
                item.className = 'search-result-item';

                const img = document.createElement('img');
                img.className = 'result-thumbnail';
                img.alt = 'Thumbnail';
                img.src = result.thumbnail || '/chat/logo.png';
                img.onerror = function() { this.src = '/chat/logo.png'; };

                const info = document.createElement('div');
                info.className = 'result-info';

                const title = document.createElement('div');
                title.className = 'result-title';
                title.textContent = result.title;

                const channel = document.createElement('div');
                channel.className = 'result-channel';
                channel.textContent = result.channel;

                info.appendChild(title);
                info.appendChild(channel);
                item.appendChild(img);
                item.appendChild(info);

                item.addEventListener('click', () => {
                    this.selectVideo(result);
                    searchResults.style.display = 'none';
                });

                searchResults.appendChild(item);
            });

            searchResults.style.display = 'block';
        },

        selectVideo: function(video) {
            this.currentSongUrl = video.videoId;
            document.getElementById('searchInput').value = video.title;
            document.getElementById('videoThumbnail').src = video.thumbnail || '/chat/logo.png';

            this.currentVideoTitle = video.title;
            document.getElementById('nowPlaying').textContent = 'Playing: ' + video.title;

            const vid = video.videoId;
            if (!vid) return;

            const now = Date.now();
            this.lastAutoUpdate = now;
            const stateRef = this.getFirebaseRef();
            set(stateRef, {
                currentSong: vid,
                status: 'playing',
                timestamp: 0,
                lastUpdate: now,
                loop: this.isLooping
            }).catch((error) => {
                console.error("Immediate song save error:", error);
            });

            this.isRemoteUpdate = false;
            this.player.loadVideoById({ videoId: vid, startSeconds: 0 });
            this.player.playVideo();
            this.isPlaying = true;
            this.updatePlayPauseIcon();
        },

        handlePlayPause: function() {
            if (!this.ytReady || !this.player) return;

            document.getElementById('errorMessage').style.display = 'none';

            if (!this.currentSongUrl) {
                document.getElementById('errorMessage').textContent = "Please search and select a video first.";
                document.getElementById('errorMessage').style.display = 'block';
                return;
            }

            this.isBackgroundPaused = false;

            if (!this.isPlaying) {
                this.player.playVideo();
            } else {
                this.player.pauseVideo();
            }
        },

        handleMute: function() {
            if (!this.player || !this.ytReady) return;
            if (this.player.isMuted()) {
                this.player.unMute();
                this.isMuted = false;
            } else {
                this.player.mute();
                this.isMuted = true;
            }
            this.updateMuteIcon();
        },

        handlePrev: function() {
            if (!this.player || !this.ytReady) return;
            const newTime = Math.max(0, this.player.getCurrentTime() - 10);
            this.player.seekTo(newTime, true);

            if (this.currentSongUrl && !this.hasUserLeft) {
                this.lastAutoUpdate = 0;
                this.updateState(this.isPlaying ? 'playing' : 'paused', true);
            }
        },

        handleNext: function() {
            if (!this.player || !this.ytReady) return;
            const currentTime = this.player.getCurrentTime();
            const duration = this.player.getDuration();
            const newTime = Math.min(duration, currentTime + 10);
            this.player.seekTo(newTime, true);

            if (this.currentSongUrl && !this.hasUserLeft) {
                this.lastAutoUpdate = 0;
                this.updateState(this.isPlaying ? 'playing' : 'paused', true);
            }
        },

        handleSeek: function() {
            if (!this.player || !this.ytReady) return;
            const sec = parseInt(document.getElementById('seekBar').value, 10);
            this.player.seekTo(sec, true);

            if (this.currentSongUrl && !this.hasUserLeft) {
                this.lastAutoUpdate = 0;
                this.updateState(this.isPlaying ? 'playing' : 'paused', true);
            }
        },

        handleLoop: function() {
            this.isLooping = !this.isLooping;
            this.updateLoopIcon();

            if (this.currentSongUrl && !this.hasUserLeft) {
                this.lastAutoUpdate = 0;
                this.updateState(this.isPlaying ? 'playing' : 'paused', true);
            }
        },

        updatePlayerUI: function() {
            if (!this.player || !this.ytReady || typeof this.player.getCurrentTime !== 'function' || this.isSeeking) return;

            const t = Math.floor(this.player.getCurrentTime() || 0);
            const d = Math.floor(this.player.getDuration() || 0);

            document.getElementById('curTime').textContent = formatTime(t);
            document.getElementById('duration').textContent = formatTime(d);

            const seekBar = document.getElementById('seekBar');
            if (!seekBar.matches(':active')) {
                seekBar.max = d;
                seekBar.value = t;
            }

            const progress = d > 0 ? (t / d) * 100 : 0;
            seekBar.style.background = `linear-gradient(to right, #ff5252 ${progress}%, ${TRACK_COLOR} ${progress}%)`;

            if (this.isPlaying && this.firebaseInitialized() && this.currentSongUrl && !this.hasUserLeft && !this.isRemoteUpdate) {
                const now = Date.now();
                if (!this.lastAutoUpdate || (now - this.lastAutoUpdate) > 5000) {
                    this.lastAutoUpdate = now;

                    const stateRef = this.getFirebaseRef();
                    update(stateRef, {
                        timestamp: t,
                        lastUpdate: now
                    }).catch((error) => {
                        console.error("Auto update error:", error);
                    });
                }
            }
        },

        firebaseInitialized: function() {
            return !!database && !!defaultApp;
        },

        destroy: function() {
            if (this.cleanupTimer) {
                clearInterval(this.cleanupTimer);
            }
            if (this.firebaseListener) {
                off(this.getFirebaseRef(), 'value', this.firebaseListener);
            }
        }
    };

    musicPlayer.init();

    setInterval(() => {
        if (musicPlayer.player && musicPlayer.ytReady && typeof musicPlayer.player.getCurrentTime === 'function') {
            musicPlayer.updatePlayerUI();
        }
    }, 1000);
</script>

<script>
    if (typeof YT === 'undefined') {
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }
</script>
