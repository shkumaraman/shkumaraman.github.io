<style>
:root {
  --dark-bg: #121212;
  --light-bg: #f5f5f5;
  --dark-text: #fff;
  --light-text: #333;
  --bg-word-dark: #252525;
  --bg-word-light: #d8d8d8;
}

.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--dark-bg);
  color: var(--dark-text);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  overflow: hidden; 
}

body.light-mode .loading-screen {
  background: var(--light-bg);
  color: var(--light-text);
}

.bg-article-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
  z-index: 1; 
  pointer-events: none;
}

.bg-word {
  margin: 2px 5px;
  color: var(--bg-word-dark);
  white-space: nowrap;
  font-weight: bold;
  transition: font-size 0.5s ease;
}

body.light-mode .bg-word {
  color: var(--bg-word-light);
}

.loader {
  text-align: center;
  position: relative; 
  z-index: 2;
}

.loader img {
  width: 100px;
  margin-bottom: 20px;
  border-radius: 12px;
}

.loader p {
  font-size: 16px;
  letter-spacing: 1px;
  opacity: 0.8;
}
</style>

<div class="loading-screen" id="globalLoader">
  <div class="bg-article-container" id="bgTextContainer"></div>

  <div class="loader">
    <img src="/chat/logo.png" alt="Logo">
    <p id="loadingText">Please Wait</p>
  </div>
</div>

<script>
(function () {
  const loader = document.getElementById("globalLoader");
  const text = document.getElementById("loadingText");
  let dots = 0;

  setInterval(() => {
    dots = (dots + 1) % 4;
    if (text) {
      text.textContent = "Please Wait" + ".".repeat(dots);
    }
  }, 500);

  const bgContainer = document.getElementById("bgTextContainer");
  const wordsArray = [];
  const wordCount = 1000; 

  const talkRushLangs = [
    "TalkRush", 
    "टॉकरश", 
    "টকরাশ", 
    "டாக்ரஷ்", 
    "ਟਾਕਰਸ਼", 
    "ટૉકરશ", 
    "トークラッシュ", 
    "托克拉什", 
    "ТокРаш", 
    "ΤοκΡας", 
    "توك راش", 
    "토크러시", 
    "ทอล์ครัช",
    "ٹاک رش"
  ];

  for (let i = 0; i < wordCount; i++) {
    let span = document.createElement("span");
    
    let randomLang = talkRushLangs[Math.floor(Math.random() * talkRushLangs.length)];
    span.textContent = randomLang;
    
    span.classList.add("bg-word");
    
    let size = Math.floor(Math.random() * 11) + 10; 
    span.style.fontSize = size + "px";
    
    bgContainer.appendChild(span);
    wordsArray.push(span);
  }

  setInterval(() => {
    for (let i = 0; i < 60; i++) { 
      let randomIndex = Math.floor(Math.random() * wordsArray.length);
      let newSize = Math.floor(Math.random() * 11) + 10; 
      
      wordsArray[randomIndex].style.fontSize = newSize + "px";
    }
  }, 400);

  window.hideLoader = function () {
    if (loader) loader.style.display = "none";
  };

  window.addEventListener("load", () => {
    window.hideLoader();
  });
})();
</script>
