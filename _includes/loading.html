<style>
:root {
  --dark-bg: #121212;
  --light-bg: #f5f5f5;
  --dark-text: #fff;
  --light-text: #333;
  --bg-word-dark: #333333;
  --bg-word-light: #cccccc;
}

.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--dark-bg);
  color: var(--dark-text);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  overflow: hidden; 
}

body.light-mode .loading-screen {
  background: var(--light-bg);
  color: var(--light-text);
}

.bg-article-container {
  position: absolute;
  inset: 0;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
  z-index: 1; 
  pointer-events: none;
}

.bg-word {
  margin: 4px 6px;
  color: var(--bg-word-dark);
  white-space: nowrap;
  font-weight: bold;
  font-size: 14px;
  display: inline-block;
  will-change: transform, opacity;
  transition: transform 0.4s ease, opacity 0.4s ease;
}

body.light-mode .bg-word {
  color: var(--bg-word-light);
}

.loader {
  text-align: center;
  position: relative; 
  z-index: 2;
}

.loader img {
  width: 100px;
  height: 100px;
  aspect-ratio: 1 / 1;
  margin-bottom: 20px;
  border-radius: 12px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.loader p {
  font-size: 16px;
  letter-spacing: 1px;
  opacity: 0.8;
  min-width: 120px;
  display: inline-block;
}
</style>

<div class="loading-screen" id="globalLoader">
  <div class="bg-article-container" id="bgTextContainer"></div>

  <div class="loader">
    <img src="/chat/logo.png" alt="Logo" width="100" height="100">
    <p id="loadingText">Please Wait</p>
  </div>
</div>

<script>
(function () {
  const loader = document.getElementById("globalLoader");
  const text = document.getElementById("loadingText");
  let dots = 0;

  setInterval(() => {
    dots = (dots + 1) % 4;
    if (text) {
      text.textContent = "Please Wait" + ".".repeat(dots);
    }
  }, 500);

  const bgContainer = document.getElementById("bgTextContainer");
  const wordsArray = [];
  const wordCount = 400;

  const talkRushLangs = [
    "TalkRush", "टॉकरश", "টকরাশ", "டாக்ரஷ்", "టాక్‌రష్", 
    "ಟಾಕ್ರಶ್", "ടാക്രഷ്", "ଟକରସ୍", "টক্ ৰাছ", "ꯇꯣꯛꯔꯁ", 
    "ਟਾਕਰਸ਼", "ટૉકરશ", "トークラッシュ", "托克拉什", "ТокРаш", 
    "ΤοκΡας", "توك راش", "토크러시", "ทอล์ครัช", "ٹاک رش"
  ];

  const fragment = document.createDocumentFragment();

  for (let i = 0; i < wordCount; i++) {
    let span = document.createElement("span");
    span.textContent = talkRushLangs[Math.floor(Math.random() * talkRushLangs.length)];
    span.classList.add("bg-word");
    
    let scale = (Math.random() * 0.6 + 0.7).toFixed(2);
    span.style.transform = `scale(${scale})`;
    span.style.opacity = (Math.random() * 0.5 + 0.3).toFixed(2);
    
    fragment.appendChild(span);
    wordsArray.push(span);
  }
  bgContainer.appendChild(fragment);

  setInterval(() => {
    for (let i = 0; i < 30; i++) { 
      let randomIndex = Math.floor(Math.random() * wordsArray.length);
      let newScale = (Math.random() * 0.6 + 0.7).toFixed(2);
      let newOpacity = (Math.random() * 0.5 + 0.3).toFixed(2);
      
      wordsArray[randomIndex].style.transform = `scale(${newScale})`;
      wordsArray[randomIndex].style.opacity = newOpacity;
    }
  }, 400);

  window.hideLoader = function () {
    if (loader) loader.style.display = "none";
  };

  window.addEventListener("load", () => {
    window.hideLoader();
  });
})();
</script>
