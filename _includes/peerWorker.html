<script type="module">
  import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onDisconnect, get, remove } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
  const db = getDatabase(app);
  window.firebaseDB = db;

  document.addEventListener("DOMContentLoaded", function () {
    let currentNickname = localStorage.getItem("talkrush_nickname");
    if (!currentNickname) return;

    const registerPresence = (nickname) => {
      const getPeerId = () => {
        return new Promise((resolve) => {
          if (window.myCallPeer && window.myCallPeer.id) {
            resolve(window.myCallPeer.id);
          } else if (window.myCallPeer) {
            window.myCallPeer.on('open', (id) => resolve(id));
            setTimeout(() => resolve(null), 3000);
          } else {
            resolve(null);
          }
        });
      };

      getPeerId().then(peerId => {
        const myPeerId = peerId || ("user_" + nickname.replace(/[^a-zA-Z0-9]/g, '_'));
        const myOnlineRef = ref(db, `users/${nickname}`);

        set(myOnlineRef, {
          nickname: nickname,
          peerId: myPeerId,
          timestamp: Date.now()
        });

        onDisconnect(myOnlineRef).remove();
      });
    };

    registerPresence(currentNickname);

    window.addEventListener('nicknameUpdated', async (e) => {
      const newNickname = e.detail.nickname;
      if (!newNickname || newNickname === currentNickname) return;

      if (currentNickname) {
        try {
          await remove(ref(db, `users/${currentNickname}`));
        } catch (err) {}
      }

      currentNickname = newNickname;
      registerPresence(currentNickname);
    });

    window.spinDiceAndConnect = async (callType = 'video') => {
      const usersRef = ref(db, 'users');
      
      try {
        const snapshot = await get(usersRef);
        if (!snapshot.exists()) {
           alert("Currently, no one is online!");
           return;
        }

        const usersData = snapshot.val();
        const availableUsers = Object.values(usersData).filter(user => user.nickname !== currentNickname);

        if (availableUsers.length === 0) {
           alert("No one else is online at the moment!");
           return;
        }

        const randomIndex = Math.floor(Math.random() * availableUsers.length);
        const randomTarget = availableUsers[randomIndex];

        if (typeof window.startOutgoingCall === 'function') {
           window.startOutgoingCall(randomTarget.nickname, callType);
        } else {
           alert("Calling system is not loaded!");
        }

      } catch (error) {
        alert("An error occurred, please try again!");
      }
    };
  });
</script>
