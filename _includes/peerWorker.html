<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onDisconnect, remove, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://talkrush3-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const apps = getApps();
  const targetAppName = "TalkRushFriendApp";
  const app = apps.find(a => a.name === targetAppName) || initializeApp(firebaseConfig, targetAppName);
  const db = getDatabase(app);
  window.firebaseDB = db;

  let currentNickname = localStorage.getItem("talkrush_nickname");
  let myOnlineRef = null;
  let isInternalNavigation = false;

  const sanitizeKey = (name) => name ? name.replace(/[.#$\[\]]/g, '_') : null;

  const registerPresence = (nickname) => {
    if (!nickname) return;

    const safeKey = sanitizeKey(nickname);
    if (!safeKey) return;

    myOnlineRef = ref(db, `users/${safeKey}`);

    onDisconnect(myOnlineRef).remove();

    set(myOnlineRef, {
      nickname: nickname,
      timestamp: Date.now()
    }).catch(() => {});
  };

  const connectedRef = ref(db, ".info/connected");
  onValue(connectedRef, (snap) => {
    if (snap.val() === true) {
      currentNickname = localStorage.getItem("talkrush_nickname");
      if (currentNickname) {
        registerPresence(currentNickname);
      }
    }
  });

  window.addEventListener('nicknameUpdated', async (e) => {
    const newNickname = e.detail?.nickname;
    if (!newNickname || newNickname === currentNickname) return;

    if (currentNickname) {
      const oldSafeKey = sanitizeKey(currentNickname);
      try {
        if (myOnlineRef) onDisconnect(myOnlineRef).cancel();
        await remove(ref(db, `users/${oldSafeKey}`));
      } catch (err) {}
    }

    currentNickname = newNickname;
    registerPresence(currentNickname);
  });

  document.addEventListener('click', (e) => {
    const link = e.target.closest('a');
    if (link && link.href && link.origin === window.location.origin && !link.target && !link.hasAttribute('download')) {
      isInternalNavigation = true;
    }
  }, true);

  document.addEventListener('submit', () => {
    isInternalNavigation = true;
  }, true);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
      isInternalNavigation = true;
    }
  });

  window.addEventListener('beforeunload', () => {
    if (isInternalNavigation && myOnlineRef) {
      onDisconnect(myOnlineRef).cancel();
    }
  });
</script>
