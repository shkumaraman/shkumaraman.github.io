<script type="module">
  import { initializeApp, getApps } from "firebase/app";
  import { 
    getDatabase, 
    ref, 
    set, 
    update, 
    onDisconnect, 
    onValue, 
    serverTimestamp, 
    remove,
    query,
    orderByChild,
    endAt,
    get
  } from "firebase/database";

  const firebaseConfigUsers = {
    databaseURL: "https://talkrush4-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const apps = getApps();
  const targetAppUsers = "TalkRushUsersApp";
  const appUsers = apps.find(a => a.name === targetAppUsers) || initializeApp(firebaseConfigUsers, targetAppUsers);
  const dbUsers = getDatabase(appUsers);
  
  window.firebaseDBUsers = dbUsers;

  let currentNickname = localStorage.getItem("talkrush_nickname");
  let unsubscribeConnected = null;
  let userCountry = "";
  let currentOnDisconnectRef = null; 

  const sanitizeKey = (name) => name ? name.replace(/[.#$\[\]\/]/g, '_') : null;

  const fetchLocation = async () => {
    try {
      const res = await fetch('https://ipapi.co/json/');
      const data = await res.json();
      if (data && data.country_name && data.country_code) {
        const flag = data.country_code.toUpperCase().replace(/./g, char => 
          String.fromCodePoint(char.charCodeAt(0) + 127397)
        );
        userCountry = `${flag} ${data.country_name}`;
      }
    } catch (_) {}
  };

  const bindPresence = async (nickname) => {
    if (!nickname) return;
    const safeKey = sanitizeKey(nickname);
    if (!safeKey) return;

    const currentGender = localStorage.getItem("talkrush_user_gender") || "";

    if (!userCountry) {
      await fetchLocation();
    }

    const userRef = ref(dbUsers, `users/${safeKey}`);
    const connectedRef = ref(dbUsers, ".info/connected");

    if (unsubscribeConnected) {
      unsubscribeConnected();
    }

    unsubscribeConnected = onValue(connectedRef, async (snap) => {
      if (snap.val() === true) {
        await set(userRef, {
          nickname: nickname,
          gender: currentGender,
          country: userCountry,
          timestamp: serverTimestamp()
        });
        
        currentOnDisconnectRef = onDisconnect(userRef);
        await currentOnDisconnectRef.update({
          timestamp: serverTimestamp()
        });
      }
    });
  };

  if (currentNickname) {
    bindPresence(currentNickname);
  }

  window.addEventListener('nicknameUpdated', async (e) => {
    const newNickname = e.detail?.nickname;
    if (!newNickname) return;

    if (currentNickname && newNickname !== currentNickname) {
      const oldSafeKey = sanitizeKey(currentNickname);
      try {
        if (currentOnDisconnectRef) {
          await currentOnDisconnectRef.cancel();
        }
        await remove(ref(dbUsers, `users/${oldSafeKey}`));
      } catch (_) {}
    }

    currentNickname = newNickname;
    bindPresence(currentNickname);
  });

  setInterval(async () => {
    try {
      const threeHoursAgo = Date.now() - (3 * 60 * 60 * 1000);
      const oldUsersQuery = query(
        ref(dbUsers, 'users'), 
        orderByChild('timestamp'), 
        endAt(threeHoursAgo)
      );
      
      const snapshot = await get(oldUsersQuery);
      if (snapshot.exists()) {
        snapshot.forEach((childSnap) => {
          remove(ref(dbUsers, `users/${childSnap.key}`)).catch(() => {});
        });
      }
    } catch (_) {}
  }, 5 * 60 * 1000);
</script>
