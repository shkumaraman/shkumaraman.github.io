<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { 
    getDatabase, 
    ref, 
    set, 
    update,
    onDisconnect, 
    onValue, 
    serverTimestamp,
    remove 
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://talkrush3-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const apps = getApps();
  const targetAppName = "TalkRushFriendApp";
  const app = apps.find(a => a.name === targetAppName) || initializeApp(firebaseConfig, targetAppName);
  const db = getDatabase(app);
  window.firebaseDB = db;

  let currentNickname = localStorage.getItem("talkrush_nickname");
  let unsubscribeConnected = null;

  const sanitizeKey = (name) => name ? name.replace(/[.#$\[\]\/]/g, '_') : null;

  const bindPresence = (nickname) => {
    if (!nickname) return;
    const safeKey = sanitizeKey(nickname);
    if (!safeKey) return;

    const userRef = ref(db, `users/${safeKey}`);
    const connectedRef = ref(db, ".info/connected");

    if (unsubscribeConnected) {
      unsubscribeConnected();
    }

    unsubscribeConnected = onValue(connectedRef, async (snap) => {
      if (snap.val() === true) {
        await set(userRef, {
          nickname: nickname,
          timestamp: serverTimestamp()
        });
        await onDisconnect(userRef).update({
          timestamp: serverTimestamp()
        });
      }
    });
  };

  if (currentNickname) {
    bindPresence(currentNickname);
  }

  window.addEventListener('nicknameUpdated', async (e) => {
    const newNickname = e.detail?.nickname;
    if (!newNickname || newNickname === currentNickname) return;

    if (currentNickname) {
      const oldSafeKey = sanitizeKey(currentNickname);
      try {
        await remove(ref(db, `users/${oldSafeKey}`));
      } catch (_) {}
    }

    currentNickname = newNickname;
    localStorage.setItem("talkrush_nickname", newNickname);
    bindPresence(currentNickname);
  });
</script>
