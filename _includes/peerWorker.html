<script type="module">
  import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, set, onDisconnect, get, remove, onValue } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://talkrush3-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  let app;
  const apps = getApps();
  const targetAppName = "TalkRushFriendApp";
  const existingApp = apps.find(a => a.name === targetAppName);

  if (existingApp) {
    app = existingApp;
  } else {
    app = initializeApp(firebaseConfig, targetAppName);
  }

  const db = getDatabase(app);
  window.firebaseDB = db;

  document.addEventListener("DOMContentLoaded", function () {
    let currentNickname = localStorage.getItem("talkrush_nickname");
    let myOnlineRef = null;

    const sanitizeKey = (name) => name ? name.replace(/[.#$\[\]]/g, '_') : 'Guest';

    const registerPresence = (nickname) => {
      if (!nickname) return;
      
      const safeKey = sanitizeKey(nickname);
      myOnlineRef = ref(db, `users/${safeKey}`);

      onDisconnect(myOnlineRef).remove().then(() => {
        set(myOnlineRef, {
          nickname: nickname,
          timestamp: Date.now()
        });
      });
    };

    const connectedRef = ref(db, ".info/connected");
    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        currentNickname = localStorage.getItem("talkrush_nickname");
        if (currentNickname) {
          registerPresence(currentNickname);
        }
      }
    });

    window.addEventListener('nicknameUpdated', async (e) => {
      const newNickname = e.detail.nickname;
      if (!newNickname || newNickname === currentNickname) return;

      if (currentNickname) {
        const oldSafeKey = sanitizeKey(currentNickname);
        try {
          if (myOnlineRef) onDisconnect(myOnlineRef).cancel();
          await remove(ref(db, `users/${oldSafeKey}`));
        } catch (err) {}
      }

      currentNickname = newNickname;
      registerPresence(currentNickname);
    });

    window.spinDiceAndConnect = async (callType = 'video') => {
      const usersRef = ref(db, 'users');
      
      try {
        const snapshot = await get(usersRef);
        if (!snapshot.exists()) {
           alert("Currently, no one is online!");
           return;
        }

        const usersData = snapshot.val();
        const availableUsers = Object.values(usersData).filter(user => user.nickname !== currentNickname);

        if (availableUsers.length === 0) {
           alert("No one else is online at the moment!");
           return;
        }

        const randomIndex = Math.floor(Math.random() * availableUsers.length);
        const randomTarget = availableUsers[randomIndex];

        if (typeof window.startOutgoingCall === 'function') {
           window.startOutgoingCall(randomTarget.nickname, callType);
        } else {
           alert("Calling system is not loaded!");
        }

      } catch (error) {
        alert("An error occurred, please try again!");
      }
    };
  });
</script>
