<style>
#bottomNav {
  display: none;
}
@media (max-width: 768px) {
  #bottomNav {
    display: flex;
    align-items: flex-end;
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #111114;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    z-index: 999;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .light-mode #bottomNav {
    background: #ffffff;
    border-top: 0.5px solid rgba(0,0,0,0.1);
  }
}
.bn-item {
  flex: 1;
  height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  text-decoration: none;
  color: rgba(255,255,255,0.5);
  font-size: 10px;
  transition: color 0.15s;
  position: relative;
}
.bn-icon-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bn-item svg {
  width: 17px;
  height: 17px;
  color: rgba(255,255,255,0.4);
  transition: color 0.15s, transform 0.15s;
}
.bn-badge {
  position: absolute;
  top: -6px;
  right: -10px;
  background: #ff4757;
  color: #ffffff;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 4px;
  min-width: 15px;
  height: 15px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  pointer-events: none;
}
.light-mode .bn-item {
  color: rgba(0,0,0,0.45);
}
.light-mode .bn-item svg {
  color: rgba(0,0,0,0.35);
}
.bn-item.active,
.bn-item:active {
  color: #ff6b4a;
}
.bn-item.active svg,
.bn-item:active svg {
  color: #ff6b4a;
  transform: translateY(-1px);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  var currentPath = window.location.pathname;
  document.querySelectorAll('#bottomNav .bn-item').forEach(function (link) {
    if (link.getAttribute('href') === currentPath) {
      link.classList.add('active');
    }
  });
});
</script>

<script type="module">
  import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
  import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

  if (!window.talkrushBottomNavListenerAdded) {
    window.talkrushBottomNavListenerAdded = true;

    const firebaseConfig = {
      databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
    const db = getDatabase(app);

    const myNickname = localStorage.getItem("talkrush_nickname");

    if (myNickname) {
      const params = new URLSearchParams(window.location.search);
      const currentGroup = params.get('group');
      const currentChatId = window.location.pathname.includes('inbox.html') ? params.get('chatId') : null;

      onValue(ref(db, "friends"), (snap) => {
        const data = snap.val();
        const badge = document.getElementById("bottomNavInboxBadge");
        
        if (!badge) return;

        if (!data) {
          badge.style.display = "none";
          return;
        }

        let unreadCount = 0;
        let lastSeenMap = JSON.parse(localStorage.getItem('inbox_last_seen') || '{}');
        if (currentChatId) lastSeenMap[currentChatId] = Date.now();

        Object.entries(data).forEach(([chatId, friend]) => {
          if (friend.nickname1 === myNickname || friend.nickname2 === myNickname) {
            let chatLastSeen = lastSeenMap[chatId] || 0;
            let lastTimestamp = friend.lastTimestamp || 0;

            if (friend.lastSender && friend.lastSender !== myNickname && lastTimestamp > chatLastSeen && chatId !== currentChatId) {
              unreadCount++;
            }
          }
        });

        if (unreadCount > 0) {
          badge.textContent = unreadCount > 99 ? '99+' : unreadCount;
          badge.style.display = "flex";
        } else {
          badge.style.display = "none";
        }
      });

      onValue(ref(db, "groups"), (snap) => {
        const data = snap.val();
        const badge = document.getElementById("bottomNavBadge");
        
        if (!badge) return;

        if (!data) {
          badge.style.display = "none";
          return;
        }

        let count = 0;
        let lastSeenMap = JSON.parse(localStorage.getItem('groups_last_seen') || '{}');
        if (currentGroup) lastSeenMap[currentGroup] = Date.now();

        Object.entries(data).forEach(([groupName, groupData]) => {
          let groupUnreadCount = 0;
          let groupLastSeen = lastSeenMap[groupName] || 0;

          if (groupData.messages) {
            Object.values(groupData.messages).forEach(m => {
              if (m.replyTo?.nickname === myNickname && m.timestamp > groupLastSeen) {
                groupUnreadCount++;
              }
            });
          }
          if (groupName !== currentGroup) {
            count += groupUnreadCount;
          }
        });

        if (count > 0) {
          badge.textContent = count > 99 ? '99+' : count;
          badge.style.display = "flex";
        } else {
          badge.style.display = "none";
        }
      });
    }
  }
</script>
