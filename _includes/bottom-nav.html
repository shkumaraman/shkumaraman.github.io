  }

  }
}

.bn-item {

  height: 60px;
  display: flex;
  flex-direction: column;

  justify-content: center;

.light-mode .bn-item {

}

}

.bn-item.active,

.bn-item.active i,

.bn-center {

<script>

      link.classList.add('active');
    }
  });
});
</script>
