<script type="speculationrules">
{
  "prerender": [
    {
      "source": "list",
      "urls": [
        "/chat/inbox.html",
        "/chat/users.html",
        "/chat/rooms.html",
        "/chat/index.html",
        "/post.html"
      ]
    }
  ]

</script>

<script>
(function () {
  const nav = document.getElementById('bottomNav');
  if (!nav) return;

  const currentPath = window.location.pathname;
  const items = nav.querySelectorAll('.bn-item');

  items.forEach(link => {
    const href = link.getAttribute('href');
    if (href === currentPath || (currentPath === '/' && href === '/chat/index.html')) {
      link.classList.add('active');
    }

    link.addEventListener('pointerdown', function () {
      items.forEach(el => el.classList.remove('active'));
      link.classList.add('active');
    }, { passive: true });

    link.addEventListener('touchstart', function () {
      if (!HTMLScriptElement.supports || !HTMLScriptElement.supports('speculationrules')) {
        const prefetch = document.createElement('link');
        prefetch.rel = 'prefetch';
        prefetch.href = href;
        document.head.appendChild(prefetch);
      }
    }, { once: true, passive: true });
  });

  function setBadge(id, count) {
    const badge = document.getElementById(id);
    if (badge) {
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count;
        badge.style.display = "flex";
      } else {
        badge.style.display = "none";
      }
    }
  }

  if (window._lastInboxBadgeCount !== undefined) {
    setBadge("bottomNavInboxBadge", window._lastInboxBadgeCount);
  }
  if (window._lastRoomBadgeCount !== undefined) {
    setBadge("bottomNavBadge", window._lastRoomBadgeCount);
  }

  window.addEventListener('updateInboxBadge', function(e) {
    setBadge("bottomNavInboxBadge", e.detail);
  });

  window.addEventListener('updateRoomBadge', function(e) {
    setBadge("bottomNavBadge", e.detail);
  });
})();
</script>
