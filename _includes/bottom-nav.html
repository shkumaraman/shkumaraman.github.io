<style>

  #bottomNav {
    display: flex;
    align-items: flex-end;
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #111114;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    z-index: 999;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .light-mode #bottomNav {
    background: #ffffff;
    border-top: 0.5px solid rgba(0,0,0,0.1);
  }
}

  flex: 1;
  height: 60px;
  display: flex;
  flex-direction: column;

  justify-content: center;
  gap: 3px;

  color: rgba(255,255,255,0.5);
  font-size: 10px;

  position: relative;

  top: -6px;

  padding: 1px 4px;

  color: rgba(0,0,0,0.45);

  color: rgba(0,0,0,0.35);
}

}

.bn-item.active i,
.bn-item:active i {
  color: #ff6b4a;
  transform: translateY(-1px);

<script>
document.addEventListener('DOMContentLoaded', function () {
  var currentPath = window.location.pathname;
  document.querySelectorAll('#bottomNav .bn-item').forEach(function (link) {
    if (link.getAttribute('href') === currentPath) {
      link.classList.add('active');
    }
  });
});
</script>

<script type="module">
import { initializeApp, getApps, getApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

const firebaseConfig = {
  databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app/"
};

const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApp();
const db = getDatabase(app);

function updateBottomNavBadge(count) {
  const badge = document.getElementById('bottomNavBadge');
  if (badge) {
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : count;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }
}

function listenToUnreadRepliesForNav() {
  const myNickname = localStorage.getItem('talkrush_nickname') || 'Guest';
  const currentGroup = new URLSearchParams(window.location.search).get('group');

  onValue(ref(db, 'groups'), (snapshot) => {
    if (!snapshot.exists()) {
      updateBottomNavBadge(0);
      return;
    }

    const data = snapshot.val();
    let lastSeenMap = JSON.parse(localStorage.getItem('groups_last_seen') || '{}');
    if (currentGroup) lastSeenMap[currentGroup] = Date.now();
    let totalUnreadReplies = 0;

    Object.entries(data).forEach(([groupName, groupData]) => {
      let groupUnreadCount = 0;
      let groupLastSeen = lastSeenMap[groupName] || 0;

      if (groupData.messages) {
        Object.values(groupData.messages).forEach(m => {
          if (m.replyTo?.nickname === myNickname && m.timestamp > groupLastSeen) {
            groupUnreadCount++;
          }
        });
      }

      if (groupName !== currentGroup) {
        totalUnreadReplies += groupUnreadCount;
      }
    });

    updateBottomNavBadge(totalUnreadReplies);
  });
}

listenToUnreadRepliesForNav();
</script>
