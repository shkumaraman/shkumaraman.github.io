<script>
document.addEventListener('DOMContentLoaded', function () {
  const currentPath = window.location.pathname.replace(/\/index\.html$/, '/');

  document.querySelectorAll('#bottomNav .bn-item').forEach(function (link) {
    try {
      const linkUrl = new URL(link.getAttribute('href'), window.location.origin);
      const linkPath = linkUrl.pathname.replace(/\/index\.html$/, '/');
      if (linkPath === currentPath) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    } catch (e) {
      if (link.getAttribute('href') === window.location.pathname) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    }
  });

  function setBadge(id, count) {
    const badge = document.getElementById(id);
    if (!badge) return;
    const num = Number(count);
    if (num > 0) {
      badge.textContent = num > 99 ? '99+' : num;
      badge.style.display = 'flex';
    } else {
      badge.style.display = 'none';
    }
  }

  if (window._lastInboxBadgeCount !== undefined) {
    setBadge('bottomNavInboxBadge', window._lastInboxBadgeCount);
  }
  if (window._lastRoomBadgeCount !== undefined) {
    setBadge('bottomNavBadge', window._lastRoomBadgeCount);
  }

  window.addEventListener('updateInboxBadge', function (e) {
    setBadge('bottomNavInboxBadge', e.detail);
  });

  window.addEventListener('updateRoomBadge', function (e) {
    setBadge('bottomNavBadge', e.detail);
  });
});
</script>
