<style>
  .custom-image-viewer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 12, 0.92);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .custom-image-viewer-overlay.show {
    opacity: 1;
    display: flex;
  }

  .custom-image-viewer-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .custom-image-viewer-img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    object-fit: contain;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform-origin: center center;
    will-change: transform;
    pointer-events: auto;
  }

  .custom-image-viewer-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 10000000;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .custom-image-viewer-close-btn:hover {
    background: rgba(255, 59, 48, 0.2);
    border-color: rgba(255, 59, 48, 0.4);
    color: #ff3b30;
    transform: scale(1.1) rotate(90deg);
  }

  .custom-image-viewer-close-btn:active {
    transform: scale(0.9);
  }
</style>

<div id="customImageViewerOverlay" class="custom-image-viewer-overlay">
  <button class="custom-image-viewer-close-btn" title="Close" onclick="closeCustomImageViewer()">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <div class="custom-image-viewer-content" id="customImageViewerContent">
    <img id="customImageViewerImg" class="custom-image-viewer-img" src="" alt="Viewed Image">
  </div>
</div>

<script>
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let initialDistance = 0;
  let initialScale = 1;
  let lastTapTime = 0;
  let hasMoved = false;

  const overlay = document.getElementById('customImageViewerOverlay');
  const img = document.getElementById('customImageViewerImg');
  const content = document.getElementById('customImageViewerContent');

  function updateTransform(smooth = false) {
    if (!img) return;
    img.style.transition = smooth ? 'transform 0.25s cubic-bezier(0.2, 0, 0.2, 1)' : 'none';
    img.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
    img.style.cursor = scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
  }

  function resetZoom() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    isDragging = false;
    hasMoved = false;
    updateTransform(false);
  }

  function openCustomImageViewer(src) {
    if (!overlay || !img) return;
    resetZoom();
    img.src = src;
    overlay.style.display = 'flex';
    overlay.offsetHeight;
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeCustomImageViewer() {
    if (!overlay) return;
    overlay.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (!overlay.classList.contains('show')) {
        overlay.style.display = 'none';
        resetZoom();
        if (img) img.src = '';
      }
    }, 300);
  }

  function handleWheel(e) {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.25 : 0.8;
    let targetScale = scale * zoomFactor;

    if (targetScale < 1) targetScale = 1;
    if (targetScale > 5) targetScale = 5;

    if (targetScale === 1) {
      translateX = 0;
      translateY = 0;
    } else {
      const rect = img.getBoundingClientRect();
      const mouseX = e.clientX - (rect.left + rect.width / 2);
      const mouseY = e.clientY - (rect.top + rect.height / 2);
      translateX -= mouseX * (zoomFactor - 1);
      translateY -= mouseY * (zoomFactor - 1);
    }

    scale = targetScale;
    updateTransform(true);
  }

  function handleMouseDown(e) {
    if (e.button !== 0) return;
    if (scale > 1) {
      isDragging = true;
      hasMoved = false;
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
      img.style.cursor = 'grabbing';
      e.preventDefault();
    }
  }

  function handleMouseMove(e) {
    if (!isDragging) return;
    hasMoved = true;
    translateX = e.clientX - startX;
    translateY = e.clientY - startY;
    updateTransform(false);
  }

  function handleMouseUp() {
    if (isDragging) {
      isDragging = false;
      if (img) img.style.cursor = scale > 1 ? 'grab' : 'default';
    }
  }

  function getDistance(touches) {
    return Math.hypot(
      touches[0].clientX - touches[1].clientX,
      touches[0].clientY - touches[1].clientY
    );
  }

  function handleTouchStart(e) {
    if (e.touches.length === 2) {
      isDragging = false;
      initialDistance = getDistance(e.touches);
      initialScale = scale;
    } else if (e.touches.length === 1) {
      const currentTime = Date.now();
      const tapGap = currentTime - lastTapTime;

      if (tapGap < 300 && tapGap > 0) {
        e.preventDefault();
        if (scale > 1) {
          resetZoom();
          updateTransform(true);
        } else {
          scale = 2.5;
          const touch = e.touches[0];
          translateX = (window.innerWidth / 2 - touch.clientX) * 0.8;
          translateY = (window.innerHeight / 2 - touch.clientY) * 0.8;
          updateTransform(true);
        }
        lastTapTime = 0;
        return;
      }
      lastTapTime = currentTime;

      if (scale > 1) {
        isDragging = true;
        hasMoved = false;
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;
      }
    }
  }

  function handleTouchMove(e) {
    if (e.touches.length === 2) {
      e.preventDefault();
      const currentDistance = getDistance(e.touches);
      if (initialDistance > 0) {
        let targetScale = initialScale * (currentDistance / initialDistance);
        if (targetScale < 1) targetScale = 1;
        if (targetScale > 5) targetScale = 5;
        scale = targetScale;
        if (scale === 1) {
          translateX = 0;
          translateY = 0;
        }
        updateTransform(false);
      }
    } else if (e.touches.length === 1 && isDragging && scale > 1) {
      e.preventDefault();
      hasMoved = true;
      translateX = e.touches[0].clientX - startX;
      translateY = e.touches[0].clientY - startY;
      updateTransform(false);
    }
  }

  function handleTouchEnd(e) {
    if (e.touches.length < 2) {
      initialDistance = 0;
    }
    if (e.touches.length === 0) {
      isDragging = false;
      if (scale <= 1) {
        resetZoom();
      }
    }
  }

  if (overlay) {
    overlay.addEventListener('wheel', handleWheel, { passive: false });
    overlay.addEventListener('mousedown', handleMouseDown);
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);

    overlay.addEventListener('touchstart', handleTouchStart, { passive: false });
    overlay.addEventListener('touchmove', handleTouchMove, { passive: false });
    window.addEventListener('touchend', handleTouchEnd);

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target === content) {
        if (!hasMoved) {
          closeCustomImageViewer();
        }
      }
    });
  }

  if (img) {
    img.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      if (scale > 1) {
        resetZoom();
        updateTransform(true);
      } else {
        scale = 2.5;
        const rect = img.getBoundingClientRect();
        translateX = (window.innerWidth / 2 - e.clientX);
        translateY = (window.innerHeight / 2 - e.clientY);
        updateTransform(true);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        const shouldExclude = e.target.closest('.logo, .friend-avatar, .chat-avatar, .header-toggle, .menu-btn, .adsbygoogle, .animated-emoji-img, .verify-badge');
        if (!shouldExclude) {
          openCustomImageViewer(e.target.src);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (overlay && (overlay.style.display === 'flex' || overlay.classList.contains('show'))) {
          closeCustomImageViewer();
        }
      }
    });
  });
</script>
