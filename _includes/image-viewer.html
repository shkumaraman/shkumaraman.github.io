<style>
  .custom-image-viewer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 12, 0.95);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }

  .custom-image-viewer-overlay.show {
    opacity: 1;
    display: flex;
  }

  .custom-image-viewer-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .custom-image-viewer-img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    object-fit: contain;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform-origin: center center;
    will-change: transform;
    pointer-events: auto;
  }

  .custom-image-viewer-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 10000002;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .custom-image-viewer-close-btn:hover {
    background: rgba(255, 59, 48, 0.25);
    border-color: rgba(255, 59, 48, 0.4);
    color: #ff3b30;
    transform: scale(1.08) rotate(90deg);
  }

  .custom-image-viewer-close-btn:active {
    transform: scale(0.92);
  }
</style>

<div id="customImageViewerOverlay" class="custom-image-viewer-overlay">
  <button class="custom-image-viewer-close-btn" id="customImageViewerCloseBtn" title="Close">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <div class="custom-image-viewer-content" id="customImageViewerContent">
    <img id="customImageViewerImg" class="custom-image-viewer-img" src="" alt="Viewed Image" draggable="false">
  </div>
</div>

<script>
  (function() {
    const overlay = document.getElementById('customImageViewerOverlay');
    const content = document.getElementById('customImageViewerContent');
    const img = document.getElementById('customImageViewerImg');
    const closeBtn = document.getElementById('customImageViewerCloseBtn');

    let scale = 1;
    let minScale = 1;
    let maxScale = 5;
    let posX = 0;
    let posY = 0;

    let isDragging = false;
    let startX = 0;
    let startY = 0;

    let initialDistance = 0;
    let initialScale = 1;
    let lastTapTime = 0;

    function applyTransform(animate = false) {
      if (animate) {
        img.style.transition = 'transform 0.25s cubic-bezier(0.2, 0, 0.2, 1)';
      } else {
        img.style.transition = 'none';
      }
      img.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`;
      img.style.cursor = scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
    }

    function setZoom(newScale, focalX = 0, focalY = 0, animate = true) {
      const prevScale = scale;
      scale = Math.min(Math.max(newScale, minScale), maxScale);

      if (scale <= 1) {
        posX = 0;
        posY = 0;
      } else {
        const factor = scale / prevScale;
        posX = focalX - (focalX - posX) * factor;
        posY = focalY - (focalY - posY) * factor;
        clampBoundaries();
      }
      applyTransform(animate);
    }

    function clampBoundaries() {
      if (scale <= 1) {
        posX = 0;
        posY = 0;
        return;
      }
      const rect = img.getBoundingClientRect();
      const parentWidth = window.innerWidth;
      const parentHeight = window.innerHeight;

      const currentW = rect.width;
      const currentH = rect.height;

      const maxPosX = Math.max(0, (currentW - parentWidth) / 2);
      const maxPosY = Math.max(0, (currentH - parentHeight) / 2);

      posX = Math.min(Math.max(posX, -maxPosX), maxPosX);
      posY = Math.min(Math.max(posY, -maxPosY), maxPosY);
    }

    function resetZoom(animate = true) {
      scale = 1;
      posX = 0;
      posY = 0;
      applyTransform(animate);
    }

    function openViewer(src) {
      if (!src) return;
      resetZoom(false);
      img.src = src;
      overlay.style.display = 'flex';
      overlay.offsetHeight;
      overlay.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeViewer() {
      overlay.classList.remove('show');
      document.body.style.overflow = '';
      setTimeout(() => {
        if (!overlay.classList.contains('show')) {
          overlay.style.display = 'none';
          img.src = '';
          resetZoom(false);
        }
      }, 300);
    }

    window.openCustomImageViewer = openViewer;
    window.closeCustomImageViewer = closeViewer;

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeViewer();
    });

    overlay.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.25 : -0.25;
      const focalX = e.clientX - window.innerWidth / 2;
      const focalY = e.clientY - window.innerHeight / 2;
      setZoom(scale + delta, focalX, focalY, false);
    }, { passive: false });

    img.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      if (scale > 1) {
        resetZoom(true);
      } else {
        const focalX = e.clientX - window.innerWidth / 2;
        const focalY = e.clientY - window.innerHeight / 2;
        setZoom(2.5, focalX, focalY, true);
      }
    });

    img.addEventListener('mousedown', (e) => {
      if (scale <= 1 || e.button !== 0) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
      img.style.cursor = 'grabbing';
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      clampBoundaries();
      applyTransform(false);
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        img.style.cursor = scale > 1 ? 'grab' : 'default';
      }
    });

    content.addEventListener('click', (e) => {
      if (e.target === content && scale <= 1) {
        closeViewer();
      }
    });

    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    content.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialDistance = getDistance(e.touches);
        initialScale = scale;
      } else if (e.touches.length === 1) {
        const now = Date.now();
        if (now - lastTapTime < 300) {
          e.preventDefault();
          if (scale > 1) {
            resetZoom(true);
          } else {
            const focalX = e.touches[0].clientX - window.innerWidth / 2;
            const focalY = e.touches[0].clientY - window.innerHeight / 2;
            setZoom(2.5, focalX, focalY, true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        if (scale > 1) {
          isDragging = true;
          startX = e.touches[0].clientX - posX;
          startY = e.touches[0].clientY - posY;
        }
      }
    }, { passive: false });

    content.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const currentDistance = getDistance(e.touches);
        if (initialDistance > 0) {
          const newScale = initialScale * (currentDistance / initialDistance);
          const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - window.innerWidth / 2;
          const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - window.innerHeight / 2;
          setZoom(newScale, midX, midY, false);
        }
      } else if (e.touches.length === 1 && isDragging && scale > 1) {
        e.preventDefault();
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        clampBoundaries();
        applyTransform(false);
      }
    }, { passive: false });

    content.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDistance = 0;
      }
      if (e.touches.length === 0) {
        isDragging = false;
        if (scale < 1) {
          resetZoom(true);
        }
      }
    });

    document.addEventListener('click', (e) => {
      const target = e.target;
      if (!target || target.tagName !== 'IMG') return;

      const shouldExclude = target.closest('#customImageViewerOverlay, .logo, .verify-badge, .animated-emoji-img, .friend-avatar, .chat-avatar, .header-toggle, .menu-btn, .adsbygoogle');
      if (shouldExclude) return;

      if (target.classList.contains('blur-media')) {
        target.classList.remove('blur-media');
        target.title = '';
        return;
      }

      if (target.src) {
        openViewer(target.src);
      }
    }, true);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (overlay && (overlay.style.display === 'flex' || overlay.classList.contains('show'))) {
          closeViewer();
        }
      }
    });
  })();
</script>
