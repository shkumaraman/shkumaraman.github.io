<style>
  .custom-image-viewer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 12, 0.92);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .custom-image-viewer-overlay.show {
    opacity: 1;
    display: flex;
  }

  .custom-image-viewer-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .custom-image-viewer-img {
    max-width: 90%;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    object-fit: contain;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform-origin: center center;
    will-change: transform;
    cursor: grab;
    pointer-events: auto;
  }

  .custom-image-viewer-img:active {
    cursor: grabbing;
  }

  .custom-image-viewer-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 10000000;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .custom-image-viewer-close-btn:hover {
    background: rgba(255, 59, 48, 0.25);
    border-color: rgba(255, 59, 48, 0.45);
    color: #ff3b30;
    transform: scale(1.08) rotate(90deg);
  }

  .custom-image-viewer-close-btn:active {
    transform: scale(0.92);
  }
</style>

<div id="customImageViewerOverlay" class="custom-image-viewer-overlay">
  <button class="custom-image-viewer-close-btn" title="Close" onclick="closeCustomImageViewer()">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <div class="custom-image-viewer-content" id="customImageViewerContent">
    <img id="customImageViewerImg" class="custom-image-viewer-img" src="" alt="Viewed Image" draggable="false" oncontextmenu="return false;">
  </div>
</div>

<script>
  let scale = 1;
  let posX = 0;
  let posY = 0;
  let startX = 0;
  let startY = 0;
  let isDragging = false;
  let initialPinchDist = 0;
  let initialScale = 1;
  let lastTapTime = 0;

  const overlay = document.getElementById('customImageViewerOverlay');
  const img = document.getElementById('customImageViewerImg');
  const content = document.getElementById('customImageViewerContent');

  function updateTransform(animate = false) {
    if (!img) return;
    img.style.transition = animate ? 'transform 0.25s cubic-bezier(0.2, 0, 0.2, 1)' : 'none';
    img.style.transform = `translate3d(${posX}px, ${posY}px, 0px) scale(${scale})`;
  }

  function resetZoom() {
    scale = 1;
    posX = 0;
    posY = 0;
    updateTransform(true);
  }

  function openCustomImageViewer(src) {
    if (!overlay || !img) return;
    img.src = src;
    resetZoom();
    overlay.style.display = 'flex';
    overlay.offsetHeight;
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeCustomImageViewer() {
    if (!overlay) return;
    overlay.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (!overlay.classList.contains('show')) {
        overlay.style.display = 'none';
        if (img) img.src = '';
        resetZoom();
      }
    }, 300);
  }

  function getDistance(touches) {
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  if (content && img) {
    content.addEventListener('click', (e) => {
      if (e.target === content) {
        closeCustomImageViewer();
      }
    });

    content.addEventListener('touchstart', (e) => {
      const now = Date.now();
      if (e.touches.length === 1) {
        if (now - lastTapTime < 300) {
          if (scale > 1) {
            resetZoom();
          } else {
            scale = 2.5;
            posX = 0;
            posY = 0;
            updateTransform(true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = now;

        if (scale > 1) {
          isDragging = true;
          startX = e.touches[0].clientX - posX;
          startY = e.touches[0].clientY - posY;
        }
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDist = getDistance(e.touches);
        initialScale = scale;
      }
    }, { passive: false });

    content.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging && scale > 1) {
        e.preventDefault();
        posX = e.touches[0].clientX - startX;
        posY = e.touches[0].clientY - startY;
        updateTransform(false);
      } else if (e.touches.length === 2) {
        e.preventDefault();
        const currentDist = getDistance(e.touches);
        if (initialPinchDist > 0) {
          const factor = currentDist / initialPinchDist;
          scale = Math.min(Math.max(initialScale * factor, 1), 4);
          updateTransform(false);
        }
      }
    }, { passive: false });

    content.addEventListener('touchend', (e) => {
      if (e.touches.length === 0) {
        isDragging = false;
        if (scale < 1.05) {
          resetZoom();
        }
      }
    });

    content.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.2 : 0.8;
      const nextScale = Math.min(Math.max(scale * zoomFactor, 1), 4);
      if (nextScale === 1) {
        resetZoom();
      } else {
        scale = nextScale;
        updateTransform(true);
      }
    }, { passive: false });

    content.addEventListener('mousedown', (e) => {
      if (e.target !== img || scale <= 1) return;
      isDragging = true;
      startX = e.clientX - posX;
      startY = e.clientY - posY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging || scale <= 1) return;
      posX = e.clientX - startX;
      posY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    img.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      if (scale > 1) {
        resetZoom();
      } else {
        scale = 2.5;
        posX = 0;
        posY = 0;
        updateTransform(true);
      }
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.addEventListener('click', (e) => {
      if (e.target.tagName === 'IMG') {
        const shouldExclude = e.target.closest('.logo, .friend-avatar, .chat-avatar, .header-toggle, .menu-btn, .adsbygoogle, #customImageViewerOverlay');
        if (!shouldExclude) {
          openCustomImageViewer(e.target.src);
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const overlayEl = document.getElementById('customImageViewerOverlay');
        if (overlayEl && (overlayEl.style.display === 'flex' || overlayEl.classList.contains('show'))) {
          closeCustomImageViewer();
        }
      }
    });
  });
</script>
