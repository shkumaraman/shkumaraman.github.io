<style>
  .custom-image-viewer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 12, 0.9);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .custom-image-viewer-overlay.show {
    opacity: 1;
    display: flex;
  }

  .custom-image-viewer-content {
    position: relative;
    max-width: 90%;
    max-height: 85%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(0.9);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .custom-image-viewer-overlay.show .custom-image-viewer-content {
    transform: scale(1);
  }

  .custom-image-viewer-img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 16px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
    object-fit: contain;
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: transform 0.3s ease;
  }

  .custom-image-viewer-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: white;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 10000000;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
  }

  .custom-image-viewer-close-btn:hover {
    background: rgba(255, 59, 48, 0.2);
    border-color: rgba(255, 59, 48, 0.4);
    color: #ff3b30;
    transform: scale(1.1) rotate(90deg);
  }

  .custom-image-viewer-close-btn:active {
    transform: scale(0.9);
  }
</style>

<div id="customImageViewerOverlay" class="custom-image-viewer-overlay" onclick="closeCustomImageViewer()">
  <button class="custom-image-viewer-close-btn" title="Close" onclick="closeCustomImageViewer()">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <div class="custom-image-viewer-content" onclick="event.stopPropagation()">
    <img id="customImageViewerImg" class="custom-image-viewer-img" src="" alt="Viewed Image">
  </div>
</div>

<script>
  function openCustomImageViewer(src) {
    if (!src) return;
    const overlay = document.getElementById('customImageViewerOverlay');
    const img = document.getElementById('customImageViewerImg');
    if (!overlay || !img) return;

    img.src = src;
    overlay.style.display = 'flex';
    overlay.offsetHeight;
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeCustomImageViewer() {
    const overlay = document.getElementById('customImageViewerOverlay');
    if (!overlay) return;

    overlay.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (!overlay.classList.contains('show')) {
        overlay.style.display = 'none';
        const img = document.getElementById('customImageViewerImg');
        if (img) img.src = '';
      }
    }, 300);
  }

  window.openCustomImageViewer = openCustomImageViewer;
  window.closeCustomImageViewer = closeCustomImageViewer;

  document.addEventListener('click', (e) => {
    const target = e.target;
    if (!target || target.tagName !== 'IMG') return;

    const shouldExclude = target.closest('#customImageViewerOverlay, .logo, .verify-badge, .animated-emoji-img, .friend-avatar, .chat-avatar, .header-toggle, .menu-btn, .adsbygoogle');
    if (shouldExclude) return;

    if (target.classList.contains('blur-media')) {
      target.classList.remove('blur-media');
      target.title = '';
      return;
    }

    if (target.src) {
      openCustomImageViewer(target.src);
    }
  }, true);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const overlay = document.getElementById('customImageViewerOverlay');
      if (overlay && (overlay.style.display === 'flex' || overlay.classList.contains('show'))) {
        closeCustomImageViewer();
      }
    }
  });
</script>
