<style>
  .custom-image-viewer-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 10, 12, 0.94);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 9999999;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.25s ease;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .custom-image-viewer-overlay.show {
    opacity: 1;
    display: flex;
  }

  .custom-image-viewer-content {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .custom-image-viewer-img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
    object-fit: contain;
    border: 1px solid rgba(255, 255, 255, 0.12);
    transform-origin: center center;
    will-change: transform;
    cursor: default;
  }

  .custom-image-viewer-close-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #ffffff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    z-index: 10000000;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .custom-image-viewer-close-btn:hover {
    background: rgba(255, 59, 48, 0.25);
    border-color: rgba(255, 59, 48, 0.5);
    color: #ff453a;
    transform: scale(1.08);
  }

  .custom-image-viewer-close-btn:active {
    transform: scale(0.92);
  }
</style>

<div id="customImageViewerOverlay" class="custom-image-viewer-overlay">
  <button class="custom-image-viewer-close-btn" type="button" title="Close" onclick="closeCustomImageViewer()">
    <i class="fa-solid fa-xmark"></i>
  </button>
  <div class="custom-image-viewer-content" id="customImageViewerContent">
    <img id="customImageViewerImg" class="custom-image-viewer-img" src="" alt="Viewed Image">
  </div>
</div>

<script>
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let initialDistance = 0;
  let initialScale = 1;
  let lastTapTime = 0;
  let hasMoved = false;

  function getViewerElements() {
    return {
      overlay: document.getElementById('customImageViewerOverlay'),
      img: document.getElementById('customImageViewerImg'),
      content: document.getElementById('customImageViewerContent')
    };
  }

  function updateTransform(smooth = false) {
    const { img } = getViewerElements();
    if (!img) return;
    img.style.transition = smooth ? 'transform 0.25s cubic-bezier(0.2, 0, 0.2, 1)' : 'none';
    img.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
    img.style.cursor = scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
  }

  function resetZoom() {
    scale = 1;
    translateX = 0;
    translateY = 0;
    isDragging = false;
    hasMoved = false;
    updateTransform(false);
  }

  window.openCustomImageViewer = function(src) {
    const { overlay, img } = getViewerElements();
    if (!overlay || !img || !src) return;

    resetZoom();
    img.src = src;
    overlay.style.display = 'flex';
    void overlay.offsetHeight;
    overlay.classList.add('show');
    document.body.style.overflow = 'hidden';
  };

  window.closeCustomImageViewer = function() {
    const { overlay, img } = getViewerElements();
    if (!overlay) return;

    overlay.classList.remove('show');
    document.body.style.overflow = '';
    setTimeout(() => {
      if (!overlay.classList.contains('show')) {
        overlay.style.display = 'none';
        resetZoom();
        if (img) img.src = '';
      }
    }, 250);
  };

  function getDistance(touches) {
    return Math.hypot(
      touches[0].clientX - touches[1].clientX,
      touches[0].clientY - touches[1].clientY
    );
  }

  function setupViewerInteractions() {
    const { overlay, img, content } = getViewerElements();
    if (!overlay || overlay._hasViewerEvents) return;
    overlay._hasViewerEvents = true;

    overlay.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.25 : 0.8;
      let targetScale = scale * zoomFactor;

      if (targetScale < 1) targetScale = 1;
      if (targetScale > 6) targetScale = 6;

      if (targetScale === 1) {
        translateX = 0;
        translateY = 0;
      } else {
        const rect = img.getBoundingClientRect();
        const mouseX = e.clientX - (rect.left + rect.width / 2);
        const mouseY = e.clientY - (rect.top + rect.height / 2);
        translateX -= mouseX * (zoomFactor - 1);
        translateY -= mouseY * (zoomFactor - 1);
      }

      scale = targetScale;
      updateTransform(true);
    }, { passive: false });

    overlay.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      if (scale > 1) {
        isDragging = true;
        hasMoved = false;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
        if (img) img.style.cursor = 'grabbing';
        e.preventDefault();
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      hasMoved = true;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform(false);
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        const { img } = getViewerElements();
        if (img) img.style.cursor = scale > 1 ? 'grab' : 'default';
      }
    });

    overlay.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isDragging = false;
        initialDistance = getDistance(e.touches);
        initialScale = scale;
      } else if (e.touches.length === 1) {
        const currentTime = Date.now();
        const tapGap = currentTime - lastTapTime;

        if (tapGap < 300 && tapGap > 0) {
          e.preventDefault();
          if (scale > 1) {
            resetZoom();
            updateTransform(true);
          } else {
            scale = 2.5;
            const touch = e.touches[0];
            translateX = (window.innerWidth / 2 - touch.clientX) * 0.8;
            translateY = (window.innerHeight / 2 - touch.clientY) * 0.8;
            updateTransform(true);
          }
          lastTapTime = 0;
          return;
        }
        lastTapTime = currentTime;

        if (scale > 1) {
          isDragging = true;
          hasMoved = false;
          startX = e.touches[0].clientX - translateX;
          startY = e.touches[0].clientY - translateY;
        }
      }
    }, { passive: false });

    overlay.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const currentDistance = getDistance(e.touches);
        if (initialDistance > 0) {
          let targetScale = initialScale * (currentDistance / initialDistance);
          if (targetScale < 1) targetScale = 1;
          if (targetScale > 6) targetScale = 6;
          scale = targetScale;
          if (scale === 1) {
            translateX = 0;
            translateY = 0;
          }
          updateTransform(false);
        }
      } else if (e.touches.length === 1 && isDragging && scale > 1) {
        e.preventDefault();
        hasMoved = true;
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        updateTransform(false);
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialDistance = 0;
      }
      if (e.touches.length === 0) {
        isDragging = false;
        if (scale <= 1) {
          resetZoom();
        }
      }
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target === content) {
        if (!hasMoved) {
          closeCustomImageViewer();
        }
      }
    });

    if (img) {
      img.addEventListener('dblclick', (e) => {
        e.stopPropagation();
        if (scale > 1) {
          resetZoom();
          updateTransform(true);
        } else {
          scale = 2.5;
          translateX = window.innerWidth / 2 - e.clientX;
          translateY = window.innerHeight / 2 - e.clientY;
          updateTransform(true);
        }
      });
    }
  }

  document.addEventListener('click', (e) => {
    const target = e.target;
    if (!target || target.tagName !== 'IMG') return;

    if (target.id === 'customImageViewerImg' || target.closest('#customImageViewerOverlay')) return;
    if (target.closest('.logo, .friend-avatar, .chat-avatar, .header-toggle, .menu-btn, .adsbygoogle, .animated-emoji-img, .verify-badge')) return;

    setupViewerInteractions();
    openCustomImageViewer(target.src);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const { overlay } = getViewerElements();
      if (overlay && (overlay.style.display === 'flex' || overlay.classList.contains('show'))) {
        closeCustomImageViewer();
      }
    }
  });

  setupViewerInteractions();
</script>
