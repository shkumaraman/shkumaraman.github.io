<style>
  :root {
    --tst-bg: #1a1a1e;
    --tst-border: rgba(255, 255, 255, 0.08);
    --tst-text: #ffffff;
    --tst-sub: rgba(255, 255, 255, 0.55);
    --tst-shadow: rgba(0, 0, 0, 0.4);
  }
  
  .light-mode {
    --tst-bg: #ffffff;
    --tst-border: rgba(0, 0, 0, 0.1);
    --tst-text: #111111;
    --tst-sub: rgba(0, 0, 0, 0.6);
    --tst-shadow: rgba(0, 0, 0, 0.12);
  }

  .toast-wrapper {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    background: var(--tst-bg);
    border: 0.5px solid var(--tst-border);
    box-shadow: 0 12px 30px var(--tst-shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10001;
    width: 90%;
    transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }

  #messageToast {
    top: -120px;
    max-width: 500px;
    padding: 14px 18px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .msg-toast-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }

  #toastIconWrapper {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #25D366;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .msg-toast-info {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  #toastName {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--tst-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #toastMessage {
    font-size: 13px;
    color: var(--tst-sub);
    margin-top: 2px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #toastViewBtn {
    background: #25D366;
    border: none;
    color: #fff;
    padding: 8px 18px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
    transition: transform 0.1s, background 0.15s;
  }

  #toastViewBtn:active {
    transform: scale(0.95);
  }
  
  #toastViewBtn:hover {
    background: #21b858;
  }

  #callToast {
    top: -150px;
    max-width: 400px;
    padding: 18px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .call-toast-header {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  #callToastAvatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #ff6b4a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .call-toast-info {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }

  #callToastName {
    font-size: 16px;
    font-weight: 600;
    color: var(--tst-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #callToastType {
    font-size: 13px;
    color: #25D366;
    margin-top: 2px;
  }

  .call-toast-actions {
    display: flex;
    gap: 12px;
    width: 100%;
  }

  .call-btn {
    flex: 1;
    border: none;
    color: #fff;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s, background 0.15s;
  }

  .call-btn:active {
    transform: scale(0.96);
  }

  #callToastRejectBtn {
    background: #FF3B30;
  }

  #callToastRejectBtn:hover {
    background: #e6352b;
  }

  #callToastAcceptBtn {
    background: #25D366;
  }
  
  #callToastAcceptBtn:hover {
    background: #21b858;
  }
</style>

<div id="messageToast" class="toast-wrapper">
  <div class="msg-toast-left">
    <div id="toastIconWrapper">
      <svg id="toastIcon" style="width: 18px; height: 18px; fill: white;" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z" />
      </svg>
    </div>
    <div class="msg-toast-info">
      <span id="toastName"></span>
      <span id="toastMessage"></span>
    </div>
  </div>
  <button id="toastViewBtn">View</button>
</div>

<div id="callToast" class="toast-wrapper">
  <div class="call-toast-header">
    <div id="callToastAvatar">?</div>
    <div class="call-toast-info">
      <span id="callToastName"></span>
      <span id="callToastType">Incoming Call...</span>
    </div>
  </div>
  <div class="call-toast-actions">
    <button id="callToastRejectBtn" class="call-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.6 9a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 0 2.8 0l1.4-1.4a2 2 0 0 0 0-2.8l-1.6-1.6a2 2 0 0 0-2.8 0l-5 5-2.8-2.8" />
        <path d="m2 2 20 20" />
      </svg>
      Decline
    </button>
    <button id="callToastAcceptBtn" class="call-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      Accept
    </button>
  </div>
</div>

<script type="module">
  import { initializeApp, getApp, getApps } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

  document.addEventListener("DOMContentLoaded", function () {
    const configDefault = { databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app" };
    const configGroups = { databaseURL: "https://talkrush2-default-rtdb.asia-southeast1.firebasedatabase.app" };
    const configFriends = { databaseURL: "https://talkrush3-default-rtdb.asia-southeast1.firebasedatabase.app" };

    const apps = getApps();

    let appDefault = apps.find(a => a.name === "[DEFAULT]");
    if (!appDefault) {
      appDefault = initializeApp(configDefault);
    }
    const dbDefault = getDatabase(appDefault);

    let appGroups = apps.find(a => a.name === "TalkRushGroupApp");
    if (!appGroups) {
      appGroups = initializeApp(configGroups, "TalkRushGroupApp");
    }
    const dbGroups = getDatabase(appGroups);

    let appFriends = apps.find(a => a.name === "TalkRushFriendApp");
    if (!appFriends) {
      appFriends = initializeApp(configFriends, "TalkRushFriendApp");
    }
    const dbFriends = getDatabase(appFriends);

    const myNickname = localStorage.getItem("talkrush_nickname");
    if (!myNickname) return;

    window.firebaseDB = dbDefault;

    const toast = document.getElementById("messageToast");
    const toastName = document.getElementById("toastName");
    const toastMessage = document.getElementById("toastMessage");
    const toastViewBtn = document.getElementById("toastViewBtn");
    const toastIcon = document.getElementById("toastIcon");
    const toastIconWrapper = document.getElementById("toastIconWrapper");

    const notifySound = new Audio("/assets/notify.mp3");
    let soundMuted = localStorage.getItem("soundMuted") === "true";
    let notificationOff = localStorage.getItem("notificationOff") === "true";
    notifySound.muted = soundMuted;

    let lastNotifiedMessages = JSON.parse(localStorage.getItem("lastNotifiedMessages") || "{}");
    let toastQueue = [];
    let toastShowing = false;
    const DM_ICON_PATH = "M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z";
    const REPLY_ICON_PATH = "M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z";

    function getFriendNickname(friend) {
      return friend.nickname1 === myNickname ? friend.nickname2 : friend.nickname2 === myNickname ? friend.nickname1 : null;
    }

    onValue(ref(dbFriends, "friends"), (snap) => {
      const data = snap.val();
      
      let unreadCount = 0;
      let lastSeenMap = JSON.parse(localStorage.getItem('inbox_last_seen') || '{}');
      const params = new URLSearchParams(window.location.search);
      const currentChatId = window.location.pathname.includes('inbox.html') ? params.get('chatId') : null;
      if (currentChatId) lastSeenMap[currentChatId] = Date.now();

      if (!data) {
        window._lastInboxBadgeCount = 0;
        window.dispatchEvent(new CustomEvent('updateInboxBadge', { detail: 0 }));
        return;
      }
      
      Object.entries(data).forEach(([chatId, friend]) => {
        if (friend.nickname1 === myNickname || friend.nickname2 === myNickname) {
          let chatLastSeen = lastSeenMap[chatId] || 0;
          let lastTimestamp = friend.lastTimestamp || 0;
          if (friend.lastSender && friend.lastSender !== myNickname && lastTimestamp > chatLastSeen && chatId !== currentChatId) {
            unreadCount++;
          }
        }
        
        const friendNick = getFriendNickname(friend);
        if (!friendNick) return;
        
        if (!friend.lastMessageText || friend.lastSender === myNickname) return;
        
        const key = chatId + "_" + friend.lastTimestamp;
        
        if (lastNotifiedMessages[chatId] === key) return;
        if (notificationOff) return;

        const redirectUrl = `/chat/inbox.html?chatId=${encodeURIComponent(chatId)}&friend=${encodeURIComponent(friendNick)}`;
        
        toastQueue.push({ 
          chatId: chatId, 
          senderName: friendNick, 
          message: friend.lastMessageText, 
          redirectUrl: redirectUrl, 
          type: "dm", 
          timestamp: friend.lastTimestamp 
        });
        
        lastNotifiedMessages[chatId] = key;
        localStorage.setItem("lastNotifiedMessages", JSON.stringify(lastNotifiedMessages));
        processToastQueue();
      });

      window._lastInboxBadgeCount = unreadCount;
      window.dispatchEvent(new CustomEvent('updateInboxBadge', { detail: unreadCount }));
    });

    const safeKey = myNickname.replace(/[.#$\[\]]/g, '_');
    onValue(ref(dbGroups, `group_reply/${safeKey}`), (snap) => {
      const data = snap.val();
      
      let count = 0;
      const currentPath = window.location.pathname;
      const currentGroupParams = new URLSearchParams(window.location.search).get('group');

      if (!data) {
        window._lastRoomBadgeCount = 0;
        window.dispatchEvent(new CustomEvent('updateRoomBadge', { detail: 0 }));
        return;
      }

      Object.entries(data).forEach(([groupName, replyData]) => {
        const unreadCount = replyData.unreadCount || 0;
        
        if (groupName !== currentGroupParams) {
          count += unreadCount;
        }

        if (currentPath.includes('/chat/group.html') && currentGroupParams === groupName) {
           return; 
        }

        if (unreadCount === 0) return;

        const key = "group_reply_" + groupName + "_" + unreadCount;
        
        if (lastNotifiedMessages[groupName] === key) return;
        if (notificationOff) return;

        const redirectUrl = `/chat/group.html?group=${encodeURIComponent(groupName)}`;
        const replyText = unreadCount === 1 ? '1 new reply' : `${unreadCount} new replies`;
        
        toastQueue.push({ 
          chatId: groupName, 
          groupName: groupName,
          message: replyText, 
          redirectUrl: redirectUrl, 
          type: "group_mention"
        });
        
        lastNotifiedMessages[groupName] = key;
        localStorage.setItem("lastNotifiedMessages", JSON.stringify(lastNotifiedMessages));
        processToastQueue();
      });

      window._lastRoomBadgeCount = count;
      window.dispatchEvent(new CustomEvent('updateRoomBadge', { detail: count }));
    });

    function processToastQueue() {
      if (toastShowing || toastQueue.length === 0) return;
      toastShowing = true;
      const data = toastQueue.shift();
      
      if (data.type === "group_mention") {
        toastIconWrapper.style.background = "#5b9bd5"; 
        toastIcon.querySelector("path").setAttribute("d", REPLY_ICON_PATH); 
        toastName.textContent = `New Reply in ${data.groupName}`;
      } else if (data.type === "reply") { 
        toastIconWrapper.style.background = "#5b9bd5"; 
        toastIcon.querySelector("path").setAttribute("d", REPLY_ICON_PATH); 
        toastName.textContent = data.senderName + " replied to you"; 
      } else { 
        toastIconWrapper.style.background = "#25D366"; 
        toastIcon.querySelector("path").setAttribute("d", DM_ICON_PATH); 
        toastName.textContent = data.senderName; 
      }
      
      toastMessage.textContent = data.message;
      if (!soundMuted) { notifySound.currentTime = 0; notifySound.play().catch(() => { }); }
      toast.style.top = "20px";

      const handleToastNavigation = () => {
        toast.style.top = "-120px";
        if (data.type === "group_mention") {
            window.location.href = data.redirectUrl;
        } else if (window.location.pathname.includes('/chat/inbox') && typeof window.openChat === 'function' && data.chatId && data.senderName) {
            window.openChat(data.chatId, data.senderName);
        } else {
            window.location.href = data.redirectUrl;
        }
      };

      toast.onclick = handleToastNavigation;
      toastViewBtn.onclick = (e) => {
        e.stopPropagation();
        handleToastNavigation();
      };

      setTimeout(() => { 
        toast.style.top = "-120px"; 
        setTimeout(() => { 
          toastShowing = false; 
          processToastQueue(); 
        }, 400); 
      }, 5000);
    }

    const callToast = document.getElementById('callToast');
    window.callRingtone = new Audio('/assets/ringtone.mp3');
    window.callRingtone.loop = true;
    let isRinging = false;
    let wasRinging = false;

    const safeCallName = myNickname.replace(/[.#$\[\]]/g, '_');
    const myCallRef = ref(dbDefault, 'calls/' + safeCallName);

    onValue(myCallRef, (snapshot) => {
      const callData = snapshot.val();
      if (callData && callData.status === 'calling' && callData.receiver === myNickname) {
        if (isRinging) return;
        isRinging = true;
        wasRinging = true;

        document.getElementById('callToastName').innerText = callData.caller;
        
        let callerName = callData.caller || "";
        let avatarLetter = "?";
        if (callerName.toUpperCase().startsWith("TR|")) {
          avatarLetter = (callerName.charAt(3) || "?").toUpperCase();
        } else if (callerName) {
          avatarLetter = callerName.charAt(0).toUpperCase();
        }
        document.getElementById('callToastAvatar').innerText = avatarLetter;

        document.getElementById('callToastType').innerText = `Incoming ${callData.type.charAt(0).toUpperCase() + callData.type.slice(1)} Call...`;
        callToast.style.top = '20px';
        const ringtoneMuted = localStorage.getItem("ringtoneMuted") === "true";
        if (!ringtoneMuted) {
          window.callRingtone.play().catch(() => { });
        }

        document.getElementById('callToastAcceptBtn').onclick = async () => {
          isRinging = false;
          wasRinging = false;
          callToast.style.top = '-150px';
          window.callRingtone.pause();
          window.callRingtone.currentTime = 0;

          if (window.acceptIncomingCall) {
            await window.acceptIncomingCall(callData.caller, callData.type);
          }
        };

        document.getElementById('callToastRejectBtn').onclick = () => {
          isRinging = false;
          wasRinging = false;
          callToast.style.top = '-150px';
          window.callRingtone.pause();
          window.callRingtone.currentTime = 0;
          remove(ref(dbDefault, `calls/${safeCallName}`));
        };
      }
      else if (!callData || callData.status === 'ended' || callData.status === 'rejected') {
        if (wasRinging) {
          isRinging = false;
          wasRinging = false;
          callToast.style.top = '-150px';
          window.callRingtone.pause();
          window.callRingtone.currentTime = 0;
        }
        if (window.forceEndCallUI) {
          window.forceEndCallUI();
        }
        if (callData && (callData.status === 'ended' || callData.status === 'rejected')) {
          remove(ref(dbDefault, 'calls/' + safeCallName));
        }
      }
    });

    let toastStartY = 0;
    
    toast.addEventListener('touchstart', (e) => {
      toastStartY = e.touches[0].clientY;
    }, { passive: true });

    toast.addEventListener('touchmove', (e) => {
      let currentY = e.touches[0].clientY;
      if (toastStartY - currentY > 40) { 
        toast.style.top = "-120px";
      }
    }, { passive: true });

    let callStartY = 0;

    callToast.addEventListener('touchstart', (e) => {
      callStartY = e.touches[0].clientY;
    }, { passive: true });

    callToast.addEventListener('touchmove', (e) => {
      let currentY = e.touches[0].clientY;
      if (callStartY - currentY > 40) { 
        callToast.style.top = "-150px";
        isRinging = false;
        wasRinging = false;
        window.callRingtone.pause(); 
        window.callRingtone.currentTime = 0;
        remove(ref(dbDefault, `calls/${safeCallName}`));
      }
    }, { passive: true });
  });
</script>
