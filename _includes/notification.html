<style>
  :root {
    --nf-bg: #1a1a1e;
    --nf-border: rgba(255, 255, 255, 0.08);
    --nf-text: #ffffff;
    --nf-sub: rgba(255, 255, 255, 0.55);
    --nf-chip: rgba(255, 255, 255, 0.1);
    --nf-shadow: rgba(0, 0, 0, 0.4);
  }

  .light-mode {
    --nf-bg: #ffffff;
    --nf-border: rgba(0, 0, 0, 0.1);
    --nf-text: #111111;
    --nf-sub: rgba(0, 0, 0, 0.6);
    --nf-chip: rgba(0, 0, 0, 0.08);
    --nf-shadow: rgba(0, 0, 0, 0.12);
  }

  .nf-toast {
    position: fixed;
    left: 50%;
    top: 0;
    width: 92%;
    max-width: 420px;
    transform: translate(-50%, -160%);
    background: var(--nf-bg);
    border: 0.5px solid var(--nf-border);
    border-radius: 16px;
    box-shadow: 0 12px 30px var(--nf-shadow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
    cursor: pointer;
    z-index: 10001;
    pointer-events: none;
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    will-change: transform;
  }

  .nf-toast.show {
    transform: translate(-50%, calc(env(safe-area-inset-top, 0px) + 12px));
    pointer-events: auto;
  }

  .nf-toast.is-call {
    cursor: default;
  }

  .nf-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
  }

  .nf-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nf-icon svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  .nf-toast.is-call .nf-icon {
    animation: nfRing 1s ease-in-out infinite;
  }

  @keyframes nfRing {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .nf-text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .nf-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--nf-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nf-msg {
    font-size: 13px;
    line-height: 1.3;
    color: var(--nf-sub);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .nf-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--nf-sub);
    background: var(--nf-chip);
    padding: 2px 8px;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .nf-count:empty {
    display: none;
  }

  .nf-calls {
    display: none;
    gap: 12px;
    padding: 0 16px 16px;
  }

  .nf-toast.is-call .nf-calls {
    display: flex;
  }

  .nf-btn {
    flex: 1;
    border: none;
    color: #fff;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.1s, background 0.15s;
  }

  .nf-btn:active {
    transform: scale(0.96);
  }

  .nf-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  #nfDecline {
    background: #FF3B30;
  }

  #nfDecline:hover {
    background: #e6352b;
  }

  #nfAccept {
    background: #25D366;
  }

  #nfAccept:hover {
    background: #21b858;
  }

  .nf-bar {
    height: 3px;
    width: 100%;
  }

  .nf-toast.is-call .nf-bar {
    display: none;
  }

  .nf-bar i {
    display: block;
    height: 100%;
    width: 100%;
    transform: scaleX(0);
    transform-origin: left;
  }

  .nf-bar i.run {
    animation: nfBar linear forwards;
  }

  @keyframes nfBar {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }
</style>

<div id="nfToast" class="nf-toast" role="status" aria-live="polite">
  <div class="nf-row">
    <div class="nf-icon" id="nfIcon">
      <svg viewBox="0 0 24 24"><path id="nfPath" d=""/></svg>
    </div>
    <div class="nf-text">
      <span class="nf-title" id="nfTitle"></span>
      <span class="nf-msg" id="nfMsg"></span>
    </div>
    <span class="nf-count" id="nfCount"></span>
  </div>
  <div class="nf-calls">
    <button id="nfDecline" class="nf-btn">
      <svg viewBox="0 0 24 24">
        <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
        <line x1="23" y1="1" x2="1" y2="23"/>
      </svg>
      Decline
    </button>
    <button id="nfAccept" class="nf-btn">
      <svg viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      Accept
    </button>
  </div>
  <div class="nf-bar"><i id="nfBar"></i></div>
</div>

<script type="module">
  import { initializeApp, getApps } from "firebase/app";
  import {
    getDatabase,
    ref,
    onValue,
    onChildAdded,
    remove,
    update
  } from "firebase/database";

  const baseUrl = window.MEDIA_STORAGE_URL.replace(/\/$/, "");
  const DURATION = 5000;
  const HISTORY_LIMIT = 50;

  const ICONS = {
    dm: "M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z",
    reply: "M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z",
    heart: "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z",
    call: "M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z",
    check: "M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z",
    error: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z",
    info: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"
  };

  const TYPES = {
    dm: { color: "#25D366", icon: ICONS.dm, mutable: true, save: true },
    reply: { color: "#5b9bd5", icon: ICONS.reply, mutable: true, save: true, title: n => `${n} replied to you` },
    like: { color: "#ff3366", icon: ICONS.heart, mutable: true, save: true, title: n => `${n} liked your post` },
    comment: { color: "#ff6b4a", icon: ICONS.dm, mutable: true, save: true, title: n => `${n} commented on your post` },
    group_mention: { color: "#5b9bd5", icon: ICONS.reply, mutable: true, save: true, title: n => `New reply in ${n}` },
    call: { color: "#25D366", icon: ICONS.call, persistent: true },
    success: { color: "#25D366", icon: ICONS.check },
    error: { color: "#FF3B30", icon: ICONS.error },
    info: { color: "#5b9bd5", icon: ICONS.info }
  };

  const read = (key, fallback) => {
    try {
      const value = JSON.parse(localStorage.getItem(key));
      return value === null || value === undefined ? fallback : value;
    } catch (e) {
      return fallback;
    }
  };

  const write = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  };

  const flag = key => localStorage.getItem(key) === "true";

  const safeKey = str => str ? encodeURIComponent(str).replace(/[.#$\[\]\/]/g, "_") : "guest";
  const plainKey = str => String(str || "guest").replace(/[.#$\[\]]/g, "_");

  const toast = document.getElementById("nfToast");
  const iconEl = document.getElementById("nfIcon");
  const pathEl = document.getElementById("nfPath");
  const titleEl = document.getElementById("nfTitle");
  const msgEl = document.getElementById("nfMsg");
  const countEl = document.getElementById("nfCount");
  const barEl = document.getElementById("nfBar");

  const notifySound = new Audio("/assets/notify.mp3");
  const ringtone = new Audio("/assets/ringtone.mp3");
  ringtone.loop = true;
  window.callRingtone = ringtone;

  let queue = [];
  let current = null;
  let busy = false;
  let timer = null;

  function saveToHistory(item) {
    let list = read("talkrush_notifications_history", []);

    if (item.type === "dm") {
      const enc = encodeURIComponent;
      list = list.filter(n => {
        if (n.type !== "dm") return true;
        if (item.chatId && n.chatId === item.chatId) return false;
        if (item.senderName && n.senderName === item.senderName) return false;
        if (item.chatId && n.redirectUrl && n.redirectUrl.includes("chatId=" + enc(item.chatId))) return false;
        if (item.senderName && n.redirectUrl && n.redirectUrl.includes("friend=" + enc(item.senderName))) return false;
        return true;
      });
    }

    list.unshift({
      id: "nt_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4),
      chatId: item.chatId || null,
      senderName: item.senderName,
      message: item.message,
      redirectUrl: item.redirectUrl,
      type: item.type,
      timestamp: item.timestamp || Date.now(),
      read: false
    });

    write("talkrush_notifications_history", list.slice(0, HISTORY_LIMIT));
    window.dispatchEvent(new CustomEvent("localNotificationsUpdated"));
  }

  function updateCount() {
    countEl.textContent = queue.length ? `+${queue.length}` : "";
  }

  function stopRing() {
    ringtone.pause();
    ringtone.currentTime = 0;
  }

  function render(item) {
    const cfg = item.cfg;

    toast.classList.toggle("is-call", !!cfg.persistent);
    iconEl.style.background = cfg.color;
    pathEl.setAttribute("d", cfg.icon);
    titleEl.textContent = cfg.title ? cfg.title(item.title) : item.title;
    msgEl.textContent = item.message || "";

    barEl.classList.remove("run");
    barEl.style.background = cfg.color;
    barEl.style.animationDuration = DURATION + "ms";
    void barEl.offsetWidth;

    if (cfg.persistent) {
      if (!flag("ringtoneMuted")) ringtone.play().catch(() => {});
    } else {
      barEl.classList.add("run");
      timer = setTimeout(hide, DURATION);
      if (!item.silent && !flag("soundMuted")) {
        notifySound.currentTime = 0;
        notifySound.play().catch(() => {});
      }
    }

    updateCount();
    toast.classList.add("show");
  }

  function next() {
    if (busy || !queue.length) return;
    busy = true;
    current = queue.shift();
    render(current);
  }

  function hide() {
    if (!current) return;
    clearTimeout(timer);
    if (current.cfg.persistent) stopRing();
    current = null;
    toast.classList.remove("show");
    setTimeout(() => {
      busy = false;
      next();
    }, 400);
  }

  function open(item) {
    if (item.onClick) return item.onClick(item);
    if (
      item.type === "dm" &&
      item.chatId &&
      item.title &&
      location.pathname.includes("/chat/inbox") &&
      typeof window.openChat === "function"
    ) {
      return window.openChat(item.chatId, item.title);
    }
    if (item.url) location.href = item.url;
  }

  function notify(opts) {
    const cfg = TYPES[opts.type] || TYPES.dm;
    if (flag("notificationOff") && cfg.mutable) return null;

    const item = { ...opts, cfg };

    if (cfg.save && opts.history !== false) {
      saveToHistory({
        chatId: opts.chatId,
        senderName: opts.title,
        message: opts.message,
        redirectUrl: opts.url,
        type: opts.type,
        timestamp: opts.timestamp
      });
    }

    if (cfg.persistent) {
      queue = queue.filter(q => q.type !== item.type);
      queue.unshift(item);
      if (current && !current.cfg.persistent) hide();
    } else {
      queue.push(item);
    }

    updateCount();
    next();
    return item;
  }

  function dismiss(type) {
    queue = queue.filter(q => q.type !== type);
    if (current && current.type === type) hide();
    updateCount();
  }

  window.notify = notify;
  window.dismissNotify = dismiss;

  toast.addEventListener("click", e => {
    if (!current || current.cfg.persistent || e.target.closest("button")) return;
    const item = current;
    hide();
    open(item);
  });

  document.getElementById("nfAccept").onclick = () => {
    const item = current;
    hide();
    if (item && item.onAccept) item.onAccept(item);
  };

  document.getElementById("nfDecline").onclick = () => {
    const item = current;
    hide();
    if (item && item.onDecline) item.onDecline(item);
  };

  let touchStartY = 0;

  toast.addEventListener("touchstart", e => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  toast.addEventListener("touchmove", e => {
    if (!current || touchStartY - e.touches[0].clientY <= 40) return;
    const item = current;
    hide();
    if (item.cfg.persistent && item.onDecline) item.onDecline(item);
  }, { passive: true });

  const apps = getApps();
  const appDefault = apps.find(a => a.name === "[DEFAULT]") || initializeApp({
    databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app"
  });
  const appGroups = apps.find(a => a.name === "TalkRushGroupApp") || initializeApp({
    databaseURL: "https://talkrush2-default-rtdb.asia-southeast1.firebasedatabase.app"
  }, "TalkRushGroupApp");

  const dbDefault = getDatabase(appDefault);
  const dbGroups = getDatabase(appGroups);
  window.firebaseDB = dbDefault;

  let myNickname = localStorage.getItem("talkrush_nickname");
  let lastNotified = read("lastNotifiedMessages", {});
  let userFriendsMap = {};
  let friendsInitialLoaded = false;
  let listenersAttached = false;
  let ringing = false;
  let unsubs = [];
  let friendsWs = null;
  let friendsPing = null;

  function detachListeners() {
    if (friendsPing) {
      clearInterval(friendsPing);
      friendsPing = null;
    }
    if (friendsWs) {
      try {
        friendsWs.onclose = null;
        friendsWs.close();
      } catch (e) {}
      friendsWs = null;
    }
    unsubs.forEach(u => {
      try { if (typeof u === "function") u(); } catch (e) {}
    });
    unsubs = [];
    listenersAttached = false;
  }

  function isChatActive(chatId) {
    if (!chatId || document.hidden) return false;
    const container = document.getElementById("chatContainer");
    const visible = container ? container.style.display !== "none" : false;
    if (!visible) return false;
    if (window.currentInboxChatId === chatId) return true;
    if (location.pathname.includes("/chat/inbox")) {
      return new URLSearchParams(location.search).get("chatId") === chatId;
    }
    return false;
  }

  function getFriendNickname(friend) {
    if (friend.nickname1 === myNickname) return friend.nickname2;
    if (friend.nickname2 === myNickname) return friend.nickname1;
    return null;
  }

  function updateFriendsBadge() {
    const lastSeen = read("inbox_last_seen", {});
    const onInbox = location.pathname.includes("/chat/inbox");
    const activeChatId = onInbox ? new URLSearchParams(location.search).get("chatId") : null;
    if (activeChatId) lastSeen[activeChatId] = Date.now();

    let unread = 0;
    Object.entries(userFriendsMap).forEach(([chatId, friend]) => {
      const seen = lastSeen[chatId] || 0;
      const ts = friend.lastTimestamp || 0;
      if (friend.lastSender && friend.lastSender !== myNickname && ts > seen && chatId !== activeChatId) {
        unread++;
      }
    });

    window._lastInboxBadgeCount = unread;
    window.dispatchEvent(new CustomEvent("updateInboxBadge", { detail: unread }));
  }

  function handleFriendRecord(chatId, friend, allowToast) {
    if (!friend || (friend.nickname1 !== myNickname && friend.nickname2 !== myNickname)) return;

    userFriendsMap[chatId] = friend;
    updateFriendsBadge();

    if (!allowToast) return;

    const friendNick = getFriendNickname(friend);
    if (!friendNick || !friend.lastMessageText || friend.lastSender === myNickname) return;

    const key = chatId + "_" + friend.lastTimestamp;
    if (lastNotified[chatId] === key || flag("notificationOff")) return;

    lastNotified[chatId] = key;
    write("lastNotifiedMessages", lastNotified);

    if (isChatActive(chatId)) {
      const lastSeen = read("inbox_last_seen", {});
      lastSeen[chatId] = Date.now();
      write("inbox_last_seen", lastSeen);
      return;
    }

    notify({
      type: "dm",
      chatId: chatId,
      title: friendNick,
      message: friend.lastMessageText,
      url: `/chat/inbox?chatId=${encodeURIComponent(chatId)}&friend=${encodeURIComponent(friendNick)}`,
      timestamp: friend.lastTimestamp
    });
  }

  function initFriendsWebSocket() {
    if (!myNickname || myNickname === "Guest") return;

    const proto = baseUrl.startsWith("https") ? "wss:" : "ws:";
    const host = baseUrl.replace(/^https?:\/\//, "");

    try {
      friendsWs = new WebSocket(`${proto}//${host}/ws/friends`);
    } catch (e) {
      return;
    }

    friendsWs.onopen = () => {
      if (friendsPing) clearInterval(friendsPing);
      friendsPing = setInterval(() => {
        if (friendsWs && friendsWs.readyState === WebSocket.OPEN) {
          friendsWs.send(JSON.stringify({ type: "ping" }));
        }
      }, 25000);
    };

    friendsWs.onmessage = event => {
      try {
        const msg = JSON.parse(event.data);
        if (!msg || ["ping", "pong", "time", "onDisconnectAck"].includes(msg.event)) return;

        if (msg.event === "connected") {
          if (msg.data && typeof msg.data === "object") {
            Object.entries(msg.data).forEach(([id, friend]) => handleFriendRecord(id, friend, friendsInitialLoaded));
          }
          friendsInitialLoaded = true;
          return;
        }

        const parts = (msg.path || "").split("/").filter(Boolean);

        if (!parts.length) {
          if (msg.event === "delete" || msg.data === null) {
            userFriendsMap = {};
            updateFriendsBadge();
          } else if (typeof msg.data === "object" && msg.data) {
            Object.entries(msg.data).forEach(([id, friend]) => handleFriendRecord(id, friend, true));
          }
          return;
        }

        const chatId = parts[0];

        if (msg.event === "delete" || msg.data === null) {
          delete userFriendsMap[chatId];
          updateFriendsBadge();
        } else if (msg.event === "patch") {
          handleFriendRecord(chatId, { ...(userFriendsMap[chatId] || {}), ...(msg.data || {}) }, true);
        } else if (msg.event === "put") {
          handleFriendRecord(chatId, msg.data, true);
        }
      } catch (e) {}
    };

    friendsWs.onclose = () => {
      if (friendsPing) clearInterval(friendsPing);
      if (listenersAttached) setTimeout(initFriendsWebSocket, 3000);
    };
  }

  function listenPosts() {
    const key = safeKey(myNickname);
    return onChildAdded(ref(dbDefault, `notifications/${key}`), snap => {
      const data = snap.val();
      if (!data) return;

      remove(ref(dbDefault, `notifications/${key}/${snap.key}`)).catch(() => {});

      if (data.senderName === myNickname) return;

      notify({
        type: data.type || "comment",
        title: data.senderName,
        message: data.message || "",
        url: data.redirectUrl || "/posts",
        timestamp: data.timestamp || Date.now()
      });
    }, err => console.error("notifications error:", err));
  }

  function listenGroups() {
    return onValue(ref(dbGroups, `group_reply/${plainKey(myNickname)}`), snap => {
      const data = snap.val();
      const currentGroup = new URLSearchParams(location.search).get("group");
      const onGroupPage = location.pathname.includes("/chat/group.html");

      let changed = false;
      Object.keys(lastNotified).forEach(g => {
        const stale = !data || !data[g] || !(data[g].unreadCount > 0);
        if (stale && String(lastNotified[g]).startsWith("group_reply_")) {
          delete lastNotified[g];
          changed = true;
        }
      });
      if (changed) write("lastNotifiedMessages", lastNotified);

      if (!data) {
        window._lastRoomBadgeCount = 0;
        window.dispatchEvent(new CustomEvent("updateRoomBadge", { detail: 0 }));
        return;
      }

      let total = 0;

      Object.entries(data).forEach(([groupName, reply]) => {
        const unread = reply.unreadCount || 0;
        if (groupName !== currentGroup) total += unread;
        if ((onGroupPage && currentGroup === groupName) || !unread) return;

        const key = `group_reply_${groupName}_${unread}`;
        if (lastNotified[groupName] === key || flag("notificationOff")) return;

        lastNotified[groupName] = key;
        write("lastNotifiedMessages", lastNotified);

        notify({
          type: "group_mention",
          chatId: groupName,
          title: groupName,
          message: unread === 1 ? "1 new reply" : `${unread} new replies`,
          url: `/chat/group.html?group=${encodeURIComponent(groupName)}`
        });
      });

      window._lastRoomBadgeCount = total;
      window.dispatchEvent(new CustomEvent("updateRoomBadge", { detail: total }));
    }, err => console.error("group_reply error:", err));
  }

  function listenCalls() {
    const callPath = `calls/${plainKey(myNickname)}`;

    return onValue(ref(dbDefault, callPath), snap => {
      const call = snap.val();

      if (call && call.status === "calling" && call.receiver === myNickname) {
        if (ringing) return;
        ringing = true;

        const callType = call.type || "video";

        notify({
          type: "call",
          title: call.caller,
          message: `Incoming ${callType.charAt(0).toUpperCase() + callType.slice(1)} Call...`,
          onAccept: async () => {
            ringing = false;
            if (window.acceptIncomingCall) await window.acceptIncomingCall(call.caller, callType);
          },
          onDecline: async () => {
            ringing = false;
            await update(ref(dbDefault, callPath), { status: "rejected" });
            setTimeout(() => remove(ref(dbDefault, callPath)), 800);
          }
        });
        return;
      }

      if (!call || call.status === "ended" || call.status === "rejected") {
        if (ringing) {
          ringing = false;
          dismiss("call");
        }
        if (window.forceEndCallUI) window.forceEndCallUI();
        if (call) remove(ref(dbDefault, callPath));
      }
    }, err => console.error("calls error:", err));
  }

  function startListeners() {
    detachListeners();
    if (!myNickname || myNickname === "Guest") return;
    listenersAttached = true;

    fetch(`${baseUrl}/friends.json`)
      .then(r => r.json())
      .then(data => {
        if (data && typeof data === "object") {
          Object.entries(data).forEach(([id, friend]) => handleFriendRecord(id, friend, friendsInitialLoaded));
        }
        friendsInitialLoaded = true;
      })
      .catch(() => {});

    initFriendsWebSocket();

    unsubs.push(listenPosts(), listenGroups(), listenCalls());
  }

  window.addEventListener("nicknameUpdated", e => {
    myNickname = e.detail.nickname;
    userFriendsMap = {};
    friendsInitialLoaded = false;
    startListeners();
  });

  startListeners();
</script>
