<style>

  --voice-accent: #10b981;
  --voice-accent-hover: #059669;

}

#voiceRoomTriggerBtn {
  position: fixed;
  bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  right: 12px;
  width: 38px;
  height: 38px;
  background: var(--voice-accent);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 9998;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  border: none;
  padding: 0;
  color: #ffffff;
}
#voiceRoomTriggerBtn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.6);
  background: var(--voice-accent-hover);
}
#voiceRoomTriggerBtn:active { transform: scale(0.95); }
#voiceRoomTriggerBtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; }

#voiceRoomTriggerBtn.is-live::after {
  content: '';
  position: absolute;
  top: -2px;
  right: -2px;
  width: 10px;
  height: 10px;
  background: #22c55e;
  border-radius: 50%;
  border: 2px solid var(--dark-bg, #121212);
  box-shadow: 0 0 8px #22c55e;
  animation: voicePulse 1.8s infinite;
}
.light-mode #voiceRoomTriggerBtn.is-live::after { border-color: var(--light-bg, #f5f5f5); }
@keyframes voicePulse {
  0% { transform: scale(0.9); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.6; }
  100% { transform: scale(0.9); opacity: 1; }
}

.voice-modal-backdrop {
  position: fixed;
  inset: 0;
  height: 100%;
  height: 100dvh;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(4px);
  z-index: 20000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  overscroll-behavior: contain;
}
.voice-modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.voice-modal-container {
  width: 100%;
  max-width: 580px;
  height: 80%;
  max-height: 700px;
  background: var(--v-bg);
  color: var(--v-text);
  border-radius: 20px 20px 0 0;
  border: 1px solid var(--v-border);
  border-bottom: none;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.light-mode .voice-modal-container { box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18); }
.voice-modal-backdrop.open .voice-modal-container { transform: translateY(0); }

@media (min-width: 640px) {
  .voice-modal-backdrop { align-items: center; }
  .voice-modal-container {
    height: 75%;
    border-radius: 18px;
    border-bottom: 1px solid var(--v-border);
    transform: scale(0.95) translateY(20px);
  }
  .voice-modal-backdrop.open .voice-modal-container { transform: scale(1) translateY(0); }
}

.voice-modal-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--v-border);
  flex-shrink: 0;
}

.voice-modal-handle {
  width: 36px;
  height: 4px;
  background: var(--v-border);
  border-radius: 2px;
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
}

.voice-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--v-text);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.voice-count-tag {

  font-weight: 600;

}

.voice-close-btn {

  border: none;
  color: var(--v-text-dim);
  font-size: 18px;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;

}
.voice-close-btn:hover { background: var(--v-hover); color: var(--v-text); }

.voice-modal-body {

  display: flex;

}

.voice-members-list { display: flex; flex-direction: column; }

.voice-member-row {

.voice-member-row:hover { background: var(--v-hover); }

.voice-avatar {

.voice-avatar:hover {

}
.light-mode .voice-avatar {

.voice-member-info { flex: 1; min-width: 0; }

.voice-member-name-line {

.voice-member-status {

.voice-modal-backdrop svg.vi {

.voice-card-menu-btn {

.voice-card-menu-btn:hover { background: var(--v-btn-bg); color: var(--v-text); }

.voice-card-menu-item {

.voice-card-menu-item:hover { background: var(--v-hover); }
.voice-card-menu-item.danger { color: #ef4444; }

.voice-card-menu-item svg.vi { width: 18px; height: 18px; }

.voice-empty-state {

.voice-modal-footer {

}

.voice-join-btn {
  flex: 1;

  cursor: pointer;
  display: flex;

}
.voice-join-btn:hover { background: var(--voice-accent-hover); }
.voice-join-btn.leave-state {

.voice-join-btn.leave-state:hover { background: #ef4444; color: #fff; }

.voice-mic-btn {
  width: 46px;

  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;

}
.voice-mic-btn:hover { background: var(--v-btn-bg-hover); }
.voice-mic-btn.is-muted {
  background: rgba(239, 68, 68, 0.14);

}
.voice-mic-btn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

<div id="voiceAudioElementsContainer" style="display: none;"></div>

<script type="module">
import { getDatabase, ref, set, get, onChildAdded, onChildChanged, onChildRemoved, remove, push, onDisconnect } from "firebase/database";
import { getApps } from "firebase/app";

let voiceDb = null;
let currentRoom = null;
let currentNick = null;
let isJoined = false;
let isMuted = false;
let isModalOpen = false;
let savedScrollY = 0;
let membersData = {};
let mutedList = {};
let pendingRender = false;
let renderQueued = false;

let myPeer = null;
let myPeerId = null;
let localStream = null;
const activeCalls = {};

const ICON_MIC = `
  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
  <line x1="12" y1="19" x2="12" y2="22"/>`;
const ICON_MIC_OFF = `
  <line x1="2" y1="2" x2="22" y2="22"/>
  <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/>
  <path d="M5 10v2a7 7 0 0 0 12 5"/>
  <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"/>
  <path d="M9 9v3a3 3 0 0 0 5.12 2.12"/>
  <line x1="12" y1="19" x2="12" y2="22"/>`;
const ICON_KICK = `
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
  <circle cx="9" cy="7" r="4"/>
  <line x1="17" y1="8" x2="22" y2="13"/>
  <line x1="22" y1="8" x2="17" y2="13"/>`;
const ICON_BAN = `
  <circle cx="12" cy="12" r="10"/>
  <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>`;
const ICON_DOTS = `
  <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>`;

function getSafeKey(str) {
  if (!str) return 'guest';
  return str.replace(/[.#$\[\]\/]/g, '_');
}

function getGuestName() {
  try {
    let g = sessionStorage.getItem('voice_guest_name');
    if (!g) {
      g = 'Guest' + Math.floor(1000 + Math.random() * 9000);
      sessionStorage.setItem('voice_guest_name', g);
    }
    return g;
  } catch (e) {
    if (!getGuestName._fallback) getGuestName._fallback = 'Guest' + Math.floor(1000 + Math.random() * 9000);
    return getGuestName._fallback;
  }
}

function resolveNickname() {
  let nick = null;
  try { nick = localStorage.getItem('talkrush_nickname'); } catch (e) {}
  nick = (nick || '').trim();
  return nick || getGuestName();
}

function lockScroll() {
  savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${savedScrollY}px`;
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
}

function unlockScroll() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  document.body.style.overflow = '';
  window.scrollTo(0, savedScrollY);
}

function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    renderMembersList();
  });
}

function initVoiceRoom() {
  const backdrop = document.getElementById('voiceModalBackdrop');
  const triggerBtn = document.getElementById('voiceRoomTriggerBtn');
  const closeBtn = document.getElementById('closeVoiceModalBtn');
  const joinBtn = document.getElementById('voiceJoinLeaveBtn');
  const micBtn = document.getElementById('voiceMicToggleBtn');

  const urlParams = new URLSearchParams(window.location.search);
  currentRoom = urlParams.get('group');
  if (!currentRoom) return;

  currentNick = resolveNickname();
  window.addEventListener('nicknameUpdated', (e) => {
    if (isJoined) return;
    const n = e && e.detail && e.detail.nickname;
    currentNick = (n && n.trim()) ? n.trim() : getGuestName();
  });

  updateMicBtnUI();

  triggerBtn.addEventListener('click', () => {
    isModalOpen = true;
    lockScroll();
    backdrop.classList.add('open');
    renderMembersList();
  });

  const closeModal = () => {
    if (!isModalOpen) return;
    isModalOpen = false;
    backdrop.classList.remove('open');
    unlockScroll();
    closeAllCardMenus();
  };
  closeBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeModal();
  });

  joinBtn.addEventListener('click', async () => {
    if (!voiceDb) {
      if (window.AlertKit) AlertKit.warning("Please wait", "Connecting to server, try again in a moment.");
      return;
    }
    if (!isJoined) {
      await joinVoiceRoom();
    } else {
      await leaveVoiceRoom();
    }
  });

  micBtn.addEventListener('click', toggleLocalMic);

  setupFirebaseConnection();
}

function setupFirebaseConnection(tries = 0) {
  const apps = getApps();
  const app = apps.find(a => a.name === "TalkRushGroupApp");
  if (app) {
    voiceDb = getDatabase(app);
    bindStreams();
  } else if (tries < 40) {
    setTimeout(() => setupFirebaseConnection(tries + 1), 300);
  }
}

function bindStreams() {
  if (!voiceDb || !currentRoom) return;

  const membersRef = ref(voiceDb, `voice_rooms/${currentRoom}`);
  const mutedRef = ref(voiceDb, `groups/${currentRoom}/muted`);

  const handleMuteChange = (key, isMutedVal) => {
    if (isMutedVal === true) {
      mutedList[key] = true;
    } else {
      delete mutedList[key];
    }

    const myKey = getSafeKey(currentNick);
    if (isJoined && key === myKey && mutedList[myKey] === true && !isMuted) {
      isMuted = true;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => track.enabled = false);
      }
      set(ref(voiceDb, `voice_rooms/${currentRoom}/${myKey}/isMuted`), true);
      updateMicBtnUI();
      if (window.AlertKit) AlertKit.info("Muted", "Admin muted your microphone.");
    }
    scheduleRender();
  };

  onChildAdded(mutedRef, (snap) => handleMuteChange(snap.key, snap.val()));
  onChildChanged(mutedRef, (snap) => handleMuteChange(snap.key, snap.val()));
  onChildRemoved(mutedRef, (snap) => handleMuteChange(snap.key, false));

  onChildAdded(membersRef, (snap) => {
    const key = snap.key;
    const member = snap.val();
    if (!member || typeof member !== 'object') return;

    membersData[key] = member;
    const myKey = getSafeKey(currentNick);

    if (isJoined && myPeer && myPeerId && key !== myKey && member.peerId && !activeCalls[member.peerId]) {
      callPeer(member.peerId);
    }
    scheduleRender();
  });

  onChildChanged(membersRef, (snap) => {
    const key = snap.key;
    const member = snap.val();
    if (!member || typeof member !== 'object') return;

    const prevMember = membersData[key];
    if (prevMember && prevMember.peerId && prevMember.peerId !== member.peerId) {
      try { activeCalls[prevMember.peerId]?.close(); } catch (e) {}
      removeAudioElement(prevMember.peerId);
    }

    membersData[key] = member;
    const myKey = getSafeKey(currentNick);

    if (isJoined && myPeer && myPeerId && key !== myKey && member.peerId && !activeCalls[member.peerId]) {
      callPeer(member.peerId);
    }
    scheduleRender();
  });

  onChildRemoved(membersRef, (snap) => {
    const key = snap.key;
    const removedMember = membersData[key] || snap.val();
    delete membersData[key];

    if (removedMember && removedMember.peerId) {
      try { activeCalls[removedMember.peerId]?.close(); } catch (e) {}
      removeAudioElement(removedMember.peerId);
    }

    const myKey = getSafeKey(currentNick);
    if (isJoined && myPeerId && key === myKey) {
      leaveVoiceRoom(true);
    }
    scheduleRender();
  });
}

async function joinVoiceRoom() {
  if (!window.Peer) {
    if (window.AlertKit) AlertKit.error("Voice Unavailable", "Voice library not loaded. Please refresh.");
    return;
  }

  currentNick = resolveNickname();
  const myKey = getSafeKey(currentNick);

  try {
    const banSnap = await get(ref(voiceDb, `groups/${currentRoom}/banned/${myKey}`));
    if (banSnap.exists() && banSnap.val() === true) {
      if (window.AlertKit) AlertKit.error("Banned", "You are banned from this room.");
      return;
    }
  } catch (e) {}

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (err) {
    if (window.AlertKit) AlertKit.error("Microphone Blocked", "Please allow microphone access to talk.");
    return;
  }

  isJoined = true;
  isMuted = false;

  if (mutedList[myKey] === true) {
    isMuted = true;
    localStream.getAudioTracks().forEach(t => t.enabled = false);
  }

  initPeerJS(myKey);

  document.getElementById('voiceMicToggleBtn').style.display = 'flex';
  document.getElementById('voiceJoinBtnText').textContent = 'Leave Audio Room';
  document.getElementById('voiceJoinLeaveBtn').classList.add('leave-state');
  updateMicBtnUI();
}

function initPeerJS(myKey) {
  myPeer = new Peer();

  myPeer.on('open', async (id) => {
    myPeerId = id;
    const memberRef = ref(voiceDb, `voice_rooms/${currentRoom}/${myKey}`);
    await set(memberRef, {
      nickname: currentNick,
      peerId: id,
      joinedAt: Date.now(),
      isMuted: isMuted
    });
    onDisconnect(memberRef).remove();

    Object.entries(membersData).forEach(([k, member]) => {
      if (k !== myKey && member && member.peerId) {
        callPeer(member.peerId);
      }
    });
  });

  myPeer.on('call', (incomingCall) => {
    incomingCall.answer(localStream);
    incomingCall.on('stream', (remoteStream) => {
      playRemoteStream(incomingCall.peer, remoteStream);
    });
    activeCalls[incomingCall.peer] = incomingCall;

    incomingCall.on('close', () => removeAudioElement(incomingCall.peer));
  });

  myPeer.on('error', (err) => {
    console.error("PeerJS Error:", err);
  });
}

function callPeer(remotePeerId) {
  if (!myPeer || !localStream || activeCalls[remotePeerId]) return;
  const call = myPeer.call(remotePeerId, localStream);
  if (!call) return;

  call.on('stream', (remoteStream) => {
    playRemoteStream(remotePeerId, remoteStream);
  });
  call.on('close', () => removeAudioElement(remotePeerId));
  call.on('error', () => removeAudioElement(remotePeerId));
  activeCalls[remotePeerId] = call;
}

function playRemoteStream(peerId, stream) {
  let audioEl = document.getElementById(`audio_${peerId}`);
  if (!audioEl) {
    audioEl = document.createElement('audio');
    audioEl.id = `audio_${peerId}`;
    audioEl.autoplay = true;
    audioEl.playsInline = true;
    document.getElementById('voiceAudioElementsContainer').appendChild(audioEl);
  }
  audioEl.srcObject = stream;
  const p = audioEl.play();
  if (p && p.catch) p.catch(() => {});
}

function removeAudioElement(peerId) {
  const audioEl = document.getElementById(`audio_${peerId}`);
  if (audioEl) audioEl.remove();
  if (activeCalls[peerId]) {
    delete activeCalls[peerId];
  }
}

async function leaveVoiceRoom(alreadyRemoved = false) {
  const myKey = getSafeKey(currentNick);
  isJoined = false;
  isMuted = false;
  myPeerId = null;

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  Object.values(activeCalls).forEach(call => { try { call.close(); } catch (e) {} });
  for (let k in activeCalls) delete activeCalls[k];

  if (myPeer) {
    myPeer.destroy();
    myPeer = null;
  }

  document.getElementById('voiceAudioElementsContainer').innerHTML = '';
  if (!alreadyRemoved) {
    try { await remove(ref(voiceDb, `voice_rooms/${currentRoom}/${myKey}`)); } catch (e) {}
  }

  document.getElementById('voiceMicToggleBtn').style.display = 'none';
  document.getElementById('voiceJoinBtnText').textContent = 'Join Audio Room';
  document.getElementById('voiceJoinLeaveBtn').classList.remove('leave-state');
}

function toggleLocalMic() {
  if (!isJoined || !localStream) return;
  const myKey = getSafeKey(currentNick);

  if (mutedList[myKey] === true) {
    if (window.AlertKit) AlertKit.warning("Muted by Admin", "Admin has muted your microphone.");
    return;
  }

  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(track => {
    track.enabled = !isMuted;
  });

  set(ref(voiceDb, `voice_rooms/${currentRoom}/${myKey}/isMuted`), isMuted);
  updateMicBtnUI();
}

function updateMicBtnUI() {
  const micBtn = document.getElementById('voiceMicToggleBtn');
  const micSvg = document.getElementById('voiceMicSvg');
  if (!micBtn || !micSvg) return;

  micBtn.classList.toggle('is-muted', isMuted);
  micSvg.innerHTML = isMuted ? ICON_MIC_OFF : ICON_MIC;
}

function renderMembersList() {
  const list = document.getElementById('voiceMembersList');
  const emptyState = document.getElementById('voiceEmptyState');
  const countTag = document.getElementById('voiceCountTag');
  const triggerBtn = document.getElementById('voiceRoomTriggerBtn');
  if (!list) return;

  const entries = Object.entries(membersData)
    .filter(([, m]) => m && typeof m === 'object' && m.nickname)
    .sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  const count = entries.length;

  countTag.textContent = `${count} online`;
  triggerBtn.classList.toggle('is-live', count > 0);

  if (document.querySelector('.voice-card-menu.open')) {
    pendingRender = true;
    return;
  }
  pendingRender = false;

  list.innerHTML = '';

  if (count === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  const groupAdminNick = window.groupAdminNickname || null;
  const isAdmin = !!groupAdminNick && currentNick === groupAdminNick;

  entries.forEach(([key, member]) => {
    const name = member.nickname || 'Guest';
    const cleanName = name.startsWith('TR|') ? name.substring(3) : name;
    const initial = (cleanName.charAt(0) || '?').toUpperCase();
    const isMe = name === currentNick;
    const isAdminMuted = mutedList[key] === true;
    const isMemberMuted = !!member.isMuted || isAdminMuted;
    const isMemberAdmin = !!groupAdminNick && name === groupAdminNick;

    const state = isMemberMuted ? 'muted' : 'idle';
    const subText = isMemberMuted ? (isAdminMuted ? 'Muted by admin' : 'Muted') : 'Listening';
    const statusIcon = isMemberMuted ? ICON_MIC_OFF : ICON_MIC;
    const profileUrl = `/profile.html?id=${encodeURIComponent(name)}`;

    const row = document.createElement('div');
    row.className = 'voice-member-row';

    let menuHtml = '';
    if (isAdmin && !isMe) {
      menuHtml = `
        <button type="button" class="voice-card-menu-btn" data-action="toggle-card-menu" title="Actions">
          <svg viewBox="0 0 24 24">${ICON_DOTS}</svg>
        </button>
        <div class="voice-card-menu">
          <button type="button" class="voice-card-menu-item" data-action="voice-mute" data-user="${escapeAttr(name)}">
            <svg class="vi" viewBox="0 0 24 24">${isAdminMuted ? ICON_MIC : ICON_MIC_OFF}</svg>
            <span>${isAdminMuted ? 'Unmute Mic' : 'Mute Mic'}</span>
          </button>
          <button type="button" class="voice-card-menu-item danger" data-action="voice-kick" data-user="${escapeAttr(name)}">
            <svg class="vi" viewBox="0 0 24 24">${ICON_KICK}</svg>
            <span>Kick User</span>
          </button>
          <button type="button" class="voice-card-menu-item danger" data-action="voice-ban" data-user="${escapeAttr(name)}">
            <svg class="vi" viewBox="0 0 24 24">${ICON_BAN}</svg>
            <span>Ban User</span>
          </button>
        </div>
      `;
    }

    row.innerHTML = `
      <div class="voice-avatar" onclick="window.location.href='${profileUrl}'" title="View Profile">${escapeHtml(initial)}</div>
      <div class="voice-member-info">
        <div class="voice-member-name-line">
          <span class="voice-user-name" onclick="window.location.href='${profileUrl}'" title="View ${escapeAttr(name)}'s Profile">${escapeHtml(name)}</span>
          ${isMe ? '<span class="voice-tag you">You</span>' : ''}
          ${isMemberAdmin ? '<span class="voice-tag owner">Owner</span>' : ''}
        </div>
        <div class="voice-member-sub ${state}">${subText}</div>
      </div>
      <div class="voice-member-status ${state}">
        <svg class="vi" viewBox="0 0 24 24">${statusIcon}</svg>
      </div>
      ${menuHtml}
    `;

    list.appendChild(row);
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function closeAllCardMenus(flush = true) {
  document.querySelectorAll('.voice-card-menu.open').forEach(menu => menu.classList.remove('open'));
  if (flush && pendingRender) renderMembersList();
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.voice-member-row [data-action]');

  if (!btn) {
    if (!e.target.closest('.voice-card-menu')) closeAllCardMenus();
    return;
  }

  const action = btn.getAttribute('data-action');

  if (action === 'toggle-card-menu') {
    const menu = btn.nextElementSibling;
    const wasOpen = menu.classList.contains('open');
    closeAllCardMenus(false);
    if (!wasOpen) {
      menu.classList.remove('up');
      menu.classList.add('open');
      const body = document.getElementById('voiceModalBody');
      if (menu.getBoundingClientRect().bottom > body.getBoundingClientRect().bottom) {
        menu.classList.add('up');
      }
    } else if (pendingRender) {
      renderMembersList();
    }
    return;
  }

  const targetUser = btn.getAttribute('data-user');
  closeAllCardMenus();
  if (!voiceDb || !currentRoom) return;
  if (!targetUser) return;
  const targetKey = getSafeKey(targetUser);

  if (action === 'voice-mute') {
    const isCurrentlyMuted = mutedList[targetKey] === true;
    await set(ref(voiceDb, `groups/${currentRoom}/muted/${targetKey}`), !isCurrentlyMuted);
    if (window.AlertKit) AlertKit.toast(`${targetUser} ${!isCurrentlyMuted ? 'muted' : 'unmuted'}`, "info");
  } 
  else if (action === 'voice-kick') {
    const isConfirm = window.AlertKit ? await AlertKit.confirm("Kick User?", `Kick ${targetUser} out of room?`, "Yes, Kick", "Cancel") : confirm(`Kick ${targetUser}?`);
    if (isConfirm) {
      const cmdRef = push(ref(voiceDb, `groups/${currentRoom}/commands`));
      await set(cmdRef, { type: 'kick', target: targetUser, timestamp: Date.now() });
      setTimeout(() => remove(cmdRef), 5000);
      await remove(ref(voiceDb, `voice_rooms/${currentRoom}/${targetKey}`));
      if (window.AlertKit) AlertKit.toast(`Kicked ${targetUser}`, "warning");
    }
  } 
  else if (action === 'voice-ban') {
    const isConfirm = window.AlertKit ? await AlertKit.confirm("Permanently Ban?", `Ban ${targetUser} from this room?`, "Yes, Ban", "Cancel") : confirm(`Ban ${targetUser}?`);
    if (isConfirm) {
      await set(ref(voiceDb, `groups/${currentRoom}/banned/${targetKey}`), true);
      await remove(ref(voiceDb, `voice_rooms/${currentRoom}/${targetKey}`));
      if (window.AlertKit) AlertKit.toast(`Permanently banned ${targetUser}`, "error");
    }
  }
});

window.addEventListener('beforeunload', () => {
  if (isJoined && voiceDb && currentRoom) {
    const myKey = getSafeKey(currentNick);
    remove(ref(voiceDb, `voice_rooms/${currentRoom}/${myKey}`));
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (myPeer) myPeer.destroy();
  }
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  initVoiceRoom();
} else {
  document.addEventListener('DOMContentLoaded', initVoiceRoom);
}
</script>
