<style>
:root {
  --voice-accent: #10b981;
  --voice-accent-hover: #059669;
  --voice-accent-dim: rgba(16, 185, 129, 0.15);
  --voice-accent-border: rgba(16, 185, 129, 0.3);
}

#voiceRoomTriggerBtn {
  position: fixed;
  bottom: calc(108px + env(safe-area-inset-bottom, 0px));
  left: 12px;
  width: 38px;
  height: 38px;
  background: var(--voice-accent);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 9998;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.45);
  transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  border: none;
  padding: 0;
  color: #ffffff;
}
#voiceRoomTriggerBtn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.6);
  background: var(--voice-accent-hover);
}
#voiceRoomTriggerBtn:active { transform: scale(0.95); }
#voiceRoomTriggerBtn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; }

#voiceRoomTriggerBtn.is-live::after {
  content: '';
  position: absolute;
  top: -2px;
  right: -2px;
  width: 10px;
  height: 10px;
  background: #22c55e;
  border-radius: 50%;
  border: 2px solid var(--dark-bg, #121212);
  box-shadow: 0 0 8px #22c55e;
  animation: voicePulse 1.8s infinite;
}
@keyframes voicePulse {
  0% { transform: scale(0.9); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.6; }
  100% { transform: scale(0.9); opacity: 1; }
}

.voice-modal-backdrop {
  position: fixed;
  inset: 0;
  height: 100%;
  height: 100dvh;
  background: rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(4px);
  z-index: 20000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  overscroll-behavior: contain;
}
.voice-modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.voice-modal-container {
  width: 100%;
  max-width: 580px;
  height: 80%;
  max-height: 700px;
  background: var(--dark-card, #1a1a1e);
  border-radius: 20px 20px 0 0;
  border: 1px solid var(--dark-border2, rgba(255,255,255,0.08));
  border-bottom: none;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.light-mode .voice-modal-container {
  background: var(--light-surface, #ffffff);
  border-color: var(--light-border2, rgba(0,0,0,0.1));
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);
}
.voice-modal-backdrop.open .voice-modal-container { transform: translateY(0); }

@media (min-width: 640px) {
  .voice-modal-backdrop { align-items: center; }
  .voice-modal-container {
    height: 75%;
    border-radius: 18px;
    border-bottom: 1px solid var(--dark-border2, rgba(255,255,255,0.08));
    transform: scale(0.95) translateY(20px);
  }
  .voice-modal-backdrop.open .voice-modal-container { transform: scale(1) translateY(0); }
}

.voice-modal-header {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--dark-border2, rgba(255,255,255,0.08));
  flex-shrink: 0;
}
.light-mode .voice-modal-header { border-color: var(--light-border2, rgba(0,0,0,0.1)); }

.voice-modal-handle {
  width: 36px;
  height: 4px;
  background: var(--dark-border2, rgba(255,255,255,0.12));
  border-radius: 2px;
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
}

.voice-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--dark-text, #fff);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.light-mode .voice-title { color: var(--light-text, #111); }

.voice-count-tag {
  font-size: 11px;
  font-weight: 600;
  background: var(--voice-accent-dim);
  color: var(--voice-accent);
  padding: 2px 7px;
  border-radius: 12px;
  border: 0.5px solid var(--voice-accent-border);
}

.voice-close-btn {
  background: none;
  border: none;
  color: var(--dark-icon-color, #ccc);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.voice-close-btn:hover { background: var(--dark-icon-hover-bg, rgba(255,255,255,0.1)); }
.light-mode .voice-close-btn { color: var(--light-icon-color, #666); }

.voice-modal-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.voice-members-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 12px;
}

.voice-member-card {
  background: var(--dark-surface, #111114);
  border: 1px solid var(--dark-border2, rgba(255,255,255,0.06));

.light-mode .voice-member-card {

  border-color: var(--light-border2, rgba(0,0,0,0.08));
}
.voice-member-card.is-speaking {

}

.voice-card-menu-btn {

  padding: 4px;
  border-radius: 6px;

}
.voice-card-menu-btn:hover {

}
.voice-card-menu-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }

.voice-avatar-wrap {

}

.voice-avatar-circle {

  height: 100%;

}

.voice-status-icon {

.voice-status-icon.muted { background: #ef4444; border-color: #dc2626; }

.voice-user-name {

.voice-user-badge {

}

.voice-empty-state {

}

.voice-modal-footer {
  border-top: 1px solid var(--dark-border2, rgba(255,255,255,0.08));

}
.light-mode .voice-modal-footer {

}

.voice-join-btn {

  padding: 11px 16px;

  cursor: pointer;
  display: flex;

  justify-content: center;

}
.voice-join-btn:hover { background: var(--voice-accent-hover); }
.voice-join-btn.leave-state {

.voice-join-btn.leave-state:hover { background: #ef4444; color: #fff; }

.voice-mic-btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--dark-border2, rgba(255,255,255,0.1));
  background: var(--dark-input-bg, rgba(255,255,255,0.08));
  color: var(--dark-text, #fff);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.voice-mic-btn:hover { background: rgba(255,255,255,0.14); }
.voice-mic-btn.is-muted {
  background: rgba(239, 68, 68, 0.15);
  color: #ef4444;
  border-color: rgba(239, 68, 68, 0.3);
}
.voice-mic-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; }

.voice-card-menu {
  display: none;
  position: absolute;
  top: 30px;
  right: 6px;
  background: var(--dark-surface, #111114);
  border: 1px solid var(--dark-border2, rgba(255,255,255,0.12));
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 10;

  overflow: hidden;
}
.light-mode .voice-card-menu {
  background: var(--light-surface, #ffffff);
  border-color: var(--light-border2, rgba(0,0,0,0.12));
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}
.voice-card-menu.open { display: block; }
.voice-card-menu-item {
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--dark-text, #fff);
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
}
.light-mode .voice-card-menu-item { color: var(--light-text, #222); }
.voice-card-menu-item:hover { background: rgba(255,255,255,0.08); }
.voice-card-menu-item.danger { color: #ef4444; }
.voice-card-menu-item.danger:hover { background: rgba(239,68,68,0.12); }
.voice-card-menu-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; }
</style>

<script type="module">
import { getDatabase, ref, set, get, onValue, remove, push, onDisconnect } from "firebase/database";
import { getApps } from "firebase/app";

let voiceDb = null;
let currentRoom = null;
let currentNick = null;
let isJoined = false;
let isMuted = false;
let isModalOpen = false;
let savedScrollY = 0;
let membersData = {};
let mutedList = {};

let myPeer = null;
let myPeerId = null;
let localStream = null;
const activeCalls = {};
let speechAudioContext = null;

function getSafeKey(str) {
  if (!str) return 'guest';
  return str.replace(/[.#$\[\]\/]/g, '_');
}

function getGuestName() {
  try {
    let g = sessionStorage.getItem('voice_guest_name');
    if (!g) {
      g = 'Guest' + Math.floor(1000 + Math.random() * 9000);
      sessionStorage.setItem('voice_guest_name', g);
    }
    return g;
  } catch (e) {
    if (!getGuestName._fallback) getGuestName._fallback = 'Guest' + Math.floor(1000 + Math.random() * 9000);
    return getGuestName._fallback;
  }
}

function resolveNickname() {
  let nick = null;
  try { nick = localStorage.getItem('talkrush_nickname'); } catch (e) {}
  nick = (nick || '').trim();
  return nick || getGuestName();
}

function lockScroll() {
  savedScrollY = window.scrollY || document.documentElement.scrollTop || 0;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${savedScrollY}px`;
  document.body.style.width = '100%';
  document.body.style.overflow = 'hidden';
}

function unlockScroll() {
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.width = '';
  document.body.style.overflow = '';
  window.scrollTo(0, savedScrollY);
}

function initVoiceRoom() {
  const backdrop = document.getElementById('voiceModalBackdrop');
  const triggerBtn = document.getElementById('voiceRoomTriggerBtn');
  const closeBtn = document.getElementById('closeVoiceModalBtn');
  const joinBtn = document.getElementById('voiceJoinLeaveBtn');
  const micBtn = document.getElementById('voiceMicToggleBtn');

  const urlParams = new URLSearchParams(window.location.search);
  currentRoom = urlParams.get('group');
  if (!currentRoom) return;

  currentNick = resolveNickname();
  window.addEventListener('nicknameUpdated', (e) => {
    if (isJoined) return;
    const n = e && e.detail && e.detail.nickname;
    currentNick = (n && n.trim()) ? n.trim() : getGuestName();
  });

  triggerBtn.addEventListener('click', () => {
    isModalOpen = true;
    lockScroll();
    backdrop.classList.add('open');
    renderMembersList();
  });

  const closeModal = () => {
    if (!isModalOpen) return;
    isModalOpen = false;
    backdrop.classList.remove('open');
    unlockScroll();
    closeAllCardMenus();
  };
  closeBtn.addEventListener('click', closeModal);
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) closeModal();
  });

  joinBtn.addEventListener('click', async () => {
    if (!voiceDb) {
      if (window.AlertKit) AlertKit.warning("Please wait", "Connecting to server, try again in a moment.");
      return;
    }
    if (!isJoined) {
      await joinVoiceRoom();
    } else {
      await leaveVoiceRoom();
    }
  });

  micBtn.addEventListener('click', toggleLocalMic);

  setupFirebaseConnection();
}

function setupFirebaseConnection(tries = 0) {
  const apps = getApps();
  const app = apps.find(a => a.name === "TalkRushGroupApp");
  if (app) {
    voiceDb = getDatabase(app);
    bindStreams();
  } else if (tries < 40) {
    setTimeout(() => setupFirebaseConnection(tries + 1), 300);
  }
}

function bindStreams() {
  if (!voiceDb || !currentRoom) return;

  const membersRef = ref(voiceDb, `voice_rooms/${currentRoom}/members`);
  const mutedRef = ref(voiceDb, `voice_rooms/${currentRoom}/muted`);

  onValue(mutedRef, (snap) => {
    mutedList = snap.val() || {};
    const myKey = getSafeKey(currentNick);
    if (isJoined && mutedList[myKey] === true && !isMuted) {
      isMuted = true;
      if (localStream) {
        localStream.getAudioTracks().forEach(track => track.enabled = false);
      }
      set(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}/isMuted`), true);
      set(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}/isSpeaking`), false);
      updateMicBtnUI();
      if (window.AlertKit) AlertKit.info("Muted", "Admin muted your microphone.");
    }
    renderMembersList();
  });

  onValue(membersRef, (snap) => {
    const newMembers = snap.val() || {};
    const myKey = getSafeKey(currentNick);

    const livePeerIds = new Set(Object.values(newMembers).map(m => m && m.peerId).filter(Boolean));
    Object.keys(activeCalls).forEach(pid => {
      if (!livePeerIds.has(pid)) {
        try { activeCalls[pid].close(); } catch (e) {}
        removeAudioElement(pid);
      }
    });

    if (isJoined && myPeer && myPeerId) {
      Object.entries(newMembers).forEach(([key, member]) => {
        if (key !== myKey && member && member.peerId && !activeCalls[member.peerId]) {
          callPeer(member.peerId);
        }
      });
    }

    if (isJoined && myPeerId && !newMembers[myKey]) {
      leaveVoiceRoom(true);
    }

    membersData = newMembers;
    renderMembersList();
  });
}

async function joinVoiceRoom() {
  if (!window.Peer) {
    if (window.AlertKit) AlertKit.error("Voice Unavailable", "Voice library not loaded. Please refresh.");
    return;
  }

  currentNick = resolveNickname();
  const myKey = getSafeKey(currentNick);

  try {
    const banSnap = await get(ref(voiceDb, `groups/${currentRoom}/banned/${myKey}`));
    if (banSnap.exists() && banSnap.val() === true) {
      if (window.AlertKit) AlertKit.error("Banned", "You are banned from this room.");
      return;
    }
  } catch (e) {}

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (err) {
    if (window.AlertKit) AlertKit.error("Microphone Blocked", "Please allow microphone access to talk.");
    return;
  }

  isJoined = true;
  isMuted = false;

  if (mutedList[myKey] === true) {
    isMuted = true;
    localStream.getAudioTracks().forEach(t => t.enabled = false);
  }

  setupAudioLevelDetection(localStream, myKey);
  initPeerJS(myKey);

  document.getElementById('voiceMicToggleBtn').style.display = 'flex';
  document.getElementById('voiceJoinBtnText').textContent = 'Leave Audio Room';
  document.getElementById('voiceJoinLeaveBtn').classList.add('leave-state');
  updateMicBtnUI();
}

function initPeerJS(myKey) {
  myPeer = new Peer();

  myPeer.on('open', async (id) => {
    myPeerId = id;
    const memberRef = ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}`);
    await set(memberRef, {
      nickname: currentNick,
      peerId: id,
      joinedAt: Date.now(),
      isMuted: isMuted,
      isSpeaking: false
    });
    onDisconnect(memberRef).remove();

    Object.entries(membersData).forEach(([k, member]) => {
      if (k !== myKey && member && member.peerId) {
        callPeer(member.peerId);
      }
    });
  });

  myPeer.on('call', (incomingCall) => {
    incomingCall.answer(localStream);
    incomingCall.on('stream', (remoteStream) => {
      playRemoteStream(incomingCall.peer, remoteStream);
    });
    activeCalls[incomingCall.peer] = incomingCall;

    incomingCall.on('close', () => removeAudioElement(incomingCall.peer));
  });

  myPeer.on('error', (err) => {
    console.error("PeerJS Error:", err);
  });
}

function callPeer(remotePeerId) {
  if (!myPeer || !localStream || activeCalls[remotePeerId]) return;
  const call = myPeer.call(remotePeerId, localStream);
  if (!call) return;

  call.on('stream', (remoteStream) => {
    playRemoteStream(remotePeerId, remoteStream);
  });
  call.on('close', () => removeAudioElement(remotePeerId));
  call.on('error', () => removeAudioElement(remotePeerId));
  activeCalls[remotePeerId] = call;
}

function playRemoteStream(peerId, stream) {
  let audioEl = document.getElementById(`audio_${peerId}`);
  if (!audioEl) {
    audioEl = document.createElement('audio');
    audioEl.id = `audio_${peerId}`;
    audioEl.autoplay = true;
    audioEl.playsInline = true;
    document.getElementById('voiceAudioElementsContainer').appendChild(audioEl);
  }
  audioEl.srcObject = stream;
  const p = audioEl.play();
  if (p && p.catch) p.catch(() => {});
}

function removeAudioElement(peerId) {
  const audioEl = document.getElementById(`audio_${peerId}`);
  if (audioEl) audioEl.remove();
  if (activeCalls[peerId]) {
    delete activeCalls[peerId];
  }
}

async function leaveVoiceRoom(alreadyRemoved = false) {
  const myKey = getSafeKey(currentNick);
  isJoined = false;
  isMuted = false;
  myPeerId = null;

  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }

  if (speechAudioContext) {
    speechAudioContext.close().catch(() => {});
    speechAudioContext = null;
  }

  Object.values(activeCalls).forEach(call => { try { call.close(); } catch (e) {} });
  for (let k in activeCalls) delete activeCalls[k];

  if (myPeer) {
    myPeer.destroy();
    myPeer = null;
  }

  document.getElementById('voiceAudioElementsContainer').innerHTML = '';
  if (!alreadyRemoved) {
    try { await remove(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}`)); } catch (e) {}
  }

  document.getElementById('voiceMicToggleBtn').style.display = 'none';
  document.getElementById('voiceJoinBtnText').textContent = 'Join Audio Room';
  document.getElementById('voiceJoinLeaveBtn').classList.remove('leave-state');
}

function toggleLocalMic() {
  if (!isJoined || !localStream) return;
  const myKey = getSafeKey(currentNick);

  if (mutedList[myKey] === true) {
    if (window.AlertKit) AlertKit.warning("Muted by Admin", "Admin has muted your microphone.");
    return;
  }

  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(track => {
    track.enabled = !isMuted;
  });

  set(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}/isMuted`), isMuted);
  if (isMuted) set(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}/isSpeaking`), false);
  updateMicBtnUI();
}

function updateMicBtnUI() {
  const micBtn = document.getElementById('voiceMicToggleBtn');
  const micSvg = document.getElementById('voiceMicSvg');
  if (!micBtn) return;

  if (isMuted) {
    micBtn.classList.add('is-muted');
    micSvg.innerHTML = `
      <line x1="2" y1="2" x2="22" y2="22"></line>
      <path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path>
      <path d="M5 10v2a7 7 0 0 0 12 5"></path>
      <path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path>
      <path d="M9 9v3a3 3 0 0 0 5.12 2.12"></path>
      <line x1="12" y1="19" x2="12" y2="22"></line>
    `;
  } else {
    micBtn.classList.remove('is-muted');
    micSvg.innerHTML = `
      <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
      <line x1="12" y1="19" x2="12" y2="22"></line>
    `;
  }
}

function setupAudioLevelDetection(stream, myKey) {
  try {
    speechAudioContext = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = speechAudioContext.createAnalyser();
    const microphone = speechAudioContext.createMediaStreamSource(stream);
    const javascriptNode = speechAudioContext.createScriptProcessor(2048, 1, 1);

    analyser.smoothingTimeConstant = 0.8;
    analyser.fftSize = 1024;

    microphone.connect(analyser);
    analyser.connect(javascriptNode);
    javascriptNode.connect(speechAudioContext.destination);

    let lastSpeaking = false;
    javascriptNode.onaudioprocess = () => {
      if (!isJoined || isMuted) return;
      const array = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(array);
      let values = 0;
      for (let i = 0; i < array.length; i++) values += array[i];
      const average = values / array.length;
      const isSpeaking = average > 25;

      if (isSpeaking !== lastSpeaking) {
        lastSpeaking = isSpeaking;
        set(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}/isSpeaking`), isSpeaking);
      }
    };
  } catch (e) {}
}

function renderMembersList() {
  const grid = document.getElementById('voiceMembersGrid');
  const emptyState = document.getElementById('voiceEmptyState');
  const countTag = document.getElementById('voiceCountTag');
  const triggerBtn = document.getElementById('voiceRoomTriggerBtn');
  if (!grid) return;

  grid.innerHTML = '';
  const entries = Object.entries(membersData);
  const count = entries.length;

  countTag.textContent = `${count} online`;
  triggerBtn.classList.toggle('is-live', count > 0);

  if (count === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  const groupAdminNick = window.groupAdminNickname || null;
  const isAdmin = !!groupAdminNick && currentNick === groupAdminNick;

  entries.forEach(([key, member]) => {
    const card = document.createElement('div');
    card.className = `voice-member-card ${member.isSpeaking ? 'is-speaking' : ''}`;

    const isMemberMuted = member.isMuted || mutedList[key] === true;
    const initial = (member.nickname || 'G').charAt(0).toUpperCase();
    const isMemberAdmin = member.nickname === groupAdminNick;

    let menuHtml = '';
    if (isAdmin && member.nickname !== currentNick) {
      menuHtml = `
        <button type="button" class="voice-card-menu-btn" data-action="toggle-card-menu" title="Actions">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
        <div class="voice-card-menu">
          <button type="button" class="voice-card-menu-item" data-action="voice-mute" data-user="${escapeAttr(member.nickname)}">
            <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
            <span>${mutedList[key] ? 'Unmute Mic' : 'Mute Mic'}</span>
          </button>
          <button type="button" class="voice-card-menu-item danger" data-action="voice-kick" data-user="${escapeAttr(member.nickname)}">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="18" y1="8" x2="23" y2="13"/><line x1="23" y1="8" x2="18" y2="13"/></svg>
            <span>Kick User</span>
          </button>
          <button type="button" class="voice-card-menu-item danger" data-action="voice-ban" data-user="${escapeAttr(member.nickname)}">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
            <span>Ban User</span>
          </button>
        </div>
      `;
    }

    card.innerHTML = `
      ${menuHtml}
      <div class="voice-avatar-wrap">
        <div class="voice-avatar-circle">${escapeHtml(initial)}</div>
        <div class="voice-status-icon ${isMemberMuted ? 'muted' : (member.isSpeaking ? 'speaking' : '')}">
          ${isMemberMuted ? `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="2" y1="2" x2="22" y2="22"/><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"/></svg>
          ` : `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
          `}
        </div>
      </div>
      <div class="voice-user-name" title="${escapeAttr(member.nickname)}">${escapeHtml(member.nickname)}</div>
      ${isMemberAdmin ? '<div class="voice-user-badge">Owner</div>' : ''}
    `;

    grid.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

function closeAllCardMenus() {
  document.querySelectorAll('.voice-card-menu.open').forEach(menu => menu.classList.remove('open'));
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.voice-member-card [data-action]');

  if (!btn) {
    if (!e.target.closest('.voice-card-menu')) closeAllCardMenus();
    return;
  }

  const action = btn.getAttribute('data-action');

  if (action === 'toggle-card-menu') {
    const menu = btn.nextElementSibling;
    const wasOpen = menu.classList.contains('open');
    closeAllCardMenus();
    if (!wasOpen) menu.classList.add('open');
    return;
  }

  closeAllCardMenus();
  if (!voiceDb || !currentRoom) return;

  const targetUser = btn.getAttribute('data-user');
  if (!targetUser) return;
  const targetKey = getSafeKey(targetUser);

  if (action === 'voice-mute') {
    const isCurrentlyMuted = mutedList[targetKey] === true;
    await set(ref(voiceDb, `voice_rooms/${currentRoom}/muted/${targetKey}`), !isCurrentlyMuted);
    if (window.AlertKit) AlertKit.toast(`${targetUser} ${!isCurrentlyMuted ? 'muted' : 'unmuted'}`, "info");
  } 
  else if (action === 'voice-kick') {
    const isConfirm = window.AlertKit ? await AlertKit.confirm("Kick User?", `Kick ${targetUser} out of room?`, "Yes, Kick", "Cancel") : confirm(`Kick ${targetUser}?`);
    if (isConfirm) {
      const cmdRef = push(ref(voiceDb, `groups/${currentRoom}/commands`));
      await set(cmdRef, { type: 'kick', target: targetUser, timestamp: Date.now() });
      setTimeout(() => remove(cmdRef), 5000);
      await remove(ref(voiceDb, `voice_rooms/${currentRoom}/members/${targetKey}`));
      if (window.AlertKit) AlertKit.toast(`Kicked ${targetUser}`, "warning");
    }
  } 
  else if (action === 'voice-ban') {
    const isConfirm = window.AlertKit ? await AlertKit.confirm("Permanently Ban?", `Ban ${targetUser} from this room?`, "Yes, Ban", "Cancel") : confirm(`Ban ${targetUser}?`);
    if (isConfirm) {
      await set(ref(voiceDb, `groups/${currentRoom}/banned/${targetKey}`), true);
      await remove(ref(voiceDb, `voice_rooms/${currentRoom}/members/${targetKey}`));
      if (window.AlertKit) AlertKit.toast(`Permanently banned ${targetUser}`, "error");
    }
  }
});

window.addEventListener('beforeunload', () => {
  if (isJoined && voiceDb && currentRoom) {
    const myKey = getSafeKey(currentNick);
    remove(ref(voiceDb, `voice_rooms/${currentRoom}/members/${myKey}`));
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (myPeer) myPeer.destroy();
  }
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  initVoiceRoom();
} else {
  document.addEventListener('DOMContentLoaded', initVoiceRoom);
}
</script>
