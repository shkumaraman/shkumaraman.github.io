<style>
  .share-modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100000;
    align-items: flex-end;
    justify-content: center;
  }

  @media (min-width: 600px) {
    .share-modal-overlay {
      align-items: center;
      padding: 20px;
    }
  }

  .share-modal-box {
    background: var(--dark-surface, #111114);
    width: 100%;
    max-width: 460px;
    border-radius: 24px 24px 0 0;
    border: 1px solid var(--dark-border2, rgba(255, 255, 255, 0.08));
    border-bottom: none;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
    max-height: 85vh;
    animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  @media (min-width: 600px) {
    .share-modal-box {
      border-radius: 20px;
      border-bottom: 1px solid var(--dark-border2, rgba(255, 255, 255, 0.08));
      max-height: 80vh;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
  }

  .light-mode .share-modal-box {
    background: var(--light-surface, #ffffff);
    border-color: var(--light-border2, rgba(0, 0, 0, 0.1));
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.15);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .share-modal-header {
    padding: 16px 20px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--dark-border, rgba(255, 255, 255, 0.06));
  }

  .light-mode .share-modal-header {
    border-bottom-color: var(--light-border, rgba(0, 0, 0, 0.07));
  }

  .share-modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--dark-text, #fff);
    margin: 0;
    letter-spacing: -0.2px;
  }

  .light-mode .share-modal-title {
    color: var(--light-text, #1f1f1f);
  }

  .share-close-btn {
    background: none;
    border: none;
    color: var(--dark-icon-color, #aaa);
    font-size: 16px;
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: background 0.15s, color 0.15s;
  }

  .share-close-btn:hover {
    background: var(--dark-icon-hover-bg, rgba(255, 255, 255, 0.1));
    color: #fff;
  }

  .light-mode .share-close-btn {
    color: var(--light-icon-color, #666);
  }

  .light-mode .share-close-btn:hover {
    background: var(--light-icon-hover-bg, rgba(0, 0, 0, 0.05));
    color: #111;
  }

  .share-search-wrapper {
    padding: 12px 18px 6px;
  }

  .share-search-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--dark-input-bg, rgba(255, 255, 255, 0.05));
    border: 1px solid var(--dark-border2, rgba(255, 255, 255, 0.08));
    color: var(--dark-text, #fff);
    font-size: 13.5px;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s, background 0.2s;
  }

  .share-search-input:focus {
    border-color: var(--accent, #ff6b4a);
    background: var(--dark-input-focus, rgba(255, 255, 255, 0.08));
  }

  .light-mode .share-search-input {
    background: var(--light-input-bg, rgba(0, 0, 0, 0.04));
    border-color: var(--light-border2, rgba(0, 0, 0, 0.08));
    color: var(--light-text, #333);
  }

  .light-mode .share-search-input:focus {
    border-color: var(--accent, #ff6b4a);
    background: #fff;
  }

  .share-friends-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px 8px;
    padding: 10px 16px 14px;
    overflow-y: auto;
    max-height: 220px;
  }

  .share-friends-grid::-webkit-scrollbar {
    width: 4px;
  }

  .share-friends-grid::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 4px;
  }

  .share-friend-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
    position: relative;
    padding: 6px 2px;
    border-radius: 12px;
    transition: transform 0.15s ease;
  }

  .share-friend-card:active {
    transform: scale(0.94);
  }

  .share-avatar-wrapper {
    position: relative;
    width: 52px;
    height: 52px;
  }

  .share-friend-avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--accent-dim, rgba(255, 107, 74, 0.15));
    border: 2px solid transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent, #ff6b4a);
    font-size: 18px;
    font-weight: 700;
    transition: border-color 0.2s, transform 0.2s;
  }

  .share-friend-card.selected .share-friend-avatar {
    border-color: var(--accent, #ff6b4a);
    transform: scale(0.96);
  }

  .share-check-badge {
    position: absolute;
    bottom: -1px;
    right: -1px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #333;
    border: 2px solid var(--dark-surface, #111114);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 9px;
    transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0.5;
  }

  .light-mode .share-check-badge {
    border-color: var(--light-surface, #ffffff);
    background: #bbb;
  }

  .share-friend-card.selected .share-check-badge {
    background: var(--accent, #ff6b4a);
    color: #fff;
    opacity: 1;
    transform: scale(1.15);
  }

  .share-friend-name {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--dark-text, #fff);
    text-align: center;
    width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
  }

  .light-mode .share-friend-name {
    color: var(--light-text, #333);
  }

  .share-send-section {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--dark-border, rgba(255, 255, 255, 0.06));
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--dark-surface, #111114);
  }

  .light-mode .share-send-section {
    background: var(--light-surface, #ffffff);
    border-top-color: var(--light-border, rgba(0, 0, 0, 0.07));
  }

  .share-msg-input {
    width: 100%;
    padding: 8px 2px 10px;
    border: none;
    border-bottom: 1.5px solid var(--dark-border2, rgba(255, 255, 255, 0.15));
    border-radius: 0;
    background: transparent;
    color: var(--dark-text, #fff);
    font-size: 13.5px;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s ease;
  }

  .share-msg-input::placeholder {
    color: var(--dark-text-muted, rgba(255, 255, 255, 0.38));
  }

  .share-msg-input:focus {
    border-bottom-color: var(--accent, #ff6b4a);
  }

  .light-mode .share-msg-input {
    border-bottom-color: var(--light-border2, rgba(0, 0, 0, 0.15));
    color: var(--light-text, #222);
  }

  .light-mode .share-msg-input::placeholder {
    color: var(--light-text-muted, rgba(0, 0, 0, 0.4));
  }

  .light-mode .share-msg-input:focus {
    border-bottom-color: var(--accent, #ff6b4a);
  }

  .share-send-btn {
    width: 100%;
    background: var(--accent, #ff6b4a);
    color: #fff;
    border: none;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.2s, background 0.2s, transform 0.1s;
  }

  .share-send-btn:active:not(:disabled) {
    transform: scale(0.98);
  }

  .share-send-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .share-send-btn:not(:disabled):hover {
    background: var(--accent-hover, #ff5535);
  }

  .share-bottom-actions {
    padding: 12px 18px 16px;
    border-top: 1px solid var(--dark-border, rgba(255, 255, 255, 0.06));
    background: var(--dark-card, #17171a);
    display: flex;
    gap: 24px;
    overflow-x: auto;
  }

  .light-mode .share-bottom-actions {
    background: var(--light-surface, #f9f9fb);
    border-top-color: var(--light-border, rgba(0, 0, 0, 0.07));
  }

  .share-action-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    outline: none;
    min-width: 58px;
  }

  .share-action-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--dark-input-bg, rgba(255, 255, 255, 0.06));
    border: 1px solid var(--dark-border2, rgba(255, 255, 255, 0.08));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dark-text, #fff);
    font-size: 15px;
    transition: transform 0.15s, background 0.15s;
  }

  .share-action-item:active .share-action-icon {
    transform: scale(0.92);
  }

  .light-mode .share-action-icon {
    background: var(--light-input-bg, rgba(0, 0, 0, 0.05));
    border-color: var(--light-border2, rgba(0, 0, 0, 0.1));
    color: var(--light-text, #333);
  }

  .share-action-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--dark-text-muted, rgba(255, 255, 255, 0.6));
    white-space: nowrap;
  }

  .light-mode .share-action-label {
    color: var(--light-text-muted, rgba(0, 0, 0, 0.6));
  }

  .share-empty-notice {
    grid-column: span 4;
    text-align: center;
    padding: 30px 10px;
    color: var(--dark-text-muted, rgba(255, 255, 255, 0.4));
    font-size: 12px;
  }

  .share-custom-toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent, #ff6b4a);
    color: #fff;
    padding: 10px 20px;
    border-radius: 11px;
    z-index: 1000000;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    white-space: nowrap;
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
</style>

<div id="shareCustomToast" class="share-custom-toast"></div>

<div id="shareModalOverlay" class="share-modal-overlay">
  <div class="share-modal-box">
    <div class="share-modal-header">
      <h4 class="share-modal-title">Share</h4>
      <button class="share-close-btn" onclick="closeShareModal()" aria-label="Close">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="share-search-wrapper">
      <input type="text" id="shareSearchInput" class="share-search-input" placeholder="Search friends..." />
    </div>

    <div class="share-friends-grid" id="shareFriendsGrid">
      <div class="share-empty-notice">Loading friends...</div>
    </div>

    <div class="share-send-section">
      <input type="text" id="shareCustomMsg" class="share-msg-input" placeholder="Write a message..." />
      <button class="share-send-btn" id="shareSendBtn" onclick="sendSharedContent()" disabled>
        Send
      </button>
    </div>

    <div class="share-bottom-actions">
      <button class="share-action-item" onclick="copyShareContent()">
        <div class="share-action-icon">
          <i class="fas fa-link"></i>
        </div>
        <span class="share-action-label">Copy link</span>
      </button>

      <button class="share-action-item" onclick="openNativeShare()">
        <div class="share-action-icon">
          <i class="fas fa-share-nodes"></i>
        </div>
        <span class="share-action-label">Share</span>
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
  import { getDatabase, ref, get, push, set } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

  const firebaseConfig = {
    databaseURL: "https://talkrush-76259-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  const app = getApps().length === 0 ? initializeApp(firebaseConfig) : getApps()[0];
  const db = getDatabase(app);

  let cachedFriends = [];
  let selectedChatIds = new Set();
  let currentSharePayload = "";

  function getAvatarLetter(name) {
    if (!name) return "?";
    if (name.startsWith("TR|")) return name.charAt(3) || "?";
    return name.charAt(0).toUpperCase();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || "";
    return div.innerHTML;
  }

  function showShareToast(message) {
    const toast = document.getElementById("shareCustomToast");
    if (!toast) return;
    toast.textContent = message;
    toast.style.display = "block";
    setTimeout(() => toast.style.opacity = "1", 10);
    clearTimeout(window.shareToastTimer);
    window.shareToastTimer = setTimeout(() => {
      toast.style.opacity = "0";
      setTimeout(() => toast.style.display = "none", 300);
    }, 2500);
  }

  async function fetchFriendsForShare() {
    const myNickname = localStorage.getItem("talkrush_nickname") || "Guest";
    const friendsRef = ref(db, "friends");

    try {
      const snap = await get(friendsRef);
      const data = snap.val();
      cachedFriends = [];

      if (data) {
        Object.entries(data).forEach(([chatId, friend]) => {
          const friendNickname = friend.nickname2 === myNickname ? friend.nickname1 :
            friend.nickname1 === myNickname ? friend.nickname2 : null;
          
          if (friendNickname) {
            let finalName = friendNickname.startsWith("TR|") ? friendNickname.substring(3) : friendNickname;
            cachedFriends.push({
              chatId,
              displayName: finalName,
              avatarLetter: getAvatarLetter(friendNickname)
            });
          }
        });
      }
      renderShareGrid();
    } catch (e) {
      const grid = document.getElementById("shareFriendsGrid");
      if (grid) grid.innerHTML = `<div class="share-empty-notice">Failed to load friends</div>`;
    }
  }

  function renderShareGrid(filter = "") {
    const grid = document.getElementById("shareFriendsGrid");
    if (!grid) return;

    const filtered = cachedFriends.filter(f => 
      f.displayName.toLowerCase().includes(filter.toLowerCase())
    );

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="share-empty-notice">${cachedFriends.length === 0 ? 'No friends found.' : 'No match found'}</div>`;
      return;
    }

    grid.innerHTML = "";
    filtered.forEach(friend => {
      const isSelected = selectedChatIds.has(friend.chatId);
      const card = document.createElement("div");
      card.className = `share-friend-card ${isSelected ? 'selected' : ''}`;
      card.setAttribute("data-chat-id", friend.chatId);

      card.innerHTML = `
        <div class="share-avatar-wrapper">
          <div class="share-friend-avatar">${friend.avatarLetter}</div>
          <div class="share-check-badge">
            <i class="fa-solid fa-check"></i>
          </div>
        </div>
        <span class="share-friend-name">${escapeHtml(friend.displayName)}</span>
      `;

      card.onclick = () => toggleFriendSelection(friend.chatId, card);
      grid.appendChild(card);
    });

    updateSendButton();
  }

  function toggleFriendSelection(chatId, element) {
    if (selectedChatIds.has(chatId)) {
      selectedChatIds.delete(chatId);
      element.classList.remove("selected");
    } else {
      selectedChatIds.add(chatId);
      element.classList.add("selected");
    }
    updateSendButton();
  }

  function updateSendButton() {
    const btn = document.getElementById("shareSendBtn");
    const count = selectedChatIds.size;
    if (count > 0) {
      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-paper-plane"></i> Send (${count})`;
    } else {
      btn.disabled = true;
      btn.innerHTML = `Send`;
    }
  }

  window.openShareModal = function(payload = "") {
    currentSharePayload = typeof payload === 'object' ? (payload.url || payload.text || window.location.href) : (payload || window.location.href);
    selectedChatIds.clear();
    
    const overlay = document.getElementById("shareModalOverlay");
    const customMsg = document.getElementById("shareCustomMsg");
    const searchInput = document.getElementById("shareSearchInput");

    if (customMsg) customMsg.value = "";
    if (searchInput) searchInput.value = "";

    overlay.style.display = "flex";
    fetchFriendsForShare();
  };

  window.closeShareModal = function() {
    const overlay = document.getElementById("shareModalOverlay");
    if (overlay) overlay.style.display = "none";
    selectedChatIds.clear();
  };

  window.copyShareContent = function() {
    const toCopy = currentSharePayload || window.location.href;
    navigator.clipboard.writeText(toCopy).then(() => {
      showShareToast("Copied to clipboard!");
    }).catch(() => {
      showShareToast("Failed to copy!");
    });
  };

  window.openNativeShare = async function() {
    const shareData = {
      title: document.title,
      url: currentSharePayload || window.location.href
    };

    if (navigator.share) {
      try {
        await navigator.share(shareData);
      } catch (err) {}
    } else {
      copyShareContent();
    }
  };

  function isMediaUrl(url) {
    if (typeof url !== 'string') return false;
    return url.includes("i.ibb.co") || 
           url.includes("giphy.com") || 
           url.match(/\.(jpeg|jpg|gif|png|webp)$/i) != null;
  }

  window.sendSharedContent = async function() {
    if (selectedChatIds.size === 0) return;

    const myNickname = localStorage.getItem("talkrush_nickname") || "Guest";
    const customText = document.getElementById("shareCustomMsg").value.trim();
    
    const sendBtn = document.getElementById("shareSendBtn");
    sendBtn.disabled = true;
    sendBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending...`;

    try {
      const promises = [];

      Array.from(selectedChatIds).forEach(chatId => {
        const baseTime = Date.now();

        if (isMediaUrl(currentSharePayload)) {
          const msgType = currentSharePayload.includes("giphy.com") ? "gif" : "image";
          
          promises.push(set(push(ref(db, `friends/${chatId}/messages`)), {
            nickname: myNickname,
            url: currentSharePayload,
            timestamp: baseTime,
            type: msgType
          }));

          if (customText) {
            promises.push(set(push(ref(db, `friends/${chatId}/messages`)), {
              nickname: myNickname,
              text: customText,
              timestamp: baseTime + 1,
              type: "text"
            }));
          }
        } else {
          promises.push(set(push(ref(db, `friends/${chatId}/messages`)), {
            nickname: myNickname,
            text: currentSharePayload,
            timestamp: baseTime,
            type: "text"
          }));

          if (customText) {
            promises.push(set(push(ref(db, `friends/${chatId}/messages`)), {
              nickname: myNickname,
              text: customText,
              timestamp: baseTime + 1,
              type: "text"
            }));
          }
        }
      });

      await Promise.all(promises);

      closeShareModal();
      showShareToast("Sent successfully!");
    } catch (err) {
      showShareToast("Error sending message");
    } finally {
      updateSendButton();
    }
  };

  document.addEventListener("DOMContentLoaded", () => {
    const searchInput = document.getElementById("shareSearchInput");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        renderShareGrid(e.target.value.trim());
      });
    }

    const overlay = document.getElementById("shareModalOverlay");
    if (overlay) {
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeShareModal();
      });
    }
  });
</script>
