<script>
(function() {
    const chatContainer = document.querySelector('.chat-container');
    let maxVh = window.innerHeight;
    let currentWidth = window.innerWidth;

    if (window.visualViewport) {
        maxVh = window.visualViewport.height;
        
        window.visualViewport.addEventListener('resize', function() {
            const isZoomed = window.visualViewport.scale > 1.05;
            if (isZoomed) {
                return; 
            }

            if (window.innerWidth !== currentWidth) {
                currentWidth = window.innerWidth;
                maxVh = window.visualViewport.height;
            }

            if (window.visualViewport.height > maxVh) {
                maxVh = window.visualViewport.height;
            }

            const isKeyboardOpen = window.visualViewport.height < (maxVh - 150);

            if (isKeyboardOpen) {
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
                if (chatContainer) chatContainer.style.height = window.visualViewport.height + 'px';
                window.scrollTo(0, 0);
            } else {
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
                if (chatContainer) chatContainer.style.height = '';
            }
            
            const chatLog = document.getElementById("chatLog");
            if (chatLog) {
                chatLog.scrollTop = chatLog.scrollHeight;
            }
        });
    }

    document.addEventListener('focusin', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            setTimeout(function() { window.scrollTo(0, 0); }, 50);
        }
    });
})();
</script>

<script>
  window.MEDIA_STORAGE_URL = "https://shkumaraman-backend.hf.space";

  let nsfwModelInstance = null;
  let isModelLoading = false;

  async function getNSFWModel() {
    if (nsfwModelInstance) return nsfwModelInstance;
    if (isModelLoading) {
      while (isModelLoading) {
        await new Promise(r => setTimeout(r, 100));
      }
      return nsfwModelInstance;
    }
    isModelLoading = true;
    try {
      nsfwModelInstance = await nsfwjs.load();
    } catch (e) {
    } finally {
      isModelLoading = false;
    }
    return nsfwModelInstance;
  }

  window.addEventListener('load', () => {
    getNSFWModel();
  });

  window.checkImageSafety = async function(fileOrBlob) {
    if (!fileOrBlob.type || !fileOrBlob.type.startsWith('image/')) {
      return true;
    }

    const model = await getNSFWModel();
    if (!model) return true;

    return new Promise((resolve) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(fileOrBlob);
      img.src = objectUrl;

      img.onload = async () => {
        try {
          const predictions = await model.classify(img);
          URL.revokeObjectURL(objectUrl);

          for (let i = 0; i < predictions.length; i++) {
            const pred = predictions[i];
            if ((pred.className === "Porn" || pred.className === "Hentai") && pred.probability > 0.50) {
              return resolve(false);
            }
            if (pred.className === "Sexy" && pred.probability > 0.75) {
              return resolve(false);
            }
          }
          resolve(true);
        } catch (err) {
          URL.revokeObjectURL(objectUrl);
          resolve(true);
        }
      };

      img.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        resolve(true);
      };
    });
  };

  window.uploadMediaToServer = async function(fileOrBlob, originalName = "file", isPublic = false) {
    if (isPublic) {
      const isSafe = await window.checkImageSafety(fileOrBlob);
      if (!isSafe) {
        const modal = document.getElementById('talkrushWarningModal');
        if (modal) {
          const title = modal.querySelector('.warning-title');
          const desc = modal.querySelector('.warning-desc');
          if (title) title.textContent = "Media Blocked";
          if (desc) desc.textContent = "Sensitive or explicit media cannot be posted publicly.";
          modal.classList.add('active');
        }
        throw new Error("NSFW_BLOCKED");
      }
    }

    return new Promise((resolve, reject) => {
      const formData = new FormData();
      formData.append("file", fileOrBlob, originalName);
      formData.append("target_path", "uploads");

      const baseUrl = window.MEDIA_STORAGE_URL.replace(/\/$/, "");
      const xhr = new XMLHttpRequest();
      xhr.open("POST", `${baseUrl}/api/upload`, true);

      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            const result = JSON.parse(xhr.responseText);
            const secureUrl = (result.data.url || '').replace(/^http:\/\//i, 'https://');
            resolve(secureUrl);
          } catch (e) {
            reject(new Error("Invalid JSON response from server"));
          }
        } else {
          reject(new Error(`Upload failed (${xhr.status})`));
        }
      };

      xhr.onerror = () => {
        reject(new Error("Network error or CORS policy blocked the upload"));
      };

      xhr.send(formData);
    });
  };

  window.deleteMediaFromServer = async function(fileUrl) {
    if (!fileUrl || !window.MEDIA_STORAGE_URL) return;
    
    try {
      const urlObj = new URL(fileUrl);
      const pathParts = urlObj.pathname.split('/').filter(p => p); 
      
      if (pathParts[0] === 'uploads' && pathParts[1]) {
        const filename = pathParts[1];
        const pushId = filename.substring(0, filename.lastIndexOf(".")) || filename;
        
        const baseUrl = window.MEDIA_STORAGE_URL.replace(/\/$/, "");
        const deleteUrl = `${baseUrl}/uploads/${pushId}`;
        
        await fetch(deleteUrl, {
          method: "DELETE",
          mode: "cors"
        });
      }
    } catch (e) {}
  };
</script>
