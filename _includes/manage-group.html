<style>
.manage-float-btn {
  position: fixed;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  background: var(--dark-header-bg, #181818);
  border: 1px solid var(--dark-header-border, #2a2a2a);
  border-right: none;
  padding: 12px 14px 12px 16px;
  border-radius: 14px 0 0 14px;
  color: var(--dark-icon-color, #ccc);
  cursor: pointer;
  z-index: 9990;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: -4px 0 15px rgba(0,0,0,0.6);
  transition: all 0.2s ease-in-out;
}
.manage-float-btn:hover {
  background: var(--dark-icon-hover-bg, rgba(255,255,255,0.1));
  color: var(--accent, #ff6b4a);
  padding-right: 20px;
}
body.light-mode .manage-float-btn {
  background: var(--light-header-bg, #ffffff);
  border-color: var(--light-header-border, #e0e0e0);
  color: var(--light-icon-color, #666);
  box-shadow: -4px 0 15px rgba(0,0,0,0.15);
}
body.light-mode .manage-float-btn:hover {
  background: var(--light-icon-hover-bg, rgba(0,0,0,0.05));
  color: var(--accent, #ff6b4a);
}
.manage-float-btn svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.3s;
}
.manage-float-btn:hover svg {
  transform: rotate(90deg);
}

.manage-modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(2px);
  z-index: 99990;
  justify-content: center;
  align-items: center;
  padding: 15px;
}
.manage-modal-overlay.active {
  display: flex;
}
.manage-modal-content {
  background: var(--dark-surface, #111114);
  border: 0.5px solid var(--dark-border2, rgba(255,255,255,0.08));
  border-radius: 16px;
  width: 100%;
  max-width: 420px;
  max-height: 85vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
body.light-mode .manage-modal-content {
  background: var(--light-surface, #ffffff);
  border-color: var(--light-border2, rgba(0,0,0,0.1));
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.manage-header {
  padding: 18px 20px;
  border-bottom: 0.5px solid var(--dark-border2, rgba(255,255,255,0.08));
  display: flex;
  justify-content: space-between;
  align-items: center;
}
body.light-mode .manage-header { border-bottom-color: var(--light-border2, rgba(0,0,0,0.1)); }
.manage-header h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.close-manage-btn {
  background: none; border: none; color: var(--dark-icon-color, #ccc);
  font-size: 1.2em; cursor: pointer; transition: color 0.2s;
}
.close-manage-btn:hover { color: var(--error, #ff6b6b); }
body.light-mode .close-manage-btn { color: var(--light-icon-color, #666); }
.manage-body {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}
.manage-section {
  margin-bottom: 25px;
}
.manage-section-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent, #ff6b4a);
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.banned-search {
  width: 100%;
  padding: 8px 12px;
  background: var(--dark-input-bg, rgba(255,255,255,0.05));
  border: 0.5px solid var(--dark-border2, rgba(255,255,255,0.08));
  border-radius: 8px;
  color: var(--dark-text);
  font-size: 13px;
  outline: none;
  margin-bottom: 10px;
  box-sizing: border-box;
}
body.light-mode .banned-search {
  background: var(--light-input-bg, rgba(0,0,0,0.05));
  border-color: var(--light-border2, rgba(0,0,0,0.1));
  color: var(--light-text);
}
.banned-list {
  background: var(--dark-input-bg, rgba(255,255,255,0.05));
  border: 0.5px solid var(--dark-border2, rgba(255,255,255,0.08));
  border-radius: 10px;
  max-height: 250px;
  overflow-y: auto;
}
body.light-mode .banned-list {
  background: var(--light-input-bg, rgba(0,0,0,0.05));
  border-color: var(--light-border2, rgba(0,0,0,0.1));
}
.banned-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 15px;
  border-bottom: 0.5px solid var(--dark-border2, rgba(255,255,255,0.08));
  font-size: 14px;
}
body.light-mode .banned-item { border-bottom-color: var(--light-border2, rgba(0,0,0,0.1)); }
.banned-item:last-child { border-bottom: none; }
.unban-btn {
  background: rgba(34, 197, 94, 0.15);
  color: #22c55e;
  border: 1px solid rgba(34, 197, 94, 0.3);
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.unban-btn:hover { background: #22c55e; color: #fff; }
.empty-banned { padding: 15px; text-align: center; color: var(--dark-text-muted); font-size: 13px; font-style: italic; }
body.light-mode .empty-banned { color: var(--light-text-muted); }
.transfer-desc {
  font-size: 12px;
  color: var(--dark-text-muted);
  margin-bottom: 10px;
}
body.light-mode .transfer-desc { color: var(--light-text-muted); }
.transfer-input-group {
  display: flex;
  gap: 8px;
}
.transfer-input {
  flex: 1;
  padding: 10px 12px;
  background: var(--dark-input-bg);
  border: 0.5px solid var(--dark-border2);
  border-radius: 8px;
  color: var(--dark-text);
  font-size: 13px;
  outline: none;
}
body.light-mode .transfer-input {
  background: var(--light-input-bg);
  border-color: var(--light-border2);
  color: var(--light-text);
}
.transfer-btn {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 0 15px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.2s;
}
.transfer-btn:hover { background: var(--accent-hover); }
</style>

<button class="manage-float-btn" id="manageGroupBtn" title="Manage Group">
  <svg viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<div class="manage-modal-overlay" id="manageModalOverlay">
  <div class="manage-modal-content">
    <div class="manage-header">
      <h3><i class="fas fa-crown" style="color: var(--accent);"></i> Manage Group</h3>
      <button class="close-manage-btn" id="closeManageModal">✕</button>
    </div>
    <div class="manage-body">
      <div class="manage-section">
        <div class="manage-section-title">Banned Users</div>
        <input type="text" id="bannedSearchInput" class="banned-search" placeholder="Search banned users..." autocomplete="off">
        <div class="banned-list" id="bannedListContainer">
          <div class="empty-banned">Loading...</div>
        </div>
      </div>
      <div class="manage-section" style="margin-bottom: 0;">
        <div class="manage-section-title">Transfer Ownership</div>
        <p class="transfer-desc">Enter the exact nickname of the user you want to make the new Admin (e.g., TR|abc). If you don't add "TR|", it will be added automatically. <strong>Warning:</strong> You will lose your admin privileges.</p>
        <div class="transfer-input-group">
          <input type="text" id="newAdminNickname" class="transfer-input" placeholder="New Admin Nickname (e.g., TR|abc)" autocomplete="off">
          <button id="transferAdminBtn" class="transfer-btn">Transfer</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
import { getDatabase, ref, onValue, set, remove } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js';

const firebaseConfig = {
  databaseURL: "https://talkrush2-default-rtdb.asia-southeast1.firebasedatabase.app"
};

let app;
const apps = getApps();
const targetAppName = "TalkRushApp";
const existingApp = apps.find(a => a.name === targetAppName);

if (existingApp) {
  app = existingApp;
} else {
  app = initializeApp(firebaseConfig, targetAppName);
}

const db = getDatabase(app);
const currentGroup = new URLSearchParams(window.location.search).get('group');
let myNickname = localStorage.getItem('talkrush_nickname') || 'Guest';
let isCurrentUserAdmin = false;

const manageBtn = document.getElementById('manageGroupBtn');
const modalOverlay = document.getElementById('manageModalOverlay');
const closeBtn = document.getElementById('closeManageModal');
const bannedListContainer = document.getElementById('bannedListContainer');
const bannedSearchInput = document.getElementById('bannedSearchInput');
const newAdminInput = document.getElementById('newAdminNickname');
const transferBtn = document.getElementById('transferAdminBtn');

window.addEventListener('nicknameUpdated', (e) => {
  myNickname = e.detail.nickname;
  checkAdminStatus();
});

function checkAdminStatus() {
  if (!currentGroup || myNickname === 'Guest') {
    manageBtn.style.display = 'none';
    return;
  }
  
  const adminRef = ref(db, `groups/${currentGroup}/admin`);
  onValue(adminRef, (snapshot) => {
    const adminNickname = snapshot.val();
    if (adminNickname && adminNickname === myNickname) {
      isCurrentUserAdmin = true;
      manageBtn.style.display = 'flex';
    } else {
      isCurrentUserAdmin = false;
      manageBtn.style.display = 'none';
      closeManageModal();
    }
  });
}

checkAdminStatus();

function openManageModal() {
  if (!isCurrentUserAdmin) return;
  bannedSearchInput.value = '';
  modalOverlay.classList.add('active');
  loadBannedUsers();
}

function closeManageModal() {
  modalOverlay.classList.remove('active');
}

manageBtn.addEventListener('click', openManageModal);
closeBtn.addEventListener('click', closeManageModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeManageModal();
});

bannedSearchInput.addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const items = bannedListContainer.querySelectorAll('.banned-item');
  let visibleCount = 0;
  
  items.forEach(item => {
    const name = item.querySelector('span').textContent.toLowerCase();
    if (name.includes(query)) {
      item.style.display = 'flex';
      visibleCount++;
    } else {
      item.style.display = 'none';
    }
  });
  
  let emptyMsg = bannedListContainer.querySelector('.empty-search-msg');
  if (visibleCount === 0 && items.length > 0) {
    if (!emptyMsg) {
      emptyMsg = document.createElement('div');
      emptyMsg.className = 'empty-banned empty-search-msg';
      emptyMsg.textContent = 'No matching users found.';
      bannedListContainer.appendChild(emptyMsg);
    } else {
      emptyMsg.style.display = 'block';
    }
  } else if (emptyMsg) {
    emptyMsg.style.display = 'none';
  }
});

function loadBannedUsers() {
  const bannedRef = ref(db, `groups/${currentGroup}/banned`);
  onValue(bannedRef, (snapshot) => {
    if (!modalOverlay.classList.contains('active')) return;
    bannedListContainer.innerHTML = '';
    const data = snapshot.val();
    
    if (!data) {
      bannedListContainer.innerHTML = '<div class="empty-banned">No banned users.</div>';
      return;
    }

    Object.keys(data).forEach(safeKey => {
      const displayKey = safeKey.replace(/_/g, '.'); 
      const item = document.createElement('div');
      item.className = 'banned-item';
      const nameSpan = document.createElement('span');
      nameSpan.textContent = displayKey;
      const unbanBtn = document.createElement('button');
      unbanBtn.className = 'unban-btn';
      unbanBtn.textContent = 'Unban';
      unbanBtn.onclick = () => unbanUser(safeKey, displayKey);
      
      item.appendChild(nameSpan);
      item.appendChild(unbanBtn);
      bannedListContainer.appendChild(item);
    });
    
    bannedSearchInput.dispatchEvent(new Event('input'));
  });
}

async function unbanUser(safeKey, displayName) {
  const confirm = await AlertKit.confirm(
    'Unban User', 
    `Are you sure you want to unban ${displayName}?`, 
    'Yes, Unban', 
    'Cancel'
  );
  
  if (confirm) {
    try {
      await remove(ref(db, `groups/${currentGroup}/banned/${safeKey}`));
      AlertKit.toast(`${displayName} has been unbanned.`, 'success');
    } catch (error) {
      AlertKit.error('Error', 'Could not unban user. Please try again.');
    }
  }
}

transferBtn.addEventListener('click', async () => {
  let newAdmin = newAdminInput.value.trim();
  
  if (!newAdmin) {
    AlertKit.warning('Missing Input', 'Please enter the nickname of the new admin.');
    return;
  }
  
  if (!newAdmin.startsWith('TR|')) {
    newAdmin = 'TR|' + newAdmin;
  }
  
  if (newAdmin === myNickname) {
    AlertKit.info('Invalid Action', 'You are already the admin of this group.');
    return;
  }

  const confirm = await AlertKit.confirm(
    'Transfer Ownership?', 
    `Are you sure you want to make "${newAdmin}" the new admin? You will lose all your admin privileges immediately.`, 
    'Transfer', 
    'Cancel'
  );

  if (confirm) {
    transferBtn.disabled = true;
    transferBtn.textContent = 'Transferring...';
    
    try {
      await set(ref(db, `groups/${currentGroup}/admin`), newAdmin);
      AlertKit.success('Success', `Ownership has been transferred to ${newAdmin}.`);
      closeManageModal();
      newAdminInput.value = '';
    } catch (error) {
      AlertKit.error('Error', 'Failed to transfer ownership.');
    } finally {
      transferBtn.disabled = false;
      transferBtn.textContent = 'Transfer';
    }
  }
});
</script>
