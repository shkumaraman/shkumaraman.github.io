<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rocket Crash – Fun Mode</title>
<style>
:root{--bg:#0c0c0d;--card:#1b1b1d;--in:#111112;--tx:#e8e8ea;--mut:#8b8b92;--gr:#28a909;--or:#d27a06;--rd:#c1213b;--b1:#34b4ff;--b2:#913ef8;--b3:#c017b4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:0 6px 24px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 10px;position:relative}
.logo{font-family:Lobster,"Brush Script MT",cursive;font-style:italic;font-size:34px;color:#e50539;letter-spacing:.5px}
.bal{color:#3bd23b;font-weight:700;font-size:20px}.bal small{color:var(--tx);font-weight:500;font-size:20px}
#menuBtn{font-size:26px;color:var(--mut);margin-left:12px}
#menu{position:absolute;right:10px;top:54px;background:#242427;border-radius:10px;padding:6px;z-index:9;display:none}
#menu.on{display:block}#menu button{padding:10px 14px;display:block;white-space:nowrap}
.hist{display:flex;gap:14px;align-items:center;padding:6px 10px 10px;overflow:hidden;white-space:nowrap;font-size:17px;font-weight:500;position:relative;flex-wrap:nowrap}
.hist.open{flex-wrap:wrap;white-space:normal}
.b1{color:var(--b1)}.b2{color:#a15cff}.b3{color:#e23ad0}
#more{margin-left:auto;background:#2a2a2d;border-radius:14px;padding:2px 12px;color:var(--tx);flex:none}
.stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid #2c2c30;background:#000;margin-top:4px}
.fun{background:linear-gradient(#e0a02c,#c98618);text-align:center;font-weight:800;font-size:18px;padding:3px 0;position:relative;z-index:3}
.view{position:relative;height:min(58vw,280px);overflow:hidden}
.rays{position:absolute;left:0;top:100%;width:300%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(#ffffff0f 0 7deg,#0000 7deg 14deg);animation:spin 36s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 42%,#6a20c4aa,#2a0a5a55 45%,transparent 75%);transition:.3s}
.crashed .glow{background:radial-gradient(ellipse 60% 55% at 50% 42%,#a3122a66,transparent 70%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#center{position:absolute;left:0;right:0;top:13%;text-align:center;pointer-events:none}
#mult{font-size:min(22vw,104px);font-weight:800;line-height:1;letter-spacing:-2px;text-shadow:0 4px 24px #0009}
.crashed #mult{color:#ff2a4d}
#flew{font-size:22px;font-weight:800;color:#fff;letter-spacing:1px;height:0;opacity:0;transition:.2s}
.crashed #flew{height:28px;opacity:1}
#wait{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:700;letter-spacing:1px}
#wait[hidden]{display:none}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid #ffffff18;border-top-color:#e50539;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.pb{width:56%;height:8px;border-radius:5px;background:#ffffff1c;overflow:hidden}.pb i{display:block;height:100%;background:#e50539;width:0}
#chip{position:absolute;right:12px;bottom:12px;background:#0007;border:1px solid #ffffff14;border-radius:26px;padding:4px 14px 4px 6px;display:flex;align-items:center;gap:10px;font-size:18px;z-index:2}
.avs{display:flex}.avs span,.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;border:2px solid #2e9d3a;background:#333}
.avs span+span{margin-left:-9px}
#toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-20px);background:#1a5f14;border:1px solid #3bd23b;border-radius:30px;padding:6px 16px;display:flex;gap:12px;align-items:center;font-size:14px;opacity:0;transition:.25s;z-index:5;white-space:nowrap}
#toast.bad{background:#5a1420;border-color:#e0405a}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{background:#0006;border-radius:20px;padding:3px 10px;font-size:16px}
.panel{background:var(--card);border-radius:24px;margin-top:10px;padding:14px 12px 14px;position:relative}
.tabs{display:flex;width:min(58%,272px);margin:0 auto 12px;background:var(--in);border-radius:24px;padding:4px}
.tabs button{flex:1;padding:8px 0;border-radius:20px;color:var(--mut);font-size:16px}
.tabs button.on{background:#2e2e31;color:var(--tx)}
.col{position:absolute;right:16px;top:14px;width:42px;height:36px;border-radius:10px;border:1px solid #333;background:#2a2a2d;color:var(--mut)}
.row{display:flex;gap:14px;align-items:stretch}
.left{width:46%;flex:none}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--in);border-radius:30px;padding:5px}
.stepper button{width:38px;height:38px;border-radius:50%;background:#2c2c2f;font-size:22px;color:var(--mut)}
.stepper input{width:100%;min-width:0;text-align:center;background:none;border:0;color:var(--tx);font:700 22px inherit;outline:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.quick button{background:var(--in);border-radius:16px;padding:9px 0;color:var(--mut);font-size:19px}
.go{flex:1;border-radius:16px;font-size:26px;line-height:1.2;border:2px solid #ffffff55;box-shadow:0 0 0 3px #0008;background:var(--gr);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .15s}
.go:active{filter:brightness(.85)}.go.or{background:var(--or)}.go.rd{background:var(--rd)}
.go small{font-size:.62em;opacity:.9}.go span{font-size:.75em}
.auto{display:none;margin-top:12px;gap:10px;align-items:center;justify-content:space-between;background:var(--in);border-radius:16px;padding:8px 12px;font-size:14px;color:var(--mut)}
.panel.a .auto{display:flex}
.auto label{display:flex;align-items:center;gap:8px}
.auto input.cashat{width:64px;background:#2a2a2d;border:0;border-radius:10px;color:var(--tx);padding:6px;text-align:center;font-size:15px}
.sw{position:relative;width:38px;height:20px;flex:none}.sw input{display:none}
.sw i{position:absolute;inset:0;background:#3a3a3e;border-radius:12px;transition:.2s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#999;transition:.2s}
.sw input:checked+i{background:#2b8a1a}.sw input:checked+i:after{left:20px;background:#fff}
.panel.min .row,.panel.min .auto{display:none}
.bets{background:var(--card);border-radius:24px;margin-top:10px;padding:10px}
.bt3{display:flex;background:var(--in);border-radius:24px;padding:4px}
.bt3 button{flex:1;padding:9px 0;border-radius:20px;color:var(--mut);font-size:16px}.bt3 button.on{background:#2e2e31;color:var(--tx)}
.sum{background:var(--in);border-radius:18px;margin-top:10px;padding:10px 12px}
.sum .t{display:flex;justify-content:space-between;align-items:flex-end}
.sum .t div:first-child{font-size:17px;color:var(--mut)}.sum .t div:last-child{text-align:right;color:var(--mut);font-size:17px}
.sum .t b{display:block;color:var(--tx);font-size:26px}
.sum .p{height:8px;margin-top:8px;background:#26262a;border-radius:5px;overflow:hidden}.sum .p i{display:block;height:100%;width:0;background:#28a909;transition:width .25s}
#list{margin-top:8px}
.r{display:grid;grid-template-columns:34px 1fr 76px 64px 76px;align-items:center;gap:6px;padding:5px 8px;margin-top:4px;background:#161618;border-radius:12px;font-size:14px}
.r .av{width:26px;height:26px;font-size:14px;border-color:#444}.r .nm{color:var(--mut)}.r .bt{text-align:right}.r .wn{text-align:right;font-weight:600}.r .xx b{padding:2px 8px;border-radius:12px;background:#0006;font-size:13px}
.r.won{background:#1c2a12;border:1px solid #2f5a1f}.r.me{outline:1px solid #e50539}
.empty{padding:22px;text-align:center;color:var(--mut)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
<header>
  <div class="logo">Rocket</div>
  <div style="display:flex;align-items:center"><div class="bal"><span id="bal">3,000.00</span> <small>USD</small></div><button id="menuBtn" aria-label="menu">☰</button></div>
  <div id="menu"><button id="reset">Reset balance (3,000)</button></div>
</header>
<div class="hist" id="hist"></div>

<div class="stage" id="stage">
  <div class="fun">FUN MODE</div>
  <div class="view">
    <div class="rays"></div><div class="glow"></div>
    <canvas id="cv"></canvas>
    <div id="center"><div id="flew">FLEW AWAY!</div><div id="mult">1.00x</div></div>
    <div id="wait"><div class="spin"></div><div>WAITING FOR NEXT ROUND</div><div class="pb"><i id="bar"></i></div></div>
    <div id="chip"><div class="avs"><span>😎</span><span>🥷</span><span>💵</span></div><span id="cnt">0</span></div>
    <div id="toast"></div>
  </div>
</div>

<div id="panels"></div>

<div class="bets">
  <div class="bt3" id="tabs3"><button class="on" data-t="all">All Bets</button><button data-t="prev">Previous</button><button data-t="top">Top</button></div>
  <div class="sum"><div class="t"><div><div class="avs" style="margin-bottom:4px"><span>😎</span><span>🥷</span><span>💵</span></div><span id="cb">0/0</span> Bets</div><div><b id="tw">0.00</b>Total win USD</div></div><div class="p"><i id="pg"></i></div></div>
  <div id="list"></div>
</div>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cls=x=>x<2?'b1':x<10?'b2':'b3';
let balance=3000,state='wait',m=1,crash=2,t0=0,waitEnd=0,crashAt=0,players=[],hist=[],prevHTML='',tab3='all',lastList=0,W=0,H=0;
const WAIT=5000,AV=['😎','🥷','🤠','👽','🦊','🐼','🤖','💵','🐯','👻'];
const cv=$('#cv'),ctx=cv.getContext('2d');

/* ---------- panels ---------- */
const panels=[0].map(i=>({i,amt:1,stake:1,placed:false,queued:false,cashed:false,cx:0,win:0,show:false,autoPlay:false,autoCash:false,cashAt:2,last:''}));
$('#panels').innerHTML=panels.map(p=>`<section class="panel" id="p${p.i}" data-i="${p.i}">
<div class="tabs"><button class="on" data-tab="bet">Bet</button><button data-tab="auto">Auto</button></div>
<div class="row"><div class="left"><div class="stepper"><button data-act="dec">−</button><input class="amt" inputmode="decimal" value="1.00"><button data-act="inc">+</button></div>
<div class="quick">${[1,2,5,10].map(q=>`<button data-q="${q}">${q}</button>`).join('')}</div></div>
<button class="go" data-act="go"></button></div>
<div class="auto"><label>Auto Play <span class="sw"><input type="checkbox" data-k="autoPlay"><i></i></span></label>
<label>Auto Cash Out <span class="sw"><input type="checkbox" data-k="autoCash"><i></i></span><input class="cashat" inputmode="decimal" value="2.00"></label></div>
</section>`).join('');

function goHTML(p){
  const a=fmt(p.placed?p.stake:p.amt);
  if(state==='fly'&&p.placed&&!p.cashed)return['or',`Cash Out<span>${fmt(p.stake*Math.floor(m*100)/100)} USD</span>`];
  if(p.queued)return['rd',`Cancel<small>Waiting for next round</small>`];
  if(state==='wait'&&p.placed)return['rd',`Cancel<small>${a} USD</small>`];
  return['',`Bet<span>${a} USD</span>`];
}
function upd(p){
  const [c,h]=goHTML(p),k=c+h,b=$('.go',$('#p'+p.i));
  if(k!==p.last){p.last=k;b.className='go '+c;b.innerHTML=h}
}
function cashOut(p){
  if(state!=='fly'||!p.placed||p.cashed)return;
  const x=Math.floor(m*100)/100,w=p.stake*x;
  p.cashed=true;p.cx=x;p.win=w;balance+=w;
  toast(`You have cashed out! <b>${x.toFixed(2)}x</b> <span>Win USD <b>${fmt(w)}</b></span>`);
}
function go(p){
  if(state==='wait'){
    if(p.queued){p.queued=false}
    else if(p.placed){balance+=p.stake;p.placed=false;p.show=false}
    else if(balance>=p.amt){balance-=p.amt;p.stake=p.amt;p.placed=true;p.cashed=false;p.win=0;p.show=true}
    else toast('Insufficient balance',1);
  }else if(state==='fly'&&p.placed&&!p.cashed)cashOut(p);
  else p.queued=!p.queued;
  upd(p);renderList();
}
function setAmt(p,v){
  v=Math.min(1000,Math.max(0.1,+v||1));p.amt=Math.round(v*100)/100;
  $('.amt',$('#p'+p.i)).value=fmt(p.amt).replace(/,/g,'');upd(p);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t){$('#menu').classList.remove('on');return}
  const pe=t.closest('.panel'),p=pe&&panels[pe.dataset.i];
  if(p){
    if(t.dataset.tab){pe.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===t));pe.classList.toggle('a',t.dataset.tab==='auto')}
    if(p.placed&&(t.dataset.act==='inc'||t.dataset.act==='dec'||t.dataset.q))return;
    if(t.dataset.act==='inc')setAmt(p,p.amt+.1);
    if(t.dataset.act==='dec')setAmt(p,p.amt-.1);
    if(t.dataset.q)setAmt(p,+t.dataset.q);
    if(t.dataset.act==='go')go(p);
    if(t.dataset.act==='min')pe.classList.toggle('min');
  }
  if(t.id==='menuBtn'){e.stopPropagation();$('#menu').classList.toggle('on')}
  if(t.id==='reset'){balance=3000;$('#menu').classList.remove('on')}
  if(t.id==='more')$('#hist').classList.toggle('open');
  if(t.dataset.t){tab3=t.dataset.t;document.querySelectorAll('#tabs3 button').forEach(b=>b.classList.toggle('on',b===t));renderList(1)}
});
document.addEventListener('change',e=>{
  const pe=e.target.closest('.panel');if(!pe)return;const p=panels[pe.dataset.i];
  if(e.target.classList.contains('amt')&&!p.placed)setAmt(p,e.target.value.replace(',','.'));
  if(e.target.classList.contains('amt')&&p.placed)e.target.value=fmt(p.amt).replace(/,/g,'');
  if(e.target.dataset.k)p[e.target.dataset.k]=e.target.checked;
  if(e.target.classList.contains('cashat')){p.cashAt=Math.max(1.01,+e.target.value.replace(',','.')||2);e.target.value=p.cashAt.toFixed(2)}
});

/* ---------- dummy backend ---------- */
function genCrash(){const r=Math.random();return r<.03?1:Math.min(500,Math.floor(97/(1-r))/100)}
function rndName(){const c='abcdefghjkmnpqrstuvwxyz0123456789';return c[Math.random()*c.length|0]+'***'+c[Math.random()*c.length|0]}
function genPlayers(){
  const bets=[.5,1,1,2,2,3,5,5,10,10,20,50,100,200,500],n=380+Math.random()*80|0;
  return Array.from({length:n},()=>({av:AV[Math.random()*AV.length|0],name:rndName(),bet:bets[Math.random()*bets.length|0],cash:Math.max(1.05,Math.round((1.05-Math.log(Math.random())*1.4)*100)/100),done:false,win:0})).sort((a,b)=>b.bet-a.bet);
}
const topList=Array.from({length:12},()=>{const b=[10,20,50,100,200][Math.random()*5|0],x=+(20+Math.random()*700).toFixed(2);return{av:AV[Math.random()*AV.length|0],name:rndName(),bet:b,cash:x,done:true,win:b*x}}).sort((a,b)=>b.win-a.win);

/* ---------- ui helpers ---------- */
let tt;function toast(h,bad){const t=$('#toast');t.innerHTML=h;t.className=(bad?'bad ':'')+'on';clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
function renderHist(){$('#hist').innerHTML=hist.slice(0,18).map(x=>`<span class="${cls(x)}">${x.toFixed(2)}x</span>`).join('')+'<button id="more">•••</button>'}
const row=p=>`<div class="r ${p.me?'me ':''}${p.done?'won':''}"><span class="av">${p.av}</span><span class="nm">${p.name}</span><span class="bt">${fmt(p.bet)}</span><span class="xx">${p.done?`<b class="${cls(p.cash)}">${p.cash.toFixed(2)}x</b>`:''}</span><span class="wn">${p.done?fmt(p.win):''}</span></div>`;
function renderList(force){
  const now=performance.now();if(!force&&now-lastList<250)return;lastList=now;
  const mine=panels.filter(p=>p.show).map(p=>({me:1,av:'🚀',name:'You',bet:p.stake,cash:p.cx,done:p.cashed,win:p.win}));
  const done=players.filter(p=>p.done),tw=done.reduce((s,p)=>s+p.win,0)+mine.reduce((s,p)=>s+p.win,0);
  $('#cb').textContent=`${done.length}/${players.length}`;$('#tw').textContent=fmt(tw);
  $('#pg').style.width=(players.length?100*done.length/players.length:0)+'%';
  $('#cnt').textContent=players.length-done.length;
  const list=[...mine,...players.slice(0,30)].map(row).join('');
  $('#list').innerHTML=tab3==='all'?list:tab3==='prev'?(prevHTML||'<div class="empty">No previous round yet</div>'):topList.map(row).join('');
}

/* ---------- round loop ---------- */
function newRound(now){
  state='wait';waitEnd=now+WAIT;m=1;crash=genCrash();players=genPlayers();
  $('#stage').classList.remove('crashed');$('#wait').hidden=false;$('#mult').textContent='1.00x';$('#center').style.visibility='hidden';
  panels.forEach(p=>{p.cashed=false;p.win=0;p.show=false;p.placed=false;
    if(p.queued){p.queued=false;if(balance>=p.amt){balance-=p.amt;p.stake=p.amt;p.placed=true;p.show=true}}});
  renderList(1);
}
function startFlight(now){state='fly';t0=now;$('#wait').hidden=true;$('#center').style.visibility='visible'}
function doCrash(now){
  state='crash';crashAt=now;m=crash;hist.unshift(crash);renderHist();
  $('#stage').classList.add('crashed');$('#mult').textContent=crash.toFixed(2)+'x';
  panels.forEach(p=>{p.placed=false;if(p.autoPlay)p.queued=true});
  renderList(1);prevHTML=[...players.slice(0,30)].map(row).join('');
  setTimeout(()=>newRound(performance.now()),3200);
}
for(let i=0;i<14;i++)hist.push(Math.max(1,+(Math.min(80,0.97/(1-Math.random()))).toFixed(2)));renderHist();

/* ---------- drawing ---------- */
function fit(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);
function rocket(x,y,ang,now,u){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(u,u);
  const fl=2.4+Math.sin(now/45)*.7;
  let g=ctx.createLinearGradient(-5,0,-5-fl,0);g.addColorStop(0,'#ffd23a');g.addColorStop(1,'#ff5a1a00');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-4.4,-.8);ctx.lineTo(-4.4-fl,0);ctx.lineTo(-4.4,.8);ctx.fill();
  ctx.fillStyle='#a30f2b';
  ctx.beginPath();ctx.moveTo(-1.2,-1.3);ctx.lineTo(-4.6,-3.2);ctx.lineTo(-4.1,-1);ctx.fill();
  ctx.beginPath();ctx.moveTo(-1.2,1.3);ctx.lineTo(-4.6,3.2);ctx.lineTo(-4.1,1);ctx.fill();
  ctx.fillStyle='#ff1f4b';ctx.beginPath();ctx.moveTo(-4.3,-1.4);ctx.lineTo(1.6,-1.4);ctx.quadraticCurveTo(4.3,-1.2,5.4,0);ctx.quadraticCurveTo(4.3,1.2,1.6,1.4);ctx.lineTo(-4.3,1.4);ctx.closePath();ctx.fill();
  ctx.fillStyle='#b80f30';ctx.fillRect(-2.9,-1.4,.7,2.8);ctx.fillRect(2.2,-1.4,.5,2.8);
  ctx.fillStyle='#d6ecff';ctx.strokeStyle='#7a0d22';ctx.lineWidth=.35;ctx.beginPath();ctx.arc(.3,0,.95,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(0,-.3,.3,0,7);ctx.fill();
  ctx.restore();
}
function draw(now){
  ctx.clearRect(0,0,W,H);if(state==='wait')return;
  const t=((state==='fly'?now:crashAt)-t0)/1000,p=1-Math.exp(-t/6);
  const x0=0,y0=H+2,bob=Math.min(1,t/5)*Math.sin(now/500)*H*.02;
  const E={x:x0+W*(.13+.52*p),y:y0-H*(.16+.5*p)+bob};
  ctx.beginPath();ctx.moveTo(x0,y0);
  for(let s=.02;s<=1.001;s+=.02)ctx.lineTo(x0+(E.x-x0)*s,y0-(y0-E.y)*s*s);
  ctx.lineTo(E.x,y0);ctx.closePath();ctx.fillStyle='rgba(190,15,45,.6)';ctx.fill();
  ctx.beginPath();ctx.moveTo(x0,y0);
  for(let s=.02;s<=1.001;s+=.02)ctx.lineTo(x0+(E.x-x0)*s,y0-(y0-E.y)*s*s);
  ctx.strokeStyle='#ff1f4b';ctx.lineWidth=4;ctx.shadowColor='#ff1f4b';ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;
  let rx=E.x,ry=E.y,e=0;
  if(state==='crash'){e=Math.min(1,(now-crashAt)/700);rx+=e*e*W*.8;ry-=e*e*H*.5}
  if(e<1)rocket(rx,ry,-Math.atan(1.2*(y0-E.y)/(E.x-x0))*.75,now,W*.017);
}
function frame(now){
  if(state==='wait'){const l=waitEnd-now;if(l<=0)startFlight(now);else $('#bar').style.width=100*(1-l/WAIT)+'%'}
  if(state==='fly'){
    m=Math.exp(.11*(now-t0)/1000);
    if(m>=crash)doCrash(now);
    else{
      $('#mult').textContent=(Math.floor(m*100)/100).toFixed(2)+'x';
      const x=Math.floor(m*100)/100;
      players.forEach(q=>{if(!q.done&&q.cash<=x&&q.cash<crash){q.done=true;q.win=q.bet*q.cash}});
      panels.forEach(p=>{if(p.placed&&!p.cashed&&p.autoCash&&x>=p.cashAt)cashOut(p)});
      renderList();
    }
  }
  $('#bal').textContent=fmt(balance);
  panels.forEach(upd);draw(now);requestAnimationFrame(frame);
}
fit();newRound(performance.now());requestAnimationFrame(frame);
</script>
</body>
