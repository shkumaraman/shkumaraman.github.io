<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flower Catch</title>
<style>
:root{--bg:#0c0c0d;--card:#1b1b1d;--in:#111112;--tx:#e8e8ea;--mut:#8b8b92;--gr:#28a909;--or:#d27a06;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:0 8px 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 8px}
.logo{font-size:27px;font-weight:900}.logo b{color:#ff5da0}
.bal{color:#3bd23b;font-weight:700;font-size:19px}.bal small{color:var(--tx);font-weight:500}
#reset{color:var(--mut);font-size:12px;display:block;text-align:right;text-decoration:underline}
.hist{display:flex;gap:6px;padding:0 8px 8px;overflow:hidden;min-height:30px}
.hist span{padding:4px 10px;border-radius:12px;font-size:13px;font-weight:700;background:#26262a;flex:none}
.hist .w{color:#3bd23b}.hist .l{color:#ff5a6b}
.stats{display:flex;gap:8px;margin-bottom:10px}
.stats div{flex:1;background:var(--card);border-radius:16px;padding:9px 10px;text-align:center;color:var(--mut);font-size:12px}
.stats b{display:block;font-size:20px;color:var(--tx);margin-top:2px}
.stats .big b{color:#ff8fc2}
.field-wrap{position:relative;background:linear-gradient(#181022,#0c0c0d 70%);border-radius:22px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%}
.ov{position:absolute;inset:0;background:#000a;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.25s}
.ov.on{opacity:1;pointer-events:auto}
.ov div{transform:scale(.8);transition:.25s}.ov.on div{transform:none}
.ov h2{margin:0;font-size:34px}.ov p{margin:6px 0 0;font-size:20px;font-weight:700}
.ov.win h2{color:#3bd23b}.ov.lose h2{color:#ff4d67}
.ctl{background:var(--card);border-radius:22px;margin-top:10px;padding:14px}
.lbl{color:var(--mut);font-size:13px;margin:0 0 6px 4px}
.stepper{display:flex;align-items:center;background:var(--in);border-radius:30px;padding:5px}
.stepper button{width:38px;height:38px;border-radius:50%;background:#2c2c2f;font-size:20px;color:var(--mut);flex:none}
.stepper input{flex:1;min-width:0;text-align:center;background:none;border:0;color:var(--tx);font:700 20px inherit;outline:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 0}
.quick button{background:var(--in);border-radius:14px;padding:8px 0;color:var(--mut);font-size:14px}
.dis{opacity:.5;pointer-events:none}
.go{width:100%;margin-top:12px;height:58px;border-radius:16px;font-size:22px;font-weight:800;border:2px solid #ffffff55;box-shadow:0 0 0 3px #0008;background:var(--gr);color:#fff}
.go.or{background:var(--or)}.go:disabled{filter:grayscale(.6) brightness(.6);cursor:not-allowed}
.go small{display:block;font-size:.58em;font-weight:600;opacity:.95}
.hint{text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
</style></head>
<body><div class="app">
<header><div class="logo">🌸 Flower<b> Catch</b></div><div><div class="bal"><span id="bal">3,000.00</span> <small>USD</small></div><button id="reset">Reset balance</button></div></header>
<div class="hist" id="hist"></div>
<div class="stats">
  <div class="big">Multiplier<b id="mult">0.00x</b></div>
  <div>Flowers<b id="cnt">0</b></div>
  <div>Cash value<b id="val">0.00</b></div>
</div>
<div class="field-wrap"><canvas id="cv"></canvas>
  <div class="ov" id="ov"><div><h2 id="ovh"></h2><p id="ovp"></p></div></div>
</div>
<div class="ctl" id="ctl">
  <div id="betrow">
  <p class="lbl">Bet amount (USD)</p>
  <div class="stepper"><button id="bm">−</button><input id="bet" inputmode="decimal" value="1.00"><button id="bp">+</button></div>
  <div class="quick"><button data-q="h">½</button><button data-q="d">2×</button><button data-q="1">1</button><button data-q="10">10</button></div>
  </div>
  <button class="go" id="go">Bet<small></small></button>
  <p class="hint">Swipe / drag your finger over the 🌸 to collect them — avoid the 🔥</p>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
let balance=3000,bet=1,state='idle',hist=[],items=[],pops=[],total=0,count=0,spawnT=0,startT=0,lastP=null;
const VALS=[0.5,0.5,0.5,0.8,0.8,1,1,1.2,1.5,2,2,3,5];
const cv=$('#cv'),ctx=cv.getContext('2d');
let W=0,H=0;
function layout(){const r=cv.parentElement.getBoundingClientRect(),d=devicePixelRatio||1;W=r.width;H=Math.min(440,W*1.02);cv.style.height=H+'px';cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',layout);

function updBal(){$('#bal').textContent=fmt(balance)}
function updStats(){$('#mult').textContent=total.toFixed(2)+'x';$('#cnt').textContent=count;$('#val').textContent=fmt(bet*total)}
function renderHist(){$('#hist').innerHTML=hist.map(h=>h===null?`<span class="l">🔥 BUST</span>`:`<span class="w">${h.toFixed(2)}x</span>`).join('')}
function readBet(){bet=Math.min(1000,Math.max(.1,+($('#bet').value.replace(',','.'))||1));bet=Math.round(bet*100)/100;$('#bet').value=bet.toFixed(2)}
function setBet(v){$('#bet').value=v;readBet();updGo();updStats()}
$('#bm').onclick=()=>setBet(bet-.1);$('#bp').onclick=()=>setBet(bet+.1);
$('#bet').onchange=()=>{readBet();updGo();updStats()};
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;setBet(q==='h'?bet/2:q==='d'?bet*2:+q)});
$('#reset').onclick=()=>{balance=3000;updBal()};

function updGo(){
  const g=$('#go');
  if(state==='play'){g.className='go or';g.disabled=!count;g.innerHTML=count?`Cash Out<small>${fmt(bet*total)} USD</small>`:`Collect a flower first<small>then cash out</small>`}
  else{g.className='go';g.disabled=false;g.innerHTML=`Bet<small>${fmt(bet)} USD</small>`}
  $('#betrow').classList.toggle('dis',state==='play');
}
function overlay(win,txt){
  const o=$('#ov');
  if(win===null){o.className='ov';return}
  o.className='ov on '+(win?'win':'lose');
  $('#ovh').textContent=win?'CASHED OUT!':'BUSTED! 🔥';
  $('#ovp').textContent=txt;
  setTimeout(()=>o.classList.remove('on'),1600);
}

function start(){
  readBet();
  if(balance<bet){flashGo('Insufficient balance');return}
  balance-=bet;updBal();
  state='play';total=0;count=0;items=[];pops=[];spawnT=0;startT=performance.now();
  overlay(null);updStats();updGo();
}
function bust(){
  state='over';hist.unshift(null);hist.length=Math.min(hist.length,14);renderHist();
  overlay(false,`You lost ${fmt(bet)} USD`);updGo();
  setTimeout(()=>{state='idle';updGo()},400);
}
function cashOut(){
  if(state!=='play'||!count)return;
  const win=bet*total;balance+=win;hist.unshift(total);hist.length=Math.min(hist.length,14);renderHist();
  state='over';overlay(true,`${total.toFixed(2)}x  •  +${fmt(win)} USD`);updBal();updGo();
  setTimeout(()=>{state='idle';total=0;count=0;items=[];updStats();updGo()},400);
}
function flashGo(msg){const g=$('#go');const cur=g.innerHTML;g.innerHTML=msg;setTimeout(updGo,1000)}
$('#go').onclick=()=>state==='play'?cashOut():start();

/* spawning */
function spawn(now){
  const el=(now-startT)/1000, fireChance=Math.min(.55,.18+el*.012), gap=Math.max(230,520-el*8);
  if(now-spawnT<gap)return;spawnT=now;
  const isFire=Math.random()<fireChance;
  items.push({x:20+Math.random()*(W-40),y:-24,r:20,vy:1.3+Math.random()*.8+Math.min(2,el*.04),fire:isFire,val:isFire?0:VALS[Math.random()*VALS.length|0],dead:false});
}

/* collision helpers */
function segDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  const cx=x1+t*dx,cy=y1+t*dy;return Math.hypot(px-cx,py-cy);
}
function collectPop(it){pops.push({x:it.x,y:it.y,t:performance.now(),val:it.val})}
function checkSwipe(x,y){
  if(state!=='play')return;
  const p0=lastP||{x,y};
  for(const it of items){
    if(it.dead)continue;
    const d=segDist(it.x,it.y,p0.x,p0.y,x,y);
    if(d<it.r+16){
      it.dead=true;
      if(it.fire)bust();
      else{total+=it.val;count++;collectPop(it);updStats();updGo()}
    }
  }
  lastP={x,y};
}
let pdown=false;
function toLocal(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}
function down(e){pdown=true;const p=toLocal(e);lastP=p;checkSwipe(p.x,p.y);e.preventDefault()}
function move(e){if(!pdown)return;const p=toLocal(e);checkSwipe(p.x,p.y);e.preventDefault()}
function up(){pdown=false;lastP=null}
cv.addEventListener('mousedown',down);cv.addEventListener('mousemove',move);addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',up);

function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.font='30px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){
    if(it.dead)continue;
    ctx.font=it.fire?'32px system-ui':'30px system-ui';
    ctx.fillText(it.fire?'🔥':'🌸',it.x,it.y);
    if(!it.fire){
      ctx.font='700 12px system-ui';ctx.fillStyle='#ffe1f0';
      ctx.fillText(it.val.toFixed(1)+'x',it.x,it.y+20);
    }
  }
  ctx.font='700 15px system-ui';
  pops=pops.filter(p=>now-p.t<650);
  for(const p of pops){
    const t=(now-p.t)/650,yy=p.y-t*36;
    ctx.globalAlpha=1-t;ctx.fillStyle='#7CFC9A';ctx.fillText('+'+p.val.toFixed(1)+'x',p.x,yy);ctx.globalAlpha=1;
  }
}
function tick(now){
  if(state==='play'){
    spawn(now);
    for(const it of items){if(!it.dead)it.y+=it.vy}
    items=items.filter(it=>!it.dead&&it.y<H+30);
  }
  draw(now);requestAnimationFrame(tick);
}
layout();updBal();updStats();updGo();renderHist();requestAnimationFrame(tick);
</script>
</body></html>
